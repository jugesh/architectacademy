<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture Challenge Studio — Architect Academy</title><meta name="description" content="Practice 36 system design challenges with progressive hints, reference designs and failure-mode analysis."><link rel="canonical" href="https://jugesh.github.io/architectacademy/challenges.html"><meta property="og:type" content="website"><meta property="og:title" content="Architecture Challenge Studio — Architect Academy"><meta property="og:description" content="36 real-world architecture interview and production design challenges."><meta property="og:url" content="https://jugesh.github.io/architectacademy/challenges.html"><meta name="twitter:card" content="summary"><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#19283f;--muted:#61708a;--line:#dce5ef;--accent:#087f76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#102d45;color:white;padding:25px clamp(18px,5vw,65px)}header a{color:#a0e6da}h1{font-size:30px;margin:7px 0}h2{font-size:21px;margin:3px 0 12px}h3{font-size:16px;margin:16px 0 6px}p{margin:9px 0 13px}.shell{max-width:1250px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:275px minmax(0,1fr);gap:18px}.sidebar,.panel{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:19px}.sidebar{position:sticky;top:12px;align-self:start;max-height:95vh;overflow:auto}.sidebar input,.sidebar select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.item{display:block;text-align:left;padding:9px 10px;background:transparent;border:0;width:100%;border-radius:8px;color:var(--ink);font-size:12px;cursor:pointer}.item:hover{background:#edf7f5}.item.active{background:#d9f1eb;color:#075e57;font-weight:700}.eyebrow{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#0b7d74;font-weight:850}.pill{font-size:11px;background:#e4f3ef;border-radius:50px;padding:4px 9px;display:inline-block;margin-right:7px}.card{padding:18px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin:15px 0}.scenario{border-left:4px solid #468acc;background:#f0f6ff}.danger{border-left:4px solid #c58b43;background:#fff9e9}.solution{border-left:4px solid #0e9986;background:#e9f9f3}.tradeoff{border-left:4px solid #9266c5;background:#f8f1ff}.button{border-radius:9px;padding:9px 12px;border:1px solid #99b9b3;background:white;color:#086c63;cursor:pointer;font-weight:650}.button.primary{background:#0d8378;color:white;border-color:#0d8378}textarea{display:block;width:100%;min-height:180px;border:1px solid #cbd8e6;border-radius:10px;padding:14px;font:inherit;resize:vertical}.hint{background:#fff7e5;padding:13px;border-radius:9px;margin:10px 0}.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.rubric label{display:block;background:#f3f6fb;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:12px}.rubric input{accent-color:#0d8378}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}.stat{font-size:12px;color:var(--muted)}@media(max-width:800px){.shell{display:block}.sidebar{position:static;max-height:240px;margin-bottom:12px}.sidebar #list{max-height:135px;overflow:auto}}@media print{header,.sidebar,.button{display:none!important}.shell{display:block}.panel{border:0}textarea{min-height:100px}}
</style></head><body><header><a href="index.html">← Textbook</a> · <a href="labs.html">Engineering labs</a><h1>Architecture Challenge Studio</h1><p>36 production scenarios · progressive hints · reference approaches · decision trade-offs · personal answers</p></header><div class="shell"><aside class="sidebar"><input id="search" placeholder="Search challenges…" aria-label="Search challenges"><select id="domain"><option value="">All domains</option></select><select id="level"><option value="">All levels</option><option>Intermediate</option><option>Advanced</option><option>Expert</option></select><p class="stat" id="progress"></p><div id="list"></div><button id="export" class="button">Export my answers</button><input type="file" id="file" accept=".json,application/json" hidden><button id="import" class="button">Import backup</button></aside><main class="panel" id="content"></main></div><script>
const CHALLENGES=[{"id":"c1","title":"20× flash-sale traffic","domain":"Scale","level":"Intermediate","context":"1k average RPS, 20k peak, 90-second scale-up; catalog is read-heavy.","goal":"Protect checkout and reject nonessential work safely.","question":"What percentage is checkout and what is the acceptable queue delay?","approach":"Use CDN/cache for safe catalog reads, reserved checkout admission, prewarming, bounded retries and 503 overload responses.","tradeoff":"Prewarming costs money; asynchronous orders change the user contract.","verification":"Open-loop burst test: p99, critical success rate and zero oversell."},{"id":"c2","title":"Last inventory unit race","domain":"Consistency","level":"Intermediate","context":"Two buyers simultaneously attempt the last item.","goal":"No more than one confirmed stock reservation.","question":"Which service owns the stock invariant?","approach":"Atomic conditional stock decrement or unique reservation in authoritative inventory; events follow commit.","tradeoff":"Strict authority can reduce write availability under partitions.","verification":"Race 100 buyers against one item; exactly one success."},{"id":"c3","title":"Kafka consumer falling behind","domain":"Messaging","level":"Intermediate","context":"Events arrive at 20k/s but consumers process 5k/s.","goal":"Return to freshness SLO after burst.","question":"Is lag concentrated in one partition?","approach":"Measure per-partition offsets and oldest age; fix DB bottleneck, adjust concurrency and throttle noncritical producers.","tradeoff":"More consumers than partitions may not help; rekeying changes ordering.","verification":"Calculate catch-up with continuing arrivals and verify actual event age."},{"id":"c4","title":"Payment succeeds but response disappears","domain":"Consistency","level":"Advanced","context":"Provider captures payment, HTTP response times out.","goal":"Never double charge; converge to correct order state.","question":"Is the merchant reference durable and queryable?","approach":"Persist pending state/idempotency reference; query provider, reconcile capture to order, issue one confirmation.","tradeoff":"Compensation is a real refund operation, not a rollback.","verification":"Crash after provider capture; one charge and eventual resolved order."},{"id":"c5","title":"MongoDB p99 suddenly jumps","domain":"Data","level":"Intermediate","context":"Queries change from 20ms to 900ms after deployment.","goal":"Restore latency without overwhelming cluster.","question":"What is query examined/returned ratio and pool wait?","approach":"Profile slow query, inspect explain/index, isolate expensive endpoints, rollback regression.","tradeoff":"Adding indexes raises write cost; more app pods may worsen pressure.","verification":"Replay realistic data; measure p99 and checkout pool waiting."},{"id":"c6","title":"AWS region lost","domain":"Cloud","level":"Expert","context":"Active region unavailable, replica is 30 sec behind.","goal":"Meet RTO/RPO and forbid split-brain.","question":"How is old writer fenced before standby promotion?","approach":"Fence former authority; promote standby; shift traffic; reconcile payment/order IDs; test failback.","tradeoff":"Cross-region synchronous coordination costs latency and availability.","verification":"Region failure drill measures actual RTO and data discrepancies."},{"id":"c7","title":"Redis hot-key stampede","domain":"Caching","level":"Intermediate","context":"12k/s reads of one key; its TTL expires.","goal":"Prevent database cascade.","question":"Is key miss coalesced and is stale data acceptable?","approach":"Single-flight cache fill, jitter TTL, bounded fallback and stale-while-revalidate on safe reads.","tradeoff":"Pricing/inventory cannot trust arbitrary stale values.","verification":"Expire hot key; compare fallback DB QPS to safety budget."},{"id":"c8","title":"Retry storm across three layers","domain":"Reliability","level":"Advanced","context":"Three nested services each retry twice.","goal":"Recover dependency without 27 downstream attempts per original request.","question":"Who owns retry policy and deadline?","approach":"One controlled retry boundary, capped exponential backoff with jitter, idempotency and circuit breaking.","tradeoff":"Aggressive failure may reduce immediate success, but improves recovery.","verification":"Blackhole and restore provider; no second overload burst."},{"id":"c9","title":"Out-of-order events","domain":"Messaging","level":"Advanced","context":"PaymentCaptured event is handled before PaymentAuthorized.","goal":"Keep payment lifecycle valid.","question":"Is partitioning stable by aggregate ID and are versions included?","approach":"Stable event key, monotonic aggregate version, legal transition checks and reconciliation of gaps.","tradeoff":"Partition order not global; repartition can change assignment.","verification":"Shuffle events and replay; final states satisfy transition rules."},{"id":"c10","title":"Duplicate Kafka delivery","domain":"Messaging","level":"Intermediate","context":"Mongo mutation commits, consumer crashes before offset commit.","goal":"No repeated stock decrement.","question":"Is dedupe atomic with state mutation?","approach":"Transactional inbox with event ID unique key plus business effect; commit offset after application.","tradeoff":"Inbox cleanup/retention adds operational work.","verification":"Crash between state and offset commit; no duplicated effect."},{"id":"c11","title":"MongoDB primary election","domain":"Data","level":"Advanced","context":"Stepdown during burst; clients time out on uncertain writes.","goal":"Avoid losing claimed durable writes and duplicate retry effects.","question":"Which write concern was acknowledged?","approach":"Majority write concern when required, operation IDs, supported retry behavior, post-election reconciliation.","tradeoff":"Durability settings can increase latency and temporary unavailability.","verification":"Simulate stepdown; audit accepted IDs and unknown outcomes."},{"id":"c12","title":"Mongo migration and rollback","domain":"Data","level":"Expert","context":"Cross-account cluster move with writes continuing.","goal":"No uncontrolled two-writer divergence.","question":"What is the authoritative cluster after cutover?","approach":"Baseline snapshot, CDC with resume marker, validation, writer gate/fence, delta catch-up, promotion and reverse-sync plan.","tradeoff":"Dual write is hard to recover when one side fails.","verification":"Test migration plus rollback after new-cluster writes."},{"id":"c13","title":"Noisy enterprise tenant","domain":"Scale","level":"Advanced","context":"One tenant consumes 80% of queue and database concurrency.","goal":"Protect unrelated tenants.","question":"Where is resource fairness enforced?","approach":"Tenant quotas, fair admission, separate pools or isolation tiers, per-tenant SLIs.","tradeoff":"Dedicated resources cost more, shared capacity creates blast radius.","verification":"Saturate one tenant; prove other tenant SLOs."},{"id":"c14","title":"Circuit breaker flapping","domain":"Reliability","level":"Intermediate","context":"Transient provider slowdown opens a global breaker.","goal":"Preserve healthy traffic while limiting failures.","question":"How are rolling thresholds and half-open probes chosen?","approach":"Scope breaker by dependency, use bounded probe concurrency, timeouts and bulkheads.","tradeoff":"Global simplicity sacrifices isolation; over-sensitive thresholds flap.","verification":"Inject intermittent faults and measure recovery."},{"id":"c15","title":"Spring thread starvation","domain":"Java","level":"Intermediate","context":"REST threads block on provider with low CPU use.","goal":"Keep independent endpoints responsive.","question":"Is the contention thread pool or HTTP/DB pool?","approach":"Trace wait stacks; isolate blocking dependency; timeouts and bounded concurrency; measure resource queues.","tradeoff":"Virtual threads ease waiting cost but not downstream capacity.","verification":"Blackhole one API; unrelated endpoint remains within p99."},{"id":"c16","title":"Kubernetes restart loop","domain":"Cloud","level":"Intermediate","context":"Liveness probe calls MongoDB; DB outage restarts every pod.","goal":"Avoid destroying healthy process capacity.","question":"Which probes should be local versus dependency-aware?","approach":"Process-only liveness, intentional readiness, startup grace, balanced thresholds.","tradeoff":"Over-aggressive readiness can take all endpoints offline.","verification":"Disable DB; pods remain alive and recover predictably."},{"id":"c17","title":"HPA misses sudden peak","domain":"Scale","level":"Advanced","context":"Autoscaling takes two minutes during a 20× launch.","goal":"Maintain correctness and critical service during delay.","question":"Can events or launch schedule trigger pre-scaling?","approach":"Warm nodes, predictive scaling, admission limits and DB capacity validation.","tradeoff":"Warm capacity costs money; backlog introduces delayed processing.","verification":"Cold burst test verifies stable critical SLO."},{"id":"c18","title":"AZ fails during deployment","domain":"Cloud","level":"Advanced","context":"One AZ fails while another is draining pods.","goal":"Survive concurrent infrastructure/deploy disruptions.","question":"Are workloads and persistent replicas zone-distributed?","approach":"Topology spread, PDB, staggered rollout, spare capacity and quorum-safe placement.","tradeoff":"Headroom and slower deploys increase operating cost.","verification":"Disable AZ mid-rollout; verify real RTO."},{"id":"c19","title":"Schema field renamed","domain":"Delivery","level":"Intermediate","context":"Old and new Kubernetes pods read/write same Mongo documents.","goal":"Rolling deploy and rollback remain compatible.","question":"Which combinations of writer and reader versions coexist?","approach":"Expand schema, dual-read, backfill with checkpoint, migrate writes, contract after all consumers retire.","tradeoff":"Dual write introduces reconciliation burden.","verification":"Mixed versions and rollback read old/new data."},{"id":"c20","title":"Breaking mobile API change","domain":"API","level":"Intermediate","context":"Service drops field used by older mobile clients.","goal":"Honor supported client compatibility.","question":"How will old versions be identified and retired?","approach":"Consumer-driven contracts, additive rollout, deprecation telemetry and adapter.","tradeoff":"Keeping older behavior increases maintenance.","verification":"Run contracts for all supported mobile versions."},{"id":"c21","title":"Payment webhook reorder","domain":"API","level":"Advanced","context":"Captured callback arrives twice; authorized callback later.","goal":"Payment must never regress or duplicate effect.","question":"Do callbacks include stable ID and signature?","approach":"Verify signature/replay, dedupe inbox, enforce monotonic state and reconcile provider lookup.","tradeoff":"Holding for order can add latency; provider lookup costs.","verification":"Shuffle/duplicate callbacks with one final captured status."},{"id":"c22","title":"Search index freshness","domain":"Consistency","level":"Intermediate","context":"Product changes immediately but search lags minutes.","goal":"Meet explicit search freshness target.","question":"Is stale search permitted to authorize checkout?","approach":"Outbox or CDC to index; measure event-to-visible latency; authoritative checkout recheck.","tradeoff":"Synchronous indexing would couple write availability.","verification":"Pause indexer, restore and verify freshness SLO."},{"id":"c23","title":"Write skew under snapshot isolation","domain":"Data","level":"Expert","context":"Two doctors each leave duty after reading the other on-call.","goal":"At least one doctor always on call.","question":"Do concurrent transactions write separate records?","approach":"Serializable transaction with retry or shared guard record atomic invariant.","tradeoff":"Serialization contention costs throughput.","verification":"Race two doctor updates; invariant preserved."},{"id":"c24","title":"Quorum during partition","domain":"Consistency","level":"Expert","context":"Three replicas split 2-1.","goal":"Never commit conflicting histories.","question":"Does R+W>N prove correct implementation?","approach":"Leader/term quorum protocol with defined commit/read semantics and fencing.","tradeoff":"Minority write availability sacrificed.","verification":"Partition every side and verify one safe write authority."},{"id":"c25","title":"Expired lease stale writer","domain":"Consistency","level":"Advanced","context":"Worker pauses in GC while its lock expires.","goal":"Stale owner cannot overwrite new state.","question":"Does storage check fencing token atomically?","approach":"Monotonically increasing lock tokens; resource rejects older token with write.","tradeoff":"Token infrastructure requires safe monotonic allocation.","verification":"Pause A, let B commit, resume A; reject old write."},{"id":"c26","title":"Global API rate limit","domain":"Scale","level":"Advanced","context":"Twenty pods each locally allow 1k RPS.","goal":"Enforce tenant quotas with known overshoot.","question":"Strict quotas or approximate local leases?","approach":"Central token bucket or leased per-node budgets; bound overshoot explicitly.","tradeoff":"Central quota service adds latency and partition dependency.","verification":"Burst across replicas; measure quota overshoot."},{"id":"c27","title":"DB connection pool exhaustion","domain":"Performance","level":"Advanced","context":"Pool acquisition timeout while DB CPU looks moderate.","goal":"Identify true limiting queue.","question":"Would a larger pool help or worsen database contention?","approach":"Separate pool acquire, query service and wait times; tune concurrency against DB capacity.","tradeoff":"Too-small pool bottlenecks; too-large pool overloads datastore.","verification":"Load sweep charts accepted RPS, p99 and pool wait."},{"id":"c28","title":"Active-active scarce stock","domain":"Consistency","level":"Expert","context":"Disconnected regions both attempt last SKU.","goal":"No global overselling.","question":"Can inventory be escrowed into bounded regional quotas?","approach":"Single authoritative writer or preallocated escrow stock with token transfer.","tradeoff":"Single writer reduces partition availability; escrow reduces inventory flexibility.","verification":"Network partition race cannot exceed total initial stock."},{"id":"c29","title":"Green dashboards, broken checkout","domain":"Observability","level":"Intermediate","context":"Infrastructure health green; conversion declines 30%.","goal":"Detect broken business outcome quickly.","question":"What measures successful checkout attempts?","approach":"Business SLIs, synthetic journeys, trace correlations and settlement mismatch metrics.","tradeoff":"Synthetic traffic needs credible, maintained journeys.","verification":"Break confirmation while health=200; business alert fires."},{"id":"c30","title":"Failback after region recovery","domain":"Cloud","level":"Expert","context":"B is promoted; A returns with stale data.","goal":"Reestablish chosen writer safely.","question":"How does A catch up with writes made in B?","approach":"Keep B authority; replicate/reconcile to A; gate promotion and cut back after validation.","tradeoff":"Immediate failback adds another migration risk.","verification":"Failover+new B writes+failback; no divergent transactions."},{"id":"c31","title":"Cloud cost reduction without SLO loss","domain":"Leadership","level":"Intermediate","context":"Need 30% cost reduction; traffic spiky.","goal":"Lower unit costs while preserving recovery guarantees.","question":"Which spend is spare failure-domain capacity?","approach":"Model unit economics, optimize idle non-prod and excess resources, preserve tested HA headroom.","tradeoff":"Cheapest steady state may cause expensive incidents.","verification":"Cost scenarios include RTO and peak headroom."},{"id":"c32","title":"Kafka vs SQS vs direct HTTP","domain":"Leadership","level":"Advanced","context":"Modest notification service needs retries and replay.","goal":"Select simplest sufficient messaging model.","question":"Does consumer need ordering, replay horizon and multi-fanout?","approach":"ADR comparing outbox+HTTP, SQS, Kafka by contracts and operations.","tradeoff":"Kafka complexity may be unjustified at small scale.","verification":"Prototype failure and replay for selected option."},{"id":"c33","title":"JWT tenant mix-up","domain":"Security","level":"Advanced","context":"Valid tenant A token accesses invoice owned by B.","goal":"Enforce object authorization.","question":"Who verifies tenant-resource ownership?","approach":"Validate issuer/audience and resource-level tenant permissions in owning service.","tradeoff":"Gateway auth alone is insufficient and object checks add work.","verification":"Valid JWT + foreign tenant ID is denied."},{"id":"c34","title":"Read-your-writes after update","domain":"Consistency","level":"Intermediate","context":"User writes to primary, then reads stale replica.","goal":"User sees their just-committed update.","question":"Can client carry causal/version token?","approach":"Session consistency token, primary read or wait-for-replica-version.","tradeoff":"Primary load and waiting latency are trade-offs.","verification":"Delay replication and assert session sees update."},{"id":"c35","title":"Poison message blocks Kafka partition","domain":"Messaging","level":"Advanced","context":"One malformed event retries indefinitely.","goal":"Restore processing without losing required business state.","question":"Does dropping the event break the order lifecycle?","approach":"Bound retries, DLQ rich metadata, repair and replay with reconciliation.","tradeoff":"Skipping without business audit corrupts projection.","verification":"Poison event then later events; repair and converge."},{"id":"c36","title":"100k RPS commerce capstone","domain":"Capstone","level":"Expert","context":"90% catalog reads, 2k checkout writes, multi-AZ, 30s projection SLA.","goal":"Defend a complete correctness and resilience architecture.","question":"Clarify RTO/RPO, tenant security and payment contracts.","approach":"CDN/API, service boundaries, inventory authority, PSP idempotency, transactional outbox, event projections, DR fencing.","tradeoff":"Multiwriter correctness is harder; simpler single authority has failover trade-off.","verification":"Provide C4, two sequences, ADR, capacity math, five failure drills."}];
const KEY='architect-academy-challenges-v1';let saved={answers:{},completed:{},checks:{}};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');saved={...saved,...x}}catch(e){}let current=location.hash.slice(1)||'c1';let hint=0;let showSolution=false;const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){$('status').textContent='Local storage unavailable; export your answers.'}};
function menu(){const query=$('search').value.toLowerCase(),domain=$('domain').value,level=$('level').value;const matches=CHALLENGES.filter(x=>(!domain||x.domain===domain)&&(!level||x.level===level)&&[x.title,x.context,x.domain].join(' ').toLowerCase().includes(query));$('list').innerHTML=matches.map(x=>'<button class="item '+(current===x.id?'active':'')+'" data-id="'+x.id+'">'+(saved.completed[x.id]?'✓ ':'')+esc(x.title)+'</button>').join('')||'<p>No matching challenges.</p>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id));$('progress').textContent=Object.keys(saved.completed).filter(x=>saved.completed[x]).length+' / '+CHALLENGES.length+' completed'}
function go(id){if(!CHALLENGES.some(x=>x.id===id))return;current=id;hint=0;showSolution=false;location.hash=id;render();window.scrollTo(0,0)}
function hintText(x,i){return [x.question,'Start by writing a single correctness invariant and declaring who enforces it. Then list peak traffic, failure domains and observable SLIs.','Compare at least two designs before choosing. Consider this direction: '+x.approach][i]}
function render(){const x=CHALLENGES.find(x=>x.id===current)||CHALLENGES[0];menu();$('content').innerHTML='<div class="eyebrow">Architecture review challenge · '+esc(x.id.toUpperCase())+'</div><h2>'+esc(x.title)+'</h2><div class="row"><span class="pill">'+esc(x.domain)+'</span><span class="pill">'+esc(x.level)+'</span></div><section class="card scenario"><h3>Incident / requirements</h3><p>'+esc(x.context)+'</p><strong>Success criterion</strong><p>'+esc(x.goal)+'</p></section><section class="card"><h3>Your design proposal</h3><p class="muted">Write requirements, invariants, component boundaries, decision, failure paths, observability and rollout. Saved locally on this browser.</p><textarea id="answer" placeholder="1. Clarifying questions&#10;2. Invariants and requirements&#10;3. Architecture&#10;4. Failure and recovery&#10;5. Trade-offs&#10;6. How I would verify it"></textarea><p class="stat" id="status">Autosaved locally · export backups regularly</p></section><div class="row"><button id="hint" class="button">Reveal next hint ('+hint+'/3)</button><button id="solution" class="button">Show reference approach</button></div><div id="hints">'+[0,1,2].slice(0,hint).map(i=>'<div class="hint"><strong>Hint '+(i+1)+'</strong><p>'+esc(hintText(x,i))+'</p></div>').join('')+'</div><section class="card solution '+(showSolution?'':'hidden')+'" id="model"><h3>Reference architecture</h3><p>'+esc(x.approach)+'</p><h3>Trade-off / rejected alternatives</h3><p>'+esc(x.tradeoff)+'</p><h3>How to prove it</h3><p>'+esc(x.verification)+'</p><p class="muted">This is a reference starting point, not a unique universally correct solution. Challenge any assumption that conflicts with the problem statement.</p></section><section class="card tradeoff"><h3>Self-review rubric</h3><div class="rubric">'+['Requirements & assumptions','Business correctness','Failure handling','Operational evidence','Alternatives & cost'].map((v,i)=>'<label><input type="checkbox" data-check="'+i+'" '+((saved.checks[x.id]||[])[i]?'checked':'')+'> '+v+'</label>').join('')+'</div><p class="muted">Use the reference approach to check for omissions; these are self-assessment criteria, not an automatic score.</p></section><div class="row"><button class="button primary" id="done">'+(saved.completed[x.id]?'✓ Completed':'Mark complete')+'</button><button class="button" id="next">Next challenge →</button></div>';
$('answer').value=saved.answers[x.id]||'';$('answer').oninput=()=>{saved.answers[x.id]=$('answer').value;persist();$('status').textContent='✓ Saved locally'};
$('hint').onclick=()=>{hint=Math.min(3,hint+1);render()};$('solution').onclick=()=>{showSolution=!showSolution;render()};$('content').querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const a=saved.checks[x.id]||[];a[Number(b.dataset.check)]=b.checked;saved.checks[x.id]=a;persist()});$('done').onclick=()=>{saved.completed[x.id]=!saved.completed[x.id];persist();render()};$('next').onclick=()=>go(CHALLENGES[(CHALLENGES.findIndex(c=>c.id===current)+1)%CHALLENGES.length].id)}
const domains=[...new Set(CHALLENGES.map(x=>x.domain))].sort();$('domain').innerHTML+=[...domains].map(x=>'<option>'+esc(x)+'</option>').join('');$('search').oninput=menu;$('domain').onchange=menu;$('level').onchange=menu;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'architect-academy-challenge-backup',saved,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='architect-challenges-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.format!=='architect-academy-challenge-backup'||!x.saved)throw Error('Invalid backup');if(confirm('Replace current challenge answers and progress? Export a backup first.')){saved=x.saved;persist();render()}}catch(err){alert(err.message)}finally{e.target.value=''}};window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current&&CHALLENGES.some(x=>x.id===id)){current=id;hint=0;showSolution=false;render()}});render();
</script></body></html>
