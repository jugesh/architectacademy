<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architect Academy — Engineering Labs</title><style>
:root{color-scheme:light;--bg:#f4f7fb;--paper:white;--ink:#14253e;--muted:#51667f;--line:#d6e1ef;--teal:#0c857c}
*{box-sizing:border-box}body{font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);margin:0}header{padding:32px max(20px,calc((100vw - 1060px)/2));background:#132e47;color:white}header a{color:#8fe6dc}h1{font-size:clamp(26px,4vw,37px);margin:8px 0}h2{font-size:21px}main{max-width:1130px;margin:20px auto;padding:0 18px 40px;display:grid;grid-template-columns:minmax(180px,270px) minmax(0,1fr);gap:24px}nav,.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}nav{align-self:start;position:sticky;top:14px}nav button{display:block;width:100%;border:0;border-radius:8px;background:transparent;text-align:left;padding:10px;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}nav button.active{background:#e0f4ef;color:#076b62;font-weight:750}.intro{font-size:17px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.control{padding:14px;border-radius:12px;border:1px solid var(--line);background:#f7fafc}.control label{display:flex;justify-content:space-between;gap:12px;font-weight:600}.control input{width:100%;accent-color:var(--teal);margin-top:12px}.control output{color:#08796f}.result{margin:20px 0;background:#e5f6f1;border-left:5px solid #0b8d7e;border-radius:10px;padding:18px}.result strong{font-size:23px;display:block}.warning{border-left:4px solid #cf8c37;background:#fff6e8;padding:13px 17px;border-radius:8px}.steps{padding:15px 20px;background:#f0f4fe;border-radius:9px}.btn{background:#0c857c;color:white;padding:9px 14px;border:0;border-radius:8px;cursor:pointer}.fine{font-size:12px;color:var(--muted)}@media(max-width:750px){main{display:block}nav{position:static;display:flex;overflow-x:auto;gap:5px;margin-bottom:14px}nav button{min-width:155px}header{padding:24px}}@media print{nav,header .back,.btn{display:none}main{display:block}}
</style></head><body><header><a class="back" href="index.html">← Back to textbook</a><h1>Interactive Engineering Labs</h1><p>Explore capacity, correctness and failure trade-offs by changing assumptions. Every model is illustrative and states its limitations.</p></header><main><nav id="nav" aria-label="Select a lab"></nav><article class="panel" id="stage" aria-live="polite"></article></main><script>
const LABS=[{"id":"lab1","title":"Burst & backlog","type":"queue","fields":[["Incoming events/s",20000],["Consumer capacity/s",5000],["Burst seconds",60],["Ongoing events/s",1000]]},{"id":"lab2","title":"Load shedding","type":"shed","fields":[["Incoming RPS",20000],["Safe RPS",5000],["Critical traffic %",15],["Reserved capacity %",40]]},{"id":"lab3","title":"Little’s Law","type":"little","fields":[["Requests/s",2000],["Mean latency ms",250],["Capacity RPS",5000],["Concurrent limit",1000]]},{"id":"lab4","title":"Quorum math","type":"quorum","fields":[["Replicas N",5],["Read quorum R",3],["Write quorum W",3],["Failed replicas",1]]},{"id":"lab5","title":"Cache meltdown","type":"cache","fields":[["Incoming read RPS",10000],["Normal hit rate %",95],["DB safe RPS",3000],["Outage miss rate %",100]]},{"id":"lab6","title":"Kafka catch-up","type":"catchup","fields":[["Backlog records",900000],["Consume records/s",5000],["New events/s",1000],["Hot partition %",20]]},{"id":"lab7","title":"Tail latency","type":"tail","fields":[["Parallel calls",20],["Slow call probability %",1],["Request deadline ms",500],["Optional calls",5]]},{"id":"lab8","title":"Autoscaling delay","type":"scale","fields":[["Peak RPS",20000],["Warm capacity RPS",5000],["Scale delay sec",90],["Backlog limit",100000]]},{"id":"lab9","title":"Retry amplification","type":"retry","fields":[["Original RPS",2000],["Retries per layer",2],["Retry layers",3],["Dependency capacity RPS",6000]]},{"id":"lab10","title":"Idempotency","type":"idempotency","fields":[["Logical operations",1000],["Attempts per operation",3],["Idempotency coverage %",100],["Payment attempts per op",1]]},{"id":"lab11","title":"Optimistic locking","type":"lock","fields":[["Competing writers",8],["Retry attempts",2],["Record versions",1],["Write latency ms",20]]},{"id":"lab12","title":"Region recovery","type":"region","fields":[["Replication lag sec",30],["Detection sec",60],["Promotion sec",120],["Traffic shift sec",30]]}];
const notes={queue:"Backlog grows only when input exceeds processing. Post-burst drain capacity = consumer capacity minus continuing arrivals.",shed:"Admission must prioritize business-critical operations. Reject or durably defer overload; a growing queue is not capacity.",little:"Little's Law is a long-run average in a stable system. Concurrency does not equal platform thread count.",quorum:"R+W>N is an intersection condition under fixed membership, not a full linearizability proof.",cache:"Losing a cache can multiply database load. Check whether fallback exceeds safe database capacity.",catchup:"Consumers can catch up only if sustained processing rate is above continuing arrival rate.",tail:"Probability assumes independent slow calls. Shared dependencies and correlated outages violate that assumption.",scale:"Warm-up delay matters during spikes. Excess requests must be shed, buffered within limits or served elsewhere.",retry:"Retry attempts multiply across layers. Use budgets, jitter, deadlines and idempotency.",idempotency:"Idempotency requires a durable operation identity and effect guard; coverage percentage is a hypothetical teaching input.",lock:"Only one writer can win an atomic compare-and-set against the same version. Retries require re-reading and recomputing.",region:"RTO component sum is only a planning estimate; actual RPO depends on replication and durability guarantees."};
function calculate(t,v){let [a,b,c,d]=v;let h='',detail='',test='';
switch(t){
case 'queue':{let q=Math.max(0,a-b)*c,net=b-d;h=q.toLocaleString()+' queued events';detail=net>0?'Approximate post-burst drain time: '+Math.ceil(q/net).toLocaleString()+' seconds.':'Backlog cannot drain under continued arrivals.';test='Observe oldest record age and partition skew, not offset lag alone.';break}
case 'shed':{let rejected=Math.max(0,a-b),crit=a*c/100,res=b*d/100;h=rejected.toLocaleString()+' requests/sec exceed capacity';detail='Critical demand '+crit.toLocaleString()+' RPS; reserved capacity '+res.toLocaleString()+' RPS. '+(crit>res?'Critical demand exceeds its reserved share.':'Critical traffic fits its reserved share.');test='Verify checkout success rate and deliberate 503/429 behavior under an open-loop burst.';break}
case 'little':{let L=a*b/1000;h=L.toLocaleString()+' mean requests in flight';detail=(a>c?'Offered demand exceeds safe throughput. ':'Offered demand is within specified throughput. ')+(L>d?'Calculated concurrency is above specified concurrency limit.':'Calculated concurrency is within specified limit.');test='Measure queue wait separately from service time; p99 is not implied by averages.';break}
case 'quorum':{h=b>a||c>a?'Invalid quorum setting':b+c>a?'Read and write groups overlap':'No guaranteed read/write intersection';detail='N='+a+', R='+b+', W='+c+'. '+(a-d>=c?'Configured write quorum remains reachable under assumed failures.':'Configured write quorum is unavailable under assumed failures.');test='Exercise failures and read-version selection; quorum intersection alone is not linearizability.';break}
case 'cache':{let normal=a*(1-b/100),failure=a*d/100;h=Math.round(failure).toLocaleString()+' DB reads/sec in modeled outage';detail='Normal miss traffic '+Math.round(normal).toLocaleString()+'/sec; '+(failure>c?'modeled outage overwhelms specified DB capacity.':'modeled outage is below specified DB capacity.');test='Expire a single popular cache key and check thundering herd/single-flight protection.';break}
case 'catchup':{let net=b-c;h=net>0?Math.ceil(a/net).toLocaleString()+' sec estimated catch-up':'Cannot catch up';detail='Net processing headroom '+net.toLocaleString()+'/sec. '+d+'% hot-partition share is a warning parameter; the formula assumes balanced effective capacity.';test='Check worst partition lag and actual consumer commits after a poison event.';break}
case 'tail':{let p=1-Math.pow(1-b/100,a),required=Math.max(0,a-d);h=(100*p).toFixed(2)+'% chance at least one call is slow';detail=required+' mandatory and '+Math.min(a,d)+' optional calls, modeled under independent latency tails and a '+c+' ms deadline.';test='Disable optional callouts and compare end-to-end p99 latency under correlated slowdown.';break}
case 'scale':{let over=Math.max(0,a-b)*c;h=over.toLocaleString()+' excess requests before scale-out';detail=over>d?'The backlog limit would be exceeded if every excess request were queued.':'The backlog limit could hold excess requests if queue storage and deadlines permit.';test='Test cold start, node capacity and database bottleneck under sudden step-load.';break}
case 'retry':{let max=a*Math.pow(b+1,c);h=max.toLocaleString()+' possible downstream attempts/sec';detail='Worst-case multiplicative retries at every layer versus specified '+d.toLocaleString()+' downstream safe RPS.';test='Add one retry boundary, exponential backoff, jitter and an end-to-end deadline.';break}
case 'idempotency':{let total=a*b,dup=Math.max(0,total-a),prevent=dup*c/100;h=total.toLocaleString()+' transport attempts';detail='Hypothetically '+Math.round(prevent).toLocaleString()+' duplicate attempts are deduplicated; external payment side effects still require their own idempotency and reconciliation. Payment attempts per operation input: '+d+'.';test='Inject a crash after payment capture but before recording success; reconcile by merchant reference.';break}
case 'lock':{h=(a-1).toLocaleString()+' conflicting writes on one original version';detail='At most one atomic update succeeds against a single unchanged version; '+b+' retries need new reads and concurrency control. Version count input '+c+'; per-attempt latency '+d+' ms.';test='Race multiple writers against one document; prove no lost update or unsafe replay.';break}
case 'region':{let rto=b+c+d;h=rto.toLocaleString()+' sec illustrative RTO';detail='Detection '+b+' + promotion '+c+' + traffic shift '+d+'. Async replication is '+a+' sec behind in this scenario, but this is not a guaranteed loss bound.';test='Prove writer fencing, failback catch-up and PSP/order reconciliation in a game day.';break}
}return {h,detail,test}}
function show(id){let lab=LABS.find(x=>x.id===id)||LABS[0];location.hash=lab.id;document.getElementById('nav').innerHTML=LABS.map(x=>'<button class="'+(x.id===lab.id?'active':'')+'" data-target="'+x.id+'">'+x.title+'</button>').join('');document.querySelectorAll('[data-target]').forEach(x=>x.onclick=()=>show(x.dataset.target));
let root=document.getElementById('stage');root.innerHTML='<h2>'+lab.title+'</h2><p class="intro">Change the four parameters to explore a modeled architectural consequence.</p><div class="grid">'+lab.fields.map((x,i)=>'<div class="control"><label>'+x[0]+'<output id="v'+i+'">'+x[1]+'</output></label><input type="range" min="0" max="'+Math.max(x[1]*3,10)+'" step="'+(x[1]>=10000?1000:x[1]>=100?10:1)+'" value="'+x[1]+'" data-i="'+i+'"></div>').join('')+'</div><div class="result"><strong id="headline"></strong><p id="detail"></p></div><div class="warning"><strong>Assumptions & limits</strong><p>'+notes[lab.type]+'</p></div><div class="steps"><strong>Try this verification:</strong><p id="test"></p></div><p><button class="btn" id="reset">Reset parameters</button></p><p class="fine">Training simulation only; no real infrastructure metrics or performance measurements are fetched.</p>';
const controls=[...root.querySelectorAll('input')];function paint(){const vals=controls.map((x,i)=>{root.querySelector('#v'+i).textContent=Number(x.value).toLocaleString();return Number(x.value)}),z=calculate(lab.type,vals);root.querySelector('#headline').textContent=z.h;root.querySelector('#detail').textContent=z.detail;root.querySelector('#test').textContent=z.test}controls.forEach(x=>x.oninput=paint);root.querySelector('#reset').onclick=()=>{controls.forEach((x,i)=>x.value=lab.fields[i][1]);paint()};paint()}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(LABS.some(l=>l.id===id))show(id)});show(location.hash.slice(1));
</script></body></html>
