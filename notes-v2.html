rst identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Apply short deadline and explicit fallback or pending workflow. Long-term prevention: Per-route timeout budgets, circuit breaker, separate pool and health monitoring. Caution: Fallback must not violate compliance or billing correctness.","scenario":"Measure recovery using Timeouts, concurrent calls, fallback ratio. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Resilience"]},{"id":"lesson-77","category":"09 · Production failure notes","title":"Case 15: Retry storm after partial outage","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Ten callers retry three times with aligned backoff. Failure domain: Resilience.","mechanism":"Causal mechanism: Recovery traffic overwhelms repaired service. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Reduce attempts; add jitter and retry budget; use Retry-After. Long-term prevention: End-to-end deadlines, idempotency, adaptive admission. Caution: Retries can turn temporary failure into persistent outage.","scenario":"Measure recovery using Attempt amplification, retries/original request, p99. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Resilience"]},{"id":"lesson-78","category":"09 · Production failure notes","title":"Case 16: Thread-pool starvation","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: One slow report route holds 100 worker threads. Failure domain: Resilience.","mechanism":"Causal mechanism: Fast endpoints wait behind reports. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Move reports to isolated bulkhead; cap report concurrency. Long-term prevention: Separate execution resources, async long-running jobs. Caution: Adding threads increases contention if downstream is finite.","scenario":"Measure recovery using Executor queue age, in-flight by route, rejected work. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Resilience"]},{"id":"lesson-79","category":"09 · Production failure notes","title":"Case 17: Kubernetes CrashLoopBackOff","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: New rollout has OOMKilled pods and aggressive probes. Failure domain: Operations.","mechanism":"Causal mechanism: Restarts hide memory leak and destabilize endpoint capacity. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Rollback image; inspect events, RSS and probe failures. Long-term prevention: Right-size memory; startup/readiness/liveness probes; stress testing. Caution: Liveness probes should not restart a legitimately busy worker indiscriminately.","scenario":"Measure recovery using Restarts, OOM, heap/nonheap, container throttling. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Operations"]},{"id":"lesson-80","category":"09 · Production failure notes","title":"Case 18: HPA too slow during peak","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Traffic triples in 5 seconds; HPA rollout ready in 120 seconds. Failure domain: Scalability.","mechanism":"Causal mechanism: Demand outruns reactive scale. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Apply warm pool or upstream buffering; shed priority 3 traffic. Long-term prevention: Predictive scheduling, queue-based scaling, cold-start improvements. Caution: HPA cannot invent DB throughput.","scenario":"Measure recovery using Scale-out time, ready pod count, admitted work. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Scalability"]},{"id":"lesson-81","category":"09 · Production failure notes","title":"Case 19: AWS Availability Zone failure","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: One AZ loses connectivity while app and DB are partly zonal. Failure domain: Availability.","mechanism":"Causal mechanism: Remaining zones saturate and cross-zone traffic spikes. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Remove unhealthy targets; preserve critical capacity; stop optional workloads. Long-term prevention: N+1 AZ headroom; AZ-independent nodes and data quorum. Caution: Three-zone deployment is not resilient when all pods land in one zone.","scenario":"Measure recovery using Healthy targets, zone-specific p99, replication state. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Availability"]},{"id":"lesson-82","category":"09 · Production failure notes","title":"Case 20: Entire AWS Region failure","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Regional control plane or networking unreachable; primary write region lost. Failure domain: Disaster recovery.","mechanism":"Causal mechanism: Requests cannot write; failover might lose unreplicated events. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Execute approved failover only after authority fencing and RPO assessment. Long-term prevention: Warm standby; DNS/traffic switch; backups; replication + reconciliation drills. Caution: Active-active writes require explicit global conflict design.","scenario":"Measure recovery using RTO, actual RPO, divergence, regional synthetic checks. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Disaster recovery"]},{"id":"lesson-83","category":"09 · Production failure notes","title":"Case 21: Payment succeeds, order fails","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Payment provider commits capture; order DB transaction aborts. Failure domain: Transactions.","mechanism":"Causal mechanism: Money captured with no confirmed order. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Mark unresolved payment for reconciliation and support workflow. Long-term prevention: Payment intent ID, saga state machine, idempotent reversal/refund rules. Caution: A compensation can itself fail or take days.","scenario":"Measure recovery using Unmatched captures, saga age, refund completion. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Transactions"]},{"id":"lesson-84","category":"09 · Production failure notes","title":"Case 22: Partial distributed commit","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Account saved but provisioning event not published. Failure domain: Transactions.","mechanism":"Causal mechanism: Provisioning never begins despite successful account creation. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Scan outbox; reconcile accounts missing downstream state. Long-term prevention: Transactional outbox, idempotent consumer, repair/replay. Caution: A dual-write try/catch does not create an atomic transaction.","scenario":"Measure recovery using Outbox age, accounts without provisioning state. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Transactions"]},{"id":"lesson-85","category":"09 · Production failure notes","title":"Case 23: Incompatible API deployment","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: V2 producer removes a field older consumers require. Failure domain: Evolution.","mechanism":"Causal mechanism: Mixed versions fail in gradual rollout. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Rollback producer or restore compatibility shape. Long-term prevention: Consumer-driven contracts and compatible additive evolution. Caution: Release sequencing is part of interface design.","scenario":"Measure recovery using Deserialization errors, contract violations. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Evolution"]},{"id":"lesson-86","category":"09 · Production failure notes","title":"Case 24: Schema migration breaks old pods","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Column renamed while old pods still serving. Failure domain: Evolution.","mechanism":"Causal mechanism: Old binary crashes on read. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Restore backwards-compatible schema or rollback if safe. Long-term prevention: Expand → backfill → dual-read/dual-write → contract after convergence. Caution: DDL rollback can be irreversible after data rewriting.","scenario":"Measure recovery using Old-version errors, migration progress. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Evolution"]},{"id":"lesson-87","category":"09 · Production failure notes","title":"Case 25: Green dashboards, failing users","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Health endpoints return 200 while checkout confirms only 60%. Failure domain: Observability.","mechanism":"Causal mechanism: Technical probes ignore end-to-end and business outcomes. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Page on conversion/checkout SLO and trace actual failed journeys. Long-term prevention: Golden journeys, business SLIs, tracing and synthetic transactions. Caution: A healthy pod is not equivalent to a healthy product.","scenario":"Measure recovery using Successful checkouts / valid attempts, funnel drop. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Observability"]},{"id":"lesson-88","category":"10 · End-to-end architecture","title":"Design a 100,000 RPS commerce platform","kind":"Lesson","analogy":"A city has many local shops but one authoritative register of scarce tickets.","explanation":"Assume 100k peak HTTP RPS, read-heavy catalog, 2k checkout RPS, 30-second catalog freshness for 99% of updates, and no overselling. These are exercise assumptions, not vendor benchmarks.","mechanism":"Users → CDN/WAF → regional gateway → catalog read cache and search projection. Checkout → order saga → inventory authority → payment provider. Transactional outbox → Kafka → downstream projections. Define RTO/RPO, SLIs and failure modes.","tradeoff":"Single-writer checkout simplifies scarce inventory invariants but requires careful regional promotion. Multiwriter availability is not free.","scenario":"Calculate the number of in-flight checkouts (2,000 × 0.25s ≈ 500), design a 20× spike test, simulate Kafka outage and regional failover, and reconcile all ambiguous payments.","check":"Prepare an ADR, one sequence diagram, three failure injection tests, and a five-minute architecture review.","code":"","tags":[]},{"id":"lesson-89","category":"11 · Architecture practice","title":"Architecture requirements and quality attribute scenarios","kind":"Chapter","analogy":"An architect is like a structural engineer: “safe building” is not a calculation; occupancy, earthquake load, materials and permitted deflection are.","explanation":"Architects turn vague aspirations into testable contracts.","mechanism":"Define functional flows and quality attributes separately. Express each attribute as a scenario with source, stimulus, operating context, target artifact, response and measurement.","tradeoff":"Overly strict numbers increase cost; vague numbers externalize risk to users. Decide whether to reject excess demand, queue it, or relax a feature.","scenario":"A requirement such as “fast checkout” is not testable. Instead: at 2,000 checkout RPS during an AZ failure, 99% of accepted requests finish within 800 ms and no confirmed order oversells inventory.","check":"Write three measurable quality-attribute scenarios for checkout, search and recovery.","code":"","tags":["architecture","advanced"]},{"id":"lesson-90","category":"11 · Architecture practice","title":"Context diagrams, bounded contexts and ownership","kind":"Chapter","analogy":"In a hospital, the pharmacy may see patient data but does not become the owner of medical records.","explanation":"Architecture begins with boundaries, not technology logos.","mechanism":"Draw the system context first: users, internal bounded contexts, external providers and trust boundaries. For every entity identify its authoritative writer, read models, lifecycle and permitted integration events.","tradeoff":"A shared database simplifies early delivery but raises coupling; distributed ownership adds operational cost and consistency work.","scenario":"Two services editing the same MongoDB collection are not independent: they share a schema and deployment constraint. A cleaner boundary has one owner exposing commands/events and a published data contract.","check":"Draw C4 context and container views and an ownership table for five business entities.","code":"","tags":["architecture","advanced"]},{"id":"lesson-91","category":"11 · Architecture practice","title":"C4 diagrams, sequence diagrams and architecture views","kind":"Chapter","analogy":"A city map, floor plan and electrical plan all show the same building but at different levels of detail.","explanation":"Different diagrams answer different questions.","mechanism":"Use C4 context for external relationships, containers for deployable applications and datastores, components for internal responsibilities, and sequence diagrams for temporal behavior. Add deployment and data-flow views for failure zones and trust boundaries.","tradeoff":"Overdiagramming creates stale documents; too little detail hides the critical failure path. Version diagrams with the implementation.","scenario":"A diagram that shows Order → Kafka → Inventory but omits who commits the order cannot establish correctness. Sequence diagrams must include transactions, acknowledgments, retries, timeouts and compensation branches.","check":"Produce a success and timeout sequence, then identify the invariant and corresponding tests.","code":"","tags":["architecture","advanced"]},{"id":"lesson-92","category":"11 · Architecture practice","title":"Architecture decision records and reversible decisions","kind":"Chapter","analogy":"A doctor records diagnosis, rejected alternatives, risks and follow-up—not just a medication name.","explanation":"Decision quality is judged by reasoning and evidence, not tool popularity.","mechanism":"An ADR captures status, context, decision drivers, alternatives, chosen approach, rejected options, consequences, rollback path and evidence. Distinguish easily reversible choices from one-way-door decisions such as partition keys and public API contracts.","tradeoff":"A good choice today may be wrong after 10× growth. Record triggers for revision rather than defending it forever.","scenario":"Example: choose transactional outbox over direct Kafka publish because database commit and event publication cannot share a normal atomic transaction. Alternative: CDC with Debezium, with different operations burden.","check":"Write a one-page ADR for MongoDB sharding versus vertical scaling.","code":"","tags":["architecture","advanced"]},{"id":"lesson-93","category":"11 · Architecture practice","title":"Architecture reviews, risk registers and technical debt","kind":"Chapter","analogy":"A pilot checklist is not bureaucracy when it catches a fuel problem before takeoff.","explanation":"Good governance removes uncertainty before it becomes expensive.","mechanism":"Evaluate correctness, failure modes, observability, operability, security, data lifecycle, performance, cost and rollback. Use a risk register with probability, impact, owner, mitigation and trigger. Distinguish accepted risk from forgotten risk.","tradeoff":"Approval committees can become bottlenecks. Prefer lightweight review with clear thresholds for high-impact decisions.","scenario":"During a design review, a 99.95% uptime promise without DR drills is a risk. Assign owner and evidence: synthetic failover under simulated AZ loss, documented RTO and actual recovery timeline.","check":"Construct a risk register with five risks and explicit evidence to close each.","code":"","tags":["architecture","advanced"]},{"id":"lesson-94","category":"12 · Data architecture","title":"Data modeling, aggregate boundaries and domain invariants","kind":"Chapter","analogy":"A supermarket receipt and stock counter are different documents even when the cashier sees both.","explanation":"The transaction boundary should follow the business rule.","mechanism":"Model aggregate identities and invariants before choosing MongoDB collections or relational tables. Embed objects when ownership and atomic updates align; reference when life cycles and cardinalities differ. Design indexes from query patterns and selectivity.","tradeoff":"Embedding can simplify reads but produce oversized mutable documents. Excessive normalization increases round trips and distributed joins.","scenario":"For an order, address snapshot and order lines often belong together; inventory counts for shared SKUs do not belong inside arbitrary order documents. Cross-aggregate workflows need local commits and recovery.","check":"Model order, inventory and payment aggregates with three invariants and query patterns.","code":"","tags":["architecture","advanced"]},{"id":"lesson-95","category":"12 · Data architecture","title":"Isolation anomalies: dirty reads, write skew and phantoms","kind":"Chapter","analogy":"Two surgeons each check that another surgeon is on call; both see one remaining and both go off duty.","explanation":"A transaction's name alone does not prove the invariant.","mechanism":"Understand read committed, repeatable read, snapshot isolation and serializable semantics in the particular database. Lost updates, write skew and phantom rows depend on how transactions conflict and whether predicates are protected.","tradeoff":"Stronger isolation may incur aborts and throughput cost. Never assume MongoDB transactions, relational ACID, and application-level retries all mean equivalent isolation.","scenario":"With snapshot isolation, two transactions can each read 'at least one doctor on duty' and update different doctor rows. Both commit because they write separate records; the cross-row invariant is broken.","check":"Demonstrate write skew and design a safe repair with explicit isolation assumptions.","code":"","tags":["architecture","advanced"]},{"id":"lesson-96","category":"12 · Data architecture","title":"Schema evolution, expand-contract and online migrations","kind":"Chapter","analogy":"A railway cannot replace every track while trains are moving; it adds a compatible track before retiring the old.","explanation":"Old and new application versions coexist during deployments.","mechanism":"Use expand → migrate/backfill → switch reads/writes → contract. Add nullable or default-compatible fields, dual-read during transition when necessary, and backfill idempotently with checkpoints.","tradeoff":"Dual writes can diverge; backfills can overload the datastore; irreversible destructive migrations make rollback impossible.","scenario":"Version N writes old schema, version N+1 reads both and writes the new form, backfill catches historical documents, then after all old consumers disappear remove the old field. Kafka schema compatibility must be assessed independently.","check":"Write an expand-contract plan for renaming a high-traffic field in MongoDB.","code":"","tags":["architecture","advanced"]},{"id":"lesson-97","category":"12 · Data architecture","title":"Storage engine fundamentals: WAL, compaction and indexes","kind":"Chapter","analogy":"A clerk first writes the transaction in a numbered ledger, then organizes records into cabinets later.","explanation":"Databases do not make writes durable merely by receiving bytes.","mechanism":"Understand write-ahead logging, fsync/durability, B-trees versus log-structured approaches, page caches, compaction, write amplification and index maintenance. Query latency depends on data distribution, index selectivity and cache hit rate.","tradeoff":"Extra indexes speed targeted reads but tax writes and storage. Durability settings balance latency against acknowledged data loss risk.","scenario":"A bulk ingest can appear CPU-light while compaction or secondary-index updates saturate disk I/O. A covering index may avoid document fetches; a low-selectivity index may be worse than a scan.","check":"Explain the read and write paths for a document update with replication.","code":"","tags":["architecture","advanced"]},{"id":"lesson-98","category":"13 · Security & platform","title":"Threat modeling, STRIDE and zero-trust boundaries","kind":"Chapter","analogy":"A hotel receptionist checking ID does not give the guest unrestricted access to every room.","explanation":"Security is a property of flows and trust assumptions, not a gateway checkbox.","mechanism":"Map assets, actors, trust boundaries and abuse paths. STRIDE prompts spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege. Authenticate callers; authorize each business operation and object; minimize service privileges.","tradeoff":"More checks add latency and maintenance but ignoring boundary checks creates lateral-movement opportunities. Avoid logging tokens or sensitive payloads.","scenario":"A JWT can be valid yet its subject must not access another tenant's invoice. Object-level authorization must run in the owning service even if the gateway authenticated the caller.","check":"Perform STRIDE on a checkout and refund flow and design three abuse tests.","code":"","tags":["architecture","advanced"]},{"id":"lesson-99","category":"13 · Security & platform","title":"OAuth2, OIDC, mTLS and service authorization","kind":"Chapter","analogy":"A driver's license proves identity; it does not grant permission to enter a restricted laboratory.","explanation":"Authentication identifies a principal; authorization grants a specific action.","mechanism":"OIDC provides identity on top of OAuth2; OAuth2 delegates scoped access. Validate token issuer, audience, expiry and signatures; use scopes/roles only as inputs to resource-level policy. mTLS authenticates service endpoints, not necessarily the end user.","tradeoff":"Long-lived self-contained tokens reduce introspection load but complicate revocation. mTLS adds deployment/certificate lifecycle complexity.","scenario":"A mobile app obtains an access token for the API; the gateway verifies it. The order service authorizes user U to modify only orders owned by U. A backend worker uses workload identity with a distinct purpose-limited credential.","check":"Create a security contract for API gateway, order service and message consumer.","code":"","tags":["architecture","advanced"]},{"id":"lesson-100","category":"13 · Security & platform","title":"Multi-tenancy, noisy neighbors and isolation models","kind":"Chapter","analogy":"In an apartment building, one tenant should not consume all the water pressure or see another tenant's mail.","explanation":"A shared platform needs explicit fairness and isolation guarantees.","mechanism":"Choose shared table with tenant keys, database-per-tenant, or account-per-tenant based on isolation, regulatory, operational and cost requirements. Enforce tenant identity at ingress and data-access layers; avoid trusting tenantId from user input.","tradeoff":"Dedicated stacks improve isolation but raise upgrade and operational cost. Shared stacks offer economies but expand blast radius.","scenario":"A tenant with a faulty integration sends 80% of traffic. Per-tenant quotas, queue partitions, concurrency pools and budgets prevent it from starving others. Ensure every index and cache key includes tenancy where required.","check":"Design tenant isolation for 200 enterprise customers with a few large accounts.","code":"","tags":["architecture","advanced"]},{"id":"lesson-101","category":"13 · Security & platform","title":"Data privacy, retention and encryption boundaries","kind":"Chapter","analogy":"A filing cabinet that never discards outdated records becomes both expensive and dangerous.","explanation":"Keeping data forever is a hidden architecture decision.","mechanism":"Classify PII, secrets and financial data. Set retention and deletion policies, map data copies across logs, caches, backups and projections, and choose encryption in transit and at rest. Understand key ownership, rotation and auditability.","tradeoff":"Strict deletion may conflict with legal retention obligations and audit needs. Define policy with legal/security rather than inventing retention windows.","scenario":"A user's deletion request reaches the source database but leaves identifiers in Kafka compacted topics, analytics, search snapshots and logs. A complete lifecycle has deletion propagation, backup expiry and exception documentation.","check":"Draw data lineage for an order event and identify every copy requiring controls.","code":"","tags":["architecture","advanced"]},{"id":"lesson-102","category":"14 · Delivery & operations","title":"CI/CD, progressive delivery and deployment safety","kind":"Chapter","analogy":"A chef introduces a new recipe to one table before changing dinner for the whole restaurant.","explanation":"A deployment is a controlled experiment with a rollback path.","mechanism":"Use reproducible builds, artifact provenance, security scanning, contract tests, canary or blue-green deployment, feature flags and automated rollback signals. Separate deploy from release and from irreversible schema changes.","tradeoff":"Feature flags require cleanup and evaluation; a canary may miss tenant-specific paths if traffic is unrepresentative.","scenario":"Route 5% of traffic to the candidate. Compare request success, p99, saturation and business conversion against control; progressively increase only while guardrails hold. Avoid sampling only healthy endpoints.","check":"Create a release plan for an API and Kafka schema change with rollback rehearsals.","code":"","tags":["architecture","advanced"]},{"id":"lesson-103","category":"14 · Delivery & operations","title":"Kubernetes requests, limits, scheduling and probes","kind":"Chapter","analogy":"A shop with its lights on may still have no staff or stock.","explanation":"A container being 'running' does not mean it can safely accept work.","mechanism":"CPU requests affect scheduling; CPU limits can throttle; memory limits risk OOM kills. Startup probes allow slow initialization, readiness gates routing, and liveness triggers restarts. Misconfigured liveness during database outage can turn a dependency fault into a restart storm.","tradeoff":"Overprovisioning costs money, yet zero spare nodes creates scaling delays. Overly aggressive probes reduce availability.","scenario":"An app consumes all JDBC pool connections. Liveness probe checks the database and fails, restarting every pod. Proper design keeps liveness local to process health; readiness may temporarily stop traffic but should avoid coordinated failure.","check":"Design probes, resources, PDB and autoscaling for a 20× burst.","code":"","tags":["architecture","advanced"]},{"id":"lesson-104","category":"14 · Delivery & operations","title":"Terraform, infrastructure drift and blast radius","kind":"Chapter","analogy":"A building blueprint matters only if the constructed building still matches it.","explanation":"Infrastructure configuration deserves the same review rigor as application code.","mechanism":"Manage resources declaratively and review plans for destructive effects, IAM scope, region dependencies, networking and persistent storage. Keep secrets outside state wherever supported, protect remote state, and segment state/projects to control blast radius.","tradeoff":"Small modules ease reuse but excessive abstraction obscures resources and changes. Reusable IaC is not necessarily safer if the blast radius grows.","scenario":"A shared Terraform state holds networking and production databases. A mistaken refactor produces a destructive plan affecting both. Boundaries, explicit approvals, state locking and backups narrow the failure.","check":"Draft infrastructure ownership and approvals for dev, staging and production.","code":"","tags":["architecture","advanced"]},{"id":"lesson-105","category":"14 · Delivery & operations","title":"Incident command, runbooks and postmortems","kind":"Chapter","analogy":"Firefighters assign an incident commander; they do not all independently change the building's electrical switches.","explanation":"Recovery speed depends as much on coordination as technology.","mechanism":"Define severity and roles: incident commander coordinates; operations mitigates; communications keeps stakeholders informed; scribes preserve the timeline. Runbooks contain triggers, commands, safety checks, rollback and validation. Postmortems focus on conditions and system improvements.","tradeoff":"Too many people executing uncoordinated fixes creates new incidents. Excessive approval chains delay mitigation.","scenario":"Kafka lag grows and checkout errors spike. A coordinator freezes nonessential deploys, an operator identifies the bottleneck, another checks business outcomes, and a communicator updates expected impact based on evidence.","check":"Write a 15-minute on-call runbook for degraded checkout.","code":"","tags":["architecture","advanced"]},{"id":"lesson-106","category":"15 · Economics & decisions","title":"Cost modeling, unit economics and capacity reserves","kind":"Chapter","analogy":"A delivery company can buy 100 trucks for holiday demand or combine reservations, rentals and scheduling.","explanation":"Architecture is optimization under multiple budgets.","mechanism":"Track marginal cost per transaction, baseline infrastructure, standby capacity, data transfer, storage growth, third-party requests and engineering operations. Convert architecture choices into monthly spend and user-facing SLO consequences.","tradeoff":"Cloud autoscaling is not a substitute for cost controls or dependency quotas. Lower cost can raise incident probability; higher cost can still deliver no useful resilience.","scenario":"A multi-region active-active design doubles some steady-state costs and increases synchronization complexity. For a service with a one-hour RTO, a warm standby may be sufficient; for a 30-second RTO, more permanent capacity may be warranted.","check":"Write a cost and reliability comparison for three regional deployment strategies.","code":"","tags":["architecture","advanced"]},{"id":"lesson-107","category":"15 · Economics & decisions","title":"Technology selection and architectural fitness functions","kind":"Chapter","analogy":"Buying a racing car to deliver groceries adds maintenance without solving the customer's problem.","explanation":"Choose the simplest system that satisfies measured constraints.","mechanism":"Build a decision matrix with correctness requirements, workload shape, data size, team expertise, operations maturity, security, portability and exit cost. Use architecture fitness functions—automated checks for boundary rules and quality attributes.","tradeoff":"Highly managed services reduce operational ownership but can increase lock-in and billing variability. Self-hosting buys control at a staffing cost.","scenario":"Before adopting Kafka, compare HTTP+outbox, SQS and Kafka on ordering, replay horizon, consumer count, delivery semantics, operations and scale. The best answer can be 'do not introduce a broker yet'.","check":"Build a weighted trade-off matrix and list assumptions that could reverse its ranking.","code":"","tags":["architecture","advanced"]},{"id":"lesson-108","category":"15 · Economics & decisions","title":"Architecture leadership, delegation and review culture","kind":"Chapter","analogy":"A chief architect cannot personally lay every brick; they define standards, inspect critical joins and develop capable foremen.","explanation":"A senior architect scales decisions through people, not personal heroics.","mechanism":"Set guardrails for teams: API contracts, data ownership, threat modeling, SLOs, observability, deployment gates and ADR thresholds. Delegate implementation authority with clear invariants and review checkpoints. Coach engineers to defend decisions and produce evidence.","tradeoff":"Centralized approval may make the architect a bottleneck. Total autonomy can fragment standards. Aim for federated decisions with common guardrails.","scenario":"Two teams need the same customer data. Instead of centrally writing both integrations, facilitate ownership negotiation, define a stable contract, and ask teams to demonstrate consumer contract tests and failure behavior.","check":"Draft a lightweight architecture-review rubric and delegation plan.","code":"","tags":["architecture","advanced"]},{"id":"lesson-109","category":"16 · Networking and coordination","title":"DNS, TTLs and service discovery","kind":"Chapter","analogy":"A company changes offices; old business cards and map caches still send customers to the previous location.","explanation":"DNS maps names to addresses, but caches mean updates do not instantly redirect everyone.","mechanism":"DNS TTL controls some caches but clients, resolvers, persistent connections and application discovery each have behavior. Service discovery in Kubernetes adds endpoint propagation and readiness changes.","scenario":"A region fails; DNS failover publishes a new target yet existing TCP connections, client caches and sessions still target the previous one.","tradeoff":"Low TTL may increase resolver load without guaranteeing instantaneous failover; service discovery is part of recovery, not the only mechanism.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-110","category":"16 · Networking and coordination","title":"TCP connection pools, keepalive and head-of-line blocking","kind":"Chapter","analogy":"A one-lane bridge makes a fast car wait behind a broken truck; more lanes cost space and supervision.","explanation":"Transport choices determine where requests wait when dependencies become slow.","mechanism":"TCP tracks ordered byte streams and retransmits losses. HTTP/1.1 keepalive reduces handshake cost but connection count can become a queue boundary; HTTP/2 multiplexes streams over one connection yet TCP-level loss can still affect streams.","scenario":"An HTTP client pool of 20 connections serves a dependency suddenly taking two seconds per call. Waiting can dominate latency while CPU remains idle.","tradeoff":"Unbounded connections can overload the dependency; overly tight pools create artificial head-of-line waiting.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-111","category":"16 · Networking and coordination","title":"TLS, certificates and trust chains","kind":"Chapter","analogy":"A sealed envelope protects contents only if you verify the recipient address.","explanation":"Encryption is not meaningful unless the client verifies whom it is talking to.","mechanism":"TLS negotiates encrypted transport and authenticates the server using certificates and trusted issuers. Service-to-service mTLS also authenticates client workload identity; certificate rotation and trust-store management are production concerns.","scenario":"An internal service certificate expires at midnight and every service-to-service call begins failing. Retry storms amplify the outage.","tradeoff":"Disabling certificate verification may 'fix' connectivity while invalidating the entire trust model.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-112","category":"16 · Networking and coordination","title":"HTTP/2, HTTP/3 and connection multiplexing","kind":"Chapter","analogy":"Multiple checkout lines improve parallel service, but if every line shares one blocked tunnel, a tunnel failure affects all.","explanation":"A faster protocol is only faster when the request pattern and network support it.","mechanism":"HTTP/2 multiplexes request streams over TCP, compresses headers and supports flow control. HTTP/3 uses QUIC over UDP with different transport recovery behavior. Protocol termination at proxies can change end-to-end semantics.","scenario":"A gateway advertises HTTP/2 while downstream is HTTP/1.1 with a small connection pool, so multiplexing at the edge hides an inner bottleneck.","tradeoff":"Complex protocol rollout increases observability and compatibility needs; optimize measured bottlenecks first.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-113","category":"16 · Networking and coordination","title":"Distributed consensus: Raft, terms and commit indices","kind":"Chapter","analogy":"A committee can record one official decision only after enough members have signed, despite an absent member.","explanation":"Replicas need a safe way to agree which operations are committed.","mechanism":"Raft separates leader election, log replication and safety. Terms make leadership epochs explicit; majority replication determines commitment under Raft's rules. Applying the log to a state machine follows committed order.","scenario":"Leader A becomes isolated; the majority elects B, which commits new records. A must not continue behaving as authoritative simply because clients can still reach it.","tradeoff":"Consensus costs coordination and quorum availability; not every event feed or cached projection needs it.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-114","category":"16 · Networking and coordination","title":"Failure detectors, heartbeats and phi accrual","kind":"Chapter","analogy":"A friend not answering the phone could be asleep, traveling or without signal—not necessarily missing.","explanation":"A silent node may be crashed, slow, or unreachable; a timeout is a suspicion.","mechanism":"In an asynchronous network, perfect failure detection is impossible under arbitrary delay. Heartbeats and adaptive detectors estimate suspicion; phi-accrual style detectors model observed arrival intervals.","scenario":"During GC pauses, heartbeats stop; orchestration ejects a healthy instance while its in-flight work is still active.","tradeoff":"Aggressive detection speeds reaction but increases false positives and flapping; slow detection extends recovery time.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-115","category":"16 · Networking and coordination","title":"Time synchronization, NTP and clock uncertainty","kind":"Chapter","analogy":"Two wall clocks disagree by a minute; each clerk thinks their receipt happened first.","explanation":"Physical time is useful for logging and expiry but is not a complete ordering guarantee.","mechanism":"NTP and cloud time services reduce skew but do not eliminate uncertainty. Wall-clock timestamps can move; monotonic clocks are better for measuring durations within a process. Cross-node causal order needs logical sequence or database versions.","scenario":"Two regions resolve a write conflict using last-write-wins timestamps; skew causes a newer business update to lose.","tradeoff":"Stronger global-time guarantees require infrastructure and still need documented uncertainty bounds.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-116","category":"16 · Networking and coordination","title":"Leader election versus distributed locking","kind":"Chapter","analogy":"A team captain is chosen for the season; booking a conference room grants temporary exclusive use.","explanation":"Electing a leader and locking a resource solve related but different authority questions.","mechanism":"Leader election coordinates who makes decisions for a replicated group. A distributed lock controls temporary ownership of a resource. Both can suffer stale holders unless the protected operation checks a term or fencing token.","scenario":"A scheduled billing job starts in two regions during failover. Both possess plausible lock state and generate duplicate invoices.","tradeoff":"Consensus-backed exclusive authority sacrifices some partition availability to protect correctness.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-117","category":"17 · API and integration design","title":"Pagination, cursors and stable ordering","kind":"Chapter","analogy":"A librarian hands you pages of a moving catalog while books are constantly added.","explanation":"A paginated API must define what happens when records change between pages.","mechanism":"Offset pagination can skip or repeat rows when inserts alter position. Cursor pagination uses a stable sort key and tie-breaker such as (createdAt, id), together with an opaque page token.","scenario":"An order-history endpoint sorts only by createdAt; two orders have identical timestamps and pages duplicate records.","tradeoff":"Stable snapshots need extra storage/coordination; keyset pagination is often sufficient for feeds but cannot provide arbitrary page-number jumps cheaply.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-118","category":"17 · API and integration design","title":"BFF, aggregation and API composition","kind":"Chapter","analogy":"A travel agent coordinates airline, hotel and transport; it should not pretend to be each company's legal recordkeeper.","explanation":"A client-facing API boundary should optimize the client journey without owning every backend's data.","mechanism":"A Backend-for-Frontend aggregates downstream responses, implements client-specific shaping, authentication propagation and graceful optional fallbacks. It should avoid writing authoritative state that belongs elsewhere.","scenario":"Mobile page needs product price, promotions and recommendations; a BFF gathers them concurrently with a 500 ms deadline, allowing recommendations to time out while authoritative price still governs checkout.","tradeoff":"More aggregators can increase network hops and ownership ambiguity; client simplicity must justify server complexity.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-119","category":"17 · API and integration design","title":"Webhooks, callbacks and eventual delivery","kind":"Chapter","analogy":"A courier may deliver the same notification twice and may not receive a signature even when it arrived.","explanation":"An outbound callback is a distributed message with uncertain delivery.","mechanism":"Sign webhooks with rotating secrets; include event ID and timestamp, validate replay window, publish durable attempts, retry with bounded backoff and expose delivery status. Receiver needs idempotency and schema compatibility.","scenario":"A payment provider sends 'captured' twice and 'authorized' arrives late. Naive status assignment regresses a completed payment.","tradeoff":"Strong ordering is rarely guaranteed across independent webhook retries; business versions and reconciliation matter.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"lesson-120","category":"17 · API and integration design","title":"Data contracts, schema registry and consumer evolution","kind":"Chapter","analogy":"A newspaper changes the meaning of a familiar column header; subscribers misread yesterday's figures.","explanation":"Events are public APIs even when they travel over a broker.","mechanism":"Specify producer ownership, field meaning, nullability, schema compatibility policy, versioning and deprecation. Schema registry compatibility modes are tools, not substitutes for semantic compatibility.","scenario":"Producer changes amount from cents to rupees without renaming it. Schema remains technically valid but downstream invoices become 100× wrong.","tradeoff":"Rigid contracts slow evolution; absent contracts shift costs into production incidents.","check":"Draw the success and failure path, identify state owners and write a measurable acceptance test.","code":"","tags":["architecture","fundamentals"]},{"id":"notes-1","category":"Supplement · Security essentials","title":"SQL injection and safe SQL","kind":"Notes","explanation":"Untrusted input must remain data, never part of SQL syntax.","analogy":"A login or search parameter is concatenated into SELECT statements, changing the query or leaking tenant rows.","mechanism":"Use JDBC PreparedStatement or ORM parameter binding; permit dynamic identifiers only through server-controlled allowlists; authorize row ownership separately.","tradeoff":"Parameterization does not protect a missing tenant predicate or broad database permissions.","scenario":"A login or search parameter is concatenated into SELECT statements, changing the query or leaking tenant rows.","code":"Java: PreparedStatement ps = conn.prepareStatement(\"SELECT id FROM orders WHERE tenant_id=? AND id=?\"); ps.setString(1, tenantId); ps.setLong(2, orderId);","whenNot":"A login or search parameter is concatenated into SELECT statements, changing the query or leaking tenant rows.","howNot":"A login or search parameter is concatenated into SELECT statements, changing the query or leaking tenant rows."},{"id":"notes-2","category":"Supplement · Security essentials","title":"Cross-site scripting (XSS)","kind":"Notes","explanation":"A browser executes attacker-controlled script when application content is rendered unsafely.","analogy":"A product description stored by a seller is inserted using innerHTML; a buyer opens the page and runs attacker-provided JavaScript.","mechanism":"Use textContent and contextual output encoding; sanitize only when rich HTML is truly required; deploy restrictive CSP as defense in depth.","tradeoff":"CSP is not a substitute for encoding, and trusting 'internal' input often permits stored attacks.","scenario":"A product description stored by a seller is inserted using innerHTML; a buyer opens the page and runs attacker-provided JavaScript.","code":"JavaScript: element.textContent = untrustedProductName; // not element.innerHTML = ...","whenNot":"A product description stored by a seller is inserted using innerHTML; a buyer opens the page and runs attacker-provided JavaScript.","howNot":"A product description stored by a seller is inserted using innerHTML; a buyer opens the page and runs attacker-provided JavaScript."},{"id":"notes-3","category":"Supplement · Security essentials","title":"CSRF and cookie-authenticated APIs","kind":"Notes","explanation":"Browsers may attach session cookies to cross-site state-changing requests.","analogy":"A signed-in user visits a malicious page that triggers a money-transfer POST.","mechanism":"Use anti-CSRF tokens for session-cookie flows; SameSite cookie policy, Origin checks where appropriate and unsafe-method restrictions. Keep authorization checks.","tradeoff":"CORS alone does not stop form-based CSRF; SameSite is not an all-purpose substitute.","scenario":"A signed-in user visits a malicious page that triggers a money-transfer POST.","code":"Spring Security: configure a CSRF token repository for cookie-session clients; test rejected POST without a valid token.","whenNot":"A signed-in user visits a malicious page that triggers a money-transfer POST.","howNot":"A signed-in user visits a malicious page that triggers a money-transfer POST."},{"id":"notes-4","category":"Supplement · Security essentials","title":"SSRF and network egress controls","kind":"Notes","explanation":"Servers that fetch arbitrary user URLs can be tricked into reaching private services.","analogy":"An image-fetch endpoint follows a redirect to a cloud metadata IP or internal admin endpoint.","mechanism":"Allowlist destinations or tightly restrict protocols, ports, resolved addresses and redirects. Enforce deny rules at the network egress layer and bound timeouts/response size.","tradeoff":"Hostname checks before DNS resolution are bypassable; redirects and DNS rebinding can defeat superficial checks.","scenario":"An image-fetch endpoint follows a redirect to a cloud metadata IP or internal admin endpoint.","code":"Test redirect chains, DNS changes, IPv4 and IPv6 local/private ranges before release.","whenNot":"An image-fetch endpoint follows a redirect to a cloud metadata IP or internal admin endpoint.","howNot":"An image-fetch endpoint follows a redirect to a cloud metadata IP or internal admin endpoint."},{"id":"notes-5","category":"Supplement · API and transport","title":"WebSockets and durable reconnect","kind":"Notes","explanation":"WebSockets maintain a bidirectional connection, but messages are not automatically durable.","analogy":"A stock-price feed delivers updates to a browser while a Kubernetes node restarts and clients disconnect.","mechanism":"Authenticate the handshake, authorize channels, use heartbeat and backpressure, reconnect with a cursor and fetch missed state from durable storage.","tradeoff":"Long-lived connections consume memory and complicate load balancing and rolling deployment.","scenario":"A stock-price feed delivers updates to a browser while a Kubernetes node restarts and clients disconnect.","code":"Flow: connect → authenticate → subscribe → receive sequence N → disconnect → reconnect(N) → catch up.","whenNot":"A stock-price feed delivers updates to a browser while a Kubernetes node restarts and clients disconnect.","howNot":"A stock-price feed delivers updates to a browser while a Kubernetes node restarts and clients disconnect."},{"id":"notes-6","category":"Supplement · API and transport","title":"Server-Sent Events (SSE)","kind":"Notes","explanation":"SSE streams one-way server updates over HTTP using text/event-stream.","analogy":"An order status page shows Pending, Paid and Shipped changes without polling repeatedly.","mechanism":"Return event IDs and heartbeats, support Last-Event-ID reconnection, disable proxy buffering and maintain a way to re-fetch current authoritative status.","tradeoff":"SSE provides no client-to-server message channel and not guaranteed delivery without replay logic.","scenario":"An order status page shows Pending, Paid and Shipped changes without polling repeatedly.","code":"HTTP: Content-Type: text/event-stream; id: 41; event: order-status; data: {\"status\":\"PAID\"}.","whenNot":"An order status page shows Pending, Paid and Shipped changes without polling repeatedly.","howNot":"An order status page shows Pending, Paid and Shipped changes without polling repeatedly."},{"id":"notes-7","category":"Supplement · API and transport","title":"Long polling versus push","kind":"Notes","explanation":"Long polling holds a request until data appears or its wait timeout expires.","analogy":"A mobile client requests updates, holds the connection for up to 25 seconds and reconnects after response.","mechanism":"Track a durable cursor, cap waiter counts, send an empty timeout response when needed, and add randomized client reconnect delay.","tradeoff":"Repeated connection setup can be expensive; herd reconnection spikes can overload the server.","scenario":"A mobile client requests updates, holds the connection for up to 25 seconds and reconnects after response.","code":"GET /events?cursor=123 → wait up to 25 s → return updates and next cursor.","whenNot":"A mobile client requests updates, holds the connection for up to 25 seconds and reconnects after response.","howNot":"A mobile client requests updates, holds the connection for up to 25 seconds and reconnects after response."},{"id":"notes-8","category":"Supplement · API and transport","title":"gRPC and Protobuf contract evolution","kind":"Notes","explanation":"gRPC uses typed service contracts and commonly HTTP/2 for unary and streaming RPC.","analogy":"A Java service calls an internal Go pricing service over an evolving RPC interface.","mechanism":"Define .proto fields carefully; do not reuse tag numbers; propagate deadlines, trace metadata and authentication. Test older clients against newer server contracts.","tradeoff":"Typed messages do not guarantee business-semantic compatibility; streaming requires cancellation and backpressure handling.","scenario":"A Java service calls an internal Go pricing service over an evolving RPC interface.","code":"proto3: service PriceService { rpc Quote (QuoteRequest) returns (QuoteReply); }","whenNot":"A Java service calls an internal Go pricing service over an evolving RPC interface.","howNot":"A Java service calls an internal Go pricing service over an evolving RPC interface."},{"id":"notes-9","category":"Supplement · Runtime and delivery","title":"Docker images and container hardening","kind":"Notes","explanation":"A container packages user-space dependencies but shares the host kernel.","analogy":"A production Java container runs as root with a large outdated base image.","mechanism":"Prefer multi-stage builds, pinned base digests, minimal runtime, non-root user, image scanning, SBOM and immutable release identifiers.","tradeoff":"Minimal images reduce attack surface but can complicate debugging and certificate/tool availability.","scenario":"A production Java container runs as root with a large outdated base image.","code":"Dockerfile pattern: FROM eclipse-temurin:21-jre; USER 10001; COPY app.jar /app.jar; ENTRYPOINT [\"java\",\"-jar\",\"/app.jar\"]","whenNot":"A production Java container runs as root with a large outdated base image.","howNot":"A production Java container runs as root with a large outdated base image."},{"id":"notes-10","category":"Supplement · Runtime and delivery","title":"Helm charts and safe Kubernetes releases","kind":"Notes","explanation":"Helm templates and packages Kubernetes configuration; it does not guarantee its safety.","analogy":"A values override silently disables production readiness probes.","mechanism":"Use typed values schema, helm template/lint, environment overlays, image digests, policy checks and deployment diff before applying.","tradeoff":"Too many nested templating conditions can hide dangerous defaults and make debugging difficult.","scenario":"A values override silently disables production readiness probes.","code":"Command: helm template checkout ./chart -f values-prod.yaml; review service, probes, security and resources.","whenNot":"A values override silently disables production readiness probes.","howNot":"A values override silently disables production readiness probes."},{"id":"notes-11","category":"Supplement · Runtime and delivery","title":"Backup, PITR and restore drills","kind":"Notes","explanation":"Replication copies accidental deletes; backups are independent recovery assets.","analogy":"An accidental MongoDB delete propagates to every replica.","mechanism":"Keep encrypted, isolated/immutable copies; snapshot plus change log for point-in-time restore; rehearse full application recovery and reconciliation.","tradeoff":"Snapshots alone may miss latest writes and can be inconsistent across multiple databases.","scenario":"An accidental MongoDB delete propagates to every replica.","code":"Drill: restore to isolated account at 14:04, compare business record counts, then reconcile newer external payments.","whenNot":"An accidental MongoDB delete propagates to every replica.","howNot":"An accidental MongoDB delete propagates to every replica."},{"id":"notes-12","category":"Supplement · Performance and concurrency","title":"N+1 queries and ORM fetch plans","kind":"Notes","explanation":"One parent query can unexpectedly trigger a new database query for every result.","analogy":"Fetching 100 orders lazily loads each customer individually, producing 101 SQL calls.","mechanism":"Use controlled fetch joins, entity graphs, bulk lookup, batching and pagination while checking the actual SQL and query plan.","tradeoff":"One enormous JOIN FETCH can create cartesian explosions and duplicate records.","scenario":"Fetching 100 orders lazily loads each customer individually, producing 101 SQL calls.","code":"Java/JPA: SELECT o FROM Order o JOIN FETCH o.customer WHERE o.id IN :ids; validate pagination behavior.","whenNot":"Fetching 100 orders lazily loads each customer individually, producing 101 SQL calls.","howNot":"Fetching 100 orders lazily loads each customer individually, producing 101 SQL calls."},{"id":"notes-13","category":"Supplement · Runtime and delivery","title":"Serverless cold starts and concurrency limits","kind":"Notes","explanation":"Serverless shifts server management away, not the need to budget initialization and downstream capacity.","analogy":"Java Lambda scales out suddenly, but each new instance initializes a runtime and opens DB connections.","mechanism":"Measure cold-start and warm-start p99, provision concurrency for strict latency needs, cap downstream requests and use idempotent event processing.","tradeoff":"Provisioned concurrency costs money and unbounded fanout can overwhelm MongoDB.","scenario":"Java Lambda scales out suddenly, but each new instance initializes a runtime and opens DB connections.","code":"Experiment: invoke from idle under burst; record cold-start, throttling and DB pool saturation.","whenNot":"Java Lambda scales out suddenly, but each new instance initializes a runtime and opens DB connections.","howNot":"Java Lambda scales out suddenly, but each new instance initializes a runtime and opens DB connections."},{"id":"notes-14","category":"Supplement · Runtime and delivery","title":"CI/CD feature flags and progressive rollout","kind":"Notes","explanation":"Deployment and feature exposure are separate engineering decisions.","analogy":"A discount calculation ships to all pods but launches to only 1% of eligible customers.","mechanism":"Use stable cohort assignment, flags with owner and expiry, canary comparison, defined rollback thresholds and backward-compatible schema migration.","tradeoff":"Feature flags add state combinations and maintenance; a kill switch cannot undo a completed financial transaction.","scenario":"A discount calculation ships to all pods but launches to only 1% of eligible customers.","code":"Flow: build → contract tests → deploy compatible code → 1% flag → compare business metrics → ramp or disable.","whenNot":"A discount calculation ships to all pods but launches to only 1% of eligible customers.","howNot":"A discount calculation ships to all pods but launches to only 1% of eligible customers."}],"deep":{"lesson-1":"\u003ch2>Start with the rule that must never break\u003c/h2>\u003cp>Think of an airline selling the last seat. Many systems participate: search, booking, payments, and email. Yet only one authoritative inventory decision can promise that seat. This non-negotiable rule is an \u003cstrong>invariant\u003c/strong>: confirmed reservations must not exceed available seats.\u003c/p>\u003ch3>Build the design in five passes\u003c/h3>\u003col>\u003cli>Write the business invariant and the outcome users expect.\u003c/li>\u003cli>Assign one authoritative owner to enforce it.\u003c/li>\u003cli>List concurrent commands, retries and uncertain outcomes.\u003c/li>\u003cli>Identify which views may lag, such as search and analytics.\u003c/li>\u003cli>Design event propagation, monitoring and reconciliation after correctness is settled.\u003c/li>\u003c/ol>\u003ch3>Why read-then-write is dangerous\u003c/h3>\u003cp>Two requests see one remaining item. Each reads available=1 and both subsequently write available=0. Both may claim success despite only one item existing. The operation must be conditional and atomic.\u003c/p>\u003cpre class=\"blockcode\">UPDATE inventory SET available = available - 1\nWHERE sku = :sku AND available &gt; 0;\u003c/pre>\u003cp>Only a positive affected-row count is a successful reservation. A MongoDB equivalent uses findOneAndUpdate with a stock predicate. Payment and shipping can run through a saga, but neither should silently rewrite the reservation invariant.\u003c/p>","lesson-3":"\u003ch2>An HTTP timeout is an observation, not an outcome.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>The request may have failed before arrival, failed during handling, committed before its reply was lost, or succeeded while a proxy dropped the response. These outcomes are indistinguishable without durable operation identifiers and server-side lookup.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>For a payment, persist a stable merchant reference; on timeout query the provider by reference instead of immediately charging again. For an order, return a retrievable PENDING state if finalization is asynchronous.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test crashes before commit, after commit before response, and during an external provider call. Never translate every exception into 'nothing happened'.\u003c/p>","lesson-4":"\u003ch2>Safety and liveness need different proof strategies.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Safety means something bad never occurs, such as no overselling. Liveness means something good eventually happens, such as pending orders either confirming or being compensated. A system can be safe but unavailable; or highly available while violating correctness.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Model an order saga as transitions with invariants (no duplicate charge) and progress obligations (pending payment must be reconciled within an SLA). Liveness assumes dependencies eventually recover or bounded fallback exists.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Chaos testing should check both: inject prolonged partition and verify no invalid state, then restore it and prove pending work makes progress.\u003c/p>","lesson-2":"\u003ch2>Latency, throughput and concurrency are different axes\u003c/h2>\u003cp>A restaurant analogy: latency is how long one customer waits for dinner, throughput is meals served per minute, and concurrency is how many orders are being worked on at once. Faster service may improve throughput, but adding diners without cooks creates queues rather than capacity.\u003c/p>\u003ch3>Little's Law\u003c/h3>\u003cp>For a stable system, average in-flight work L equals arrival rate λ multiplied by average time W. At 2,000 requests/second and 250 ms average response time: L = 2,000 × 0.25 = \u003cstrong>500 in-flight requests\u003c/strong>. This does not necessarily mean 500 threads: event-loop and virtual-thread models have different resource costs.\u003c/p>\u003ch3>Why a small load increase can cause a big outage\u003c/h3>\u003cp>At low utilization, tasks rarely wait. As the bottleneck nears saturation, arrival bursts grow a queue. That queue increases timeouts, which can trigger client retries that amplify the load. Monitor utilization, arrival rate, queue waiting, service time, and p95/p99 latency together.\u003c/p>\u003ch3>Worked sizing exercise\u003c/h3>\u003col>\u003cli>Start at 1,000 average RPS with a 20× peak = 20,000 RPS.\u003c/li>\u003cli>Assume 90% catalog, 5% checkout, 5% account requests: checkout = 1,000 RPS at peak.\u003c/li>\u003cli>If each checkout makes two database operations, anticipate 2,000 operations/second before retries.\u003c/li>\u003cli>Measure each operation under realistic data volume; synthetic RPS alone does not prove database capacity.\u003c/li>\u003cli>Include load balancer, scaling delay, failure headroom and queue limits.\u003c/li>\u003c/ol>\u003cp>Do not size every subsystem for the same 20,000 RPS. Follow the actual traffic mix and amplification.\u003c/p>","lesson-12":"\u003ch2>Why a chain of mostly fast services is slow\u003c/h2>\u003cp>Users experience the slowest step on their critical path. If checkout serially calls inventory, payments and fraud, the end-to-end latency is roughly the sum of their times, plus local overhead. Parallel fan-out instead waits for the slowest essential branch.\u003c/p>\u003cp>Suppose a page calls 20 independent services and each has a 1% probability of exceeding a latency threshold. Assuming independent tails, the chance at least one is slow is 1 − 0.99^20 ≈ 18.2%. Correlated congestion can make this worse.\u003c/p>\u003ch3>What to do\u003c/h3>\u003cp>Reduce call depth, batch requests, cache noncritical data, bound deadlines, and make optional dependencies fall back. Hedged requests may help reads but increase load; they can be dangerous during overload and are not appropriate for non-idempotent writes without controls.\u003c/p>","lesson-13":"\u003ch2>The benchmarking trap\u003c/h2>\u003cp>A closed-loop load generator sends the next request only after the previous one finishes. When the server stalls, the generator also slows down and stops representing real arrivals. Histograms may look much better than what actual users experienced.\u003c/p>\u003ch3>Example\u003c/h3>\u003cp>A client intends to send 100 RPS, but each blocked request takes ten seconds; sequential generation stops arriving at its intended pace. It accidentally tests the server at low effective throughput. Open-loop arrival scheduling or latency correction accounts for missed intended requests.\u003c/p>\u003ch3>Verification\u003c/h3>\u003cp>Report offered load, accepted load, completed throughput, error counts, queue delay and latency including timeouts. Use HdrHistogram-style recording with appropriate precision and avoid deleting failed requests from latency analysis.\u003c/p>","lesson-14":"\u003ch2>A cache stampede is a synchronized capacity failure.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>A popular entry expires at 10:00; thousands of requests simultaneously miss and query MongoDB. Average cache hit rate might look healthy while a handful of hot keys collapse the datastore.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Use single-flight per key, stochastic/jittered expiry, stale-while-revalidate where correctness allows, and a rate limit on fallback database reads. Choose bounded stale behavior explicitly.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Load test a hot-key expiration and Redis outage. Verify backend query amplification stays bounded and stale pricing never authorizes an incorrect payment.\u003c/p>","lesson-5":"\u003ch2>CAP explains choices during partitions\u003c/h2>\u003cp>Two bank branches lose communication. Should each continue allowing withdrawals, risking inconsistent balances, or reject some withdrawals until they can coordinate? That is the partition-time decision behind CAP.\u003c/p>\u003cp>\u003cstrong>Consistency in CAP means linearizability\u003c/strong>, not SQL transaction isolation. Availability is a formal every-request guarantee, not a statement that the uptime dashboard is green.\u003c/p>\u003ch3>What PACELC adds\u003c/h3>\u003cp>Partitions are rare; coordination latency exists every day. PACELC asks: \u003cem>if a partition occurs\u003c/em>, prioritize availability or consistency? \u003cem>Else\u003c/em>, is low latency worth weaker coordination? A cross-region quorum may preserve a stronger read/write guarantee while adding network round trips.\u003c/p>\u003ch3>Per-operation policy beats system-wide slogans\u003c/h3>\u003cp>Checkout inventory can fail closed; product search can serve a slightly old catalog; an analytics dashboard can show five-minute-old aggregates. A single product can therefore have multiple consistency contracts.\u003c/p>\u003ch3>Failure question\u003c/h3>\u003cp>If two regions cannot reach each other, which is allowed to accept scarce-inventory mutations? If both do, how do you handle overselling? If only one does, how do you recover when that region truly fails?\u003c/p>","lesson-6":"\u003ch2>Two properties that are often confused\u003c/h2>\u003cp>\u003cstrong>Linearizability\u003c/strong> concerns what a single operation appears to do in real time: once a write has completed, a later read cannot return an older value. \u003cstrong>Serializability\u003c/strong> concerns transactions across multiple reads/writes: their effect must be equivalent to some serial transaction order. Serializable execution need not preserve real-time order; strict serializability does both.\u003c/p>\u003ch3>A concrete example\u003c/h3>\u003cp>Two cashiers transfer funds between accounts. A serializable execution can preserve the invariant that money is neither created nor destroyed. Yet a separate stale read replica might violate linearizability by showing an old balance after the transfer completes.\u003c/p>\u003ch3>Design question\u003c/h3>\u003cp>For stock reservation, decide whether a single conditional write is enough, whether multiple rows/records participate, and whether an external client needs read-your-writes. Write down each guarantee independently instead of saying simply “strong consistency”.\u003c/p>","lesson-10":"\u003ch2>Logical clocks tell you order, not wall time.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Lamport clocks preserve a happens-before ordering: if event A causally precedes B, L(A) is smaller than L(B); the converse does not necessarily hold. Vector clocks can show concurrent updates. Hybrid logical clocks combine physical-time proximity with logical ordering.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>When two offline clients update the same preference, a wall-clock last-write-wins policy can silently lose intent. A mergeable CRDT might be appropriate for some counters or sets, but not necessarily for money or inventory.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Ask which events must be causally ordered and which can merge. Do not use unsynchronized timestamps as a correctness guarantee.\u003c/p>","lesson-9":"\u003ch2>Quorum arithmetic is not a silver bullet\u003c/h2>\u003cp>With N replicas, a common quorum intuition is that read set R and write set W overlap when R + W &gt; N. But overlapping replicas alone does not ensure a linearizable database: readers must resolve versions correctly, writes must have ordering, failures and hinted handoff require care, and sloppy quorums may read a different replica set.\u003c/p>\u003ch3>Illustration\u003c/h3>\u003cp>With three replicas, R=2 and W=2 overlap, assuming the same membership. Write acknowledgments need a precise meaning: memory receipt, durable journal or applied state? A system that returns from write before data is durable can still lose it under simultaneous failures.\u003c/p>","lesson-7":"\u003ch2>Leader leases require fencing against stale owners.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>A lease tells the lock service which client currently owns a privilege. It does not forcibly stop an old process that resumes after a long pause. Split-brain can occur during partitions, delayed membership propagation and mistaken failure detection.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Use majority-based leadership or the database's supported election scheme, and make protected writes reject stale fencing tokens when concurrent writers would violate correctness.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>During an AZ partition, record old and new leader claims, token values and writes. Prove there is at most one accepted writer for the protected resource.\u003c/p>","lesson-8":"\u003ch2>The hidden danger of an expired lease\u003c/h2>\u003cp>Worker A obtains a distributed lock, then pauses during a long garbage collection. The lease expires, so worker B correctly acquires a new lock and writes fresh data. Worker A wakes up and writes stale data. The lock was respected by the lock service, but the protected resource was still corrupted.\u003c/p>\u003ch3>A fencing token solves a different problem\u003c/h3>\u003cp>Each lock acquisition receives an increasing number: A gets 41, B gets 42. The storage system remembers the highest accepted token and rejects requests carrying any older token. The resource—not merely the lock manager—enforces this monotonic rule.\u003c/p>\u003cpre class=\"blockcode\">// Pseudocode: condition must be atomic at the resource\nif (request.token &lt; resource.lastAcceptedToken)\n    throw StaleOwnerException();\nresource.apply(request);\nresource.lastAcceptedToken = request.token;\u003c/pre>\u003ch3>Implementation subtleties\u003c/h3>\u003cp>The token source must not reset or produce conflicting values across leaders. The check and write must happen atomically, and every mutation path must supply a token. A timestamp is not a safe substitute unless its ordering guarantee is proven.\u003c/p>\u003ch3>When to use\u003c/h3>\u003cp>Distributed schedulers, exclusive batch workers and external object writes where a paused prior owner could resume. A lock alone is often adequate for efficiency; fencing is required when stale ownership would violate correctness.\u003c/p>","lesson-11":"\u003ch2>Key placement and movement are separate concerns.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp
