>Consistent hashing maps keys and nodes onto a ring to reduce movement on membership change; rendezvous hashing picks the highest-scoring node for a key and similarly yields stable assignments. Real-world distribution may require virtual nodes and capacity weighting.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>When a cache node is removed, only some keys should remap rather than every key. But rebalancing can create bursts, cold misses and hot-owner concentration.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test membership changes with skewed keys, failure recovery, and partial routing-table rollouts. A routing algorithm does not guarantee globally consistent membership.\u003c/p>","lesson-15":"\u003ch2>Idempotency is a business contract\u003c/h2>\u003cp>Imagine a customer clicks Pay and the response is lost. The operation may have succeeded even though the browser reports a timeout. Blindly retrying could charge twice. A caller-specific idempotency key identifies one intended operation across retries.\u003c/p>\u003ch3>Server-side implementation\u003c/h3>\u003cp>Store key, tenant, canonical request fingerprint, status, result reference and expiry in a uniqueness-constrained record. In the same authoritative transactional boundary, reserve or claim the operation. If the same key arrives with a different payload, reject it; if processing is in progress, return a defined pending response; if complete, return the saved outcome.\u003c/p>\u003ch3>Why hashing payloads alone fails\u003c/h3>\u003cp>Two identical carts can be intentional separate orders, and minor formatting can produce different hashes for the same logical request. Generated keys based solely on content require explicit business semantics and a deduplication window.\u003c/p>\u003ch3>Failure check\u003c/h3>\u003cp>Test concurrent requests with the same key, timeout after commit, partial payment response, and expiry/retry across regions. The payment provider often needs its own idempotency contract too.\u003c/p>","lesson-16":"\u003ch2>Three controls with different jobs\u003c/h2>\u003cp>Think of a stadium: \u003cstrong>rate limiting\u003c/strong> is how many tickets a person may buy; \u003cstrong>load shedding\u003c/strong> is closing admissions when the stadium is dangerously full; \u003cstrong>backpressure\u003c/strong> is slowing the entrance because security screening cannot keep up.\u003c/p>\u003ch3>Admission control\u003c/h3>\u003cp>When an application accepts more requests than its CPU, database pools or dependencies can safely serve, queues grow. A well-defined admission controller rejects early with 503, potentially Retry-After, rather than holding connections indefinitely.\u003c/p>\u003ch3>Prioritize what matters\u003c/h3>\u003cp>Keep a protected checkout budget. Shed recommendations, expensive exports or nonessential background refreshes first. But do not sacrifice correctness: if an inventory reservation cannot be completed, report failure or pending status, never pretend it succeeded.\u003c/p>\u003ch3>Implementation sequence\u003c/h3>\u003col>\u003cli>Define latency and success SLOs by endpoint and tenant.\u003c/li>\u003cli>Measure concurrency and queue waiting at bottlenecks.\u003c/li>\u003cli>Set concurrency limits based on load testing, not CPU=100%.\u003c/li>\u003cli>Apply per-tenant fairness and bounded retries with jitter.\u003c/li>\u003cli>Test what happens after demand drops: does the backlog drain?\u003c/li>\u003c/ol>\u003cp>For a flash spike, distinguish work that can be dropped, deferred durably, and must be synchronously accepted. Queueing is not a magic source of capacity; it moves work into the future and creates a recovery obligation.\u003c/p>","lesson-17":"\u003ch2>SLIs and SLOs connect engineering to user outcomes.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>An SLI is a quantitative signal (successful checkout attempts / valid checkout attempts). An SLO is an internal target. Error budgets quantify how much failure remains within an agreed period. SLA is a contractual obligation and may have different scope.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>For a 99.9% 30-day availability target, the nominal unsuccessful-request budget is 0.1% of eligible requests; it is not automatically a 43.2-minute outage allowance for every traffic pattern. Choose request-based or time-based definition deliberately.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Use multi-window burn alerts to catch rapid budget consumption without paging on random single failures. Define exclusions narrowly and publish the denominator.\u003c/p>","lesson-18":"\u003ch2>Disaster recovery is a business promise with infrastructure consequences.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>RPO measures the maximum acceptable data-loss window; RTO measures acceptable restoration time. Replication mode, failover readiness, secrets, external dependencies, queue state and data reconciliation determine whether the promise can be met.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>An active-passive secondary that receives async writes may meet a 15-minute RPO but cannot honestly claim zero acknowledged-data loss. For payments, an external merchant reference helps reconcile transactions missing after failover.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Run the failover and failback. Measure actual customer unavailability and count ambiguous/missing transactions; do not equate DNS TTL with RTO.\u003c/p>","lesson-19":"\u003ch2>An ADR should expose what would change your mind.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>State the decision, business context, required guarantees, target workload, considered options, rejected alternatives, costs, and operational burden. Record date and review triggers. A page of constraints often beats a dozen slides of vendor logos.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Example: retain MongoDB without sharding while p99 indexed queries and write throughput meet targets; adopt partitioning only after proving a single shard is the bottleneck under realistic workload.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Architectural recommendations without a testable trigger become dogma. Validate a pivotal assumption with a small experiment.\u003c/p>","lesson-20":"\u003ch2>Size for the burst's shape, not only its height\u003c/h2>\u003cp>Twenty times average throughput for ten seconds is different from twenty times average for an hour. The first may be buffered; the second needs sustained compute and database capacity or deliberate demand reduction.\u003c/p>\u003ch3>Example: event processing\u003c/h3>\u003cp>Input rises to 20,000 events/sec while consumers sustainably process 5,000/sec. Backlog grows by 15,000/sec, or 900,000 after one minute. Once the burst stops, if new input returns to 1,000/sec, spare drain capacity is 4,000/sec; clearing that backlog then takes approximately \u003cstrong>225 seconds\u003c/strong>, not 180 seconds. Always subtract continuing arrivals.\u003c/p>\u003ch3>Design checklist\u003c/h3>\u003col>\u003cli>Establish average, p99, peak, burst length and traffic mix.\u003c/li>\u003cli>Quantify bottlenecks: CPU, memory, connections, partition throughput, IOPS.\u003c/li>\u003cli>Measure scale-out startup and cache-warming delays.\u003c/li>\u003cli>Calculate backlog size and recovery time under ongoing load.\u003c/li>\u003cli>Set cost bounds and overload responses when the target cannot be met.\u003c/li>\u003c/ol>\u003cp>An SLO such as “99% of inventory changes visible within 10 seconds” is more useful than “Kafka lag less than 10,000” because it connects the capacity decision to user impact.\u003c/p>","lesson-21":"\u003ch2>Little's Law is a capacity lens, not a scaling policy\u003c/h2>\u003cp>In a stable system, average in-flight items L = λ × W. If 3,000 events/sec take an average 200 ms from admission to completion, there are around 600 in flight. This includes queue waiting if W measures end-to-end residence time.\u003c/p>\u003ch3>Queueing intuition\u003c/h3>\u003cp>Imagine four checkout counters working almost continuously. A short rush produces a line that takes time to drain. Capacity must exceed average arrivals by enough margin to absorb variance; at sustained utilization near 100%, queues become unstable.\u003c/p>\u003ch3>Measurement\u003c/h3>\u003cp>Separate queue time from service time, track p99 as well as average, and measure requests rejected or dropped. If arrivals average more than completion capacity for an extended interval, no autoscaling policy without additional capacity can prevent backlog growth.\u003c/p>","lesson-22":"\u003ch2>Autoscaling is a delayed feedback controller.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>HPA samples a metric then changes replicas; scheduling, node provisioning, image pulls, JVM startup, cache warmup and readiness add delay. KEDA can scale from queue depth, but consumers still obey partition and database throughput constraints.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>At 20× RPS in seconds, reactive scaling might respond too late. Maintain warm headroom or schedule pre-scaling before a known launch; load shedding protects the interval before capacity arrives.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test a burst from idle with cold images and node scarcity, not only a long ramp on pre-warmed clusters.\u003c/p>","lesson-23":"\u003ch2>Indexes accelerate particular query shapes, not databases in general.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>A compound index benefits queries according to prefix, predicate selectivity, sort requirements and covered fields. Explain plans expose index scans, examined/returned ratio and expensive sort or document fetch stages. Index growth consumes RAM and slows writes.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>For orders queried by tenantId, status and createdAt descending, an index shaped around those predicates and sort may outperform single-field indexes; test real cardinalities and skew before approving it.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Run explain against representative data, measure write impact and verify query plans after schema or traffic shifts.\u003c/p>","lesson-24":"\u003ch2>Partitioning moves the bottleneck; it does not destroy it\u003c/h2>\u003cp>Sharding splits data across nodes using a partition key. A good key distributes writes and reads while keeping the required transactions local. Hashing customer ID may distribute tenants well but complicate range queries; using current date can funnel every new write into the same shard.\u003c/p>\u003ch3>Hot keys\u003c/h3>\u003cp>During a flash sale, all buyers update inventory for one SKU. Randomly sharding orders distributes order writes but cannot independently decrement a single global stock counter without coordination. Options include preallocated stock buckets with careful invariants, reservations or a serializing authority.\u003c/p>\u003ch3>Migration cost\u003c/h3>\u003cp>Repartitioning needs data movement, routing change, dual-version compatibility and reconciliation. Test key skew using real cardinality distributions before selecting sharding as a response to a slow query.\u003c/p>","lesson-25":"\u003ch2>Caching is moving state into copies with explicit staleness.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Read-through, cache-aside, write-through and write-behind differ in update ownership, failure behavior and durability. A cache is not the authority unless the business formally assigns it that role. TTL reduces age eventually but does not guarantee fresh reads within a strict bound.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Catalog thumbnails may tolerate 60-second TTL; checkout totals should revalidate with an authoritative price version. Use targeted invalidation and versioned keys where a stale value can mislead a purchase.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Draw both cache-hit and cache-miss paths and simulate cache outage; prove fallback load is bounded.\u003c/p>","lesson-26":"\u003ch2>What does 'latest' mean?\u003c/h2>\u003cp>Primary/leader replication sends committed changes to followers, sometimes asynchronously. A follower may serve an older state while the leader has advanced. Choose the read consistency requirement based on the user journey: stale catalog entries may be harmless, stale payment status may be confusing, and stale inventory must not authorize a sale.\u003c/p>\u003ch3>Session guarantees\u003c/h3>\u003cp>\u003cstrong>Read-your-writes\u003c/strong> ensures a user sees their prior writes; \u003cstrong>monotonic reads\u003c/strong> prevents their view going backward; \u003cstrong>causal consistency\u003c/strong> preserves cause-effect relationships. These are distinct from global linearizability.\u003c/p>\u003ch3>Recovery check\u003c/h3>\u003cp>What happens if the leader acknowledges a write that has not reached another region, and the leader fails? Specify durability/write concern, promotion criteria, RPO and reconciliation for acknowledged-but-missing business outcomes.\u003c/p>","lesson-27":"\u003ch2>Optimistic locking converts races into explicit conflicts.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Instead of reading a record and blindly writing a replacement, include the expected version in the update predicate. One competing update wins; the loser gets a conflict and must re-read, recompute and retry safely.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>SQL: UPDATE accounts SET value=?, version=version+1 WHERE id=? AND version=?; MongoDB: updateOne({_id:id,version:v},{$set:{...},$inc:{version:1}}). The application must check matched/modified count.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Replaying stale versions should never overwrite a newer write. A generic retry of a business action can be unsafe if external effects already happened.\u003c/p>","lesson-28":"\u003ch2>Transactions cannot fix a bad boundary\u003c/h2>\u003cp>Local ACID transactions are extremely useful when all required state is in one database transaction. Distributed systems often cross services and external providers, where there is no shared atomic commit. The architect must decide whether to redesign ownership, coordinate with a protocol, or accept a recoverable workflow.\u003c/p>\u003ch3>Isolation example\u003c/h3>\u003cp>Two doctors each observe one other person on duty and each mark themselves off duty. Under snapshot isolation, both can commit because they update different records, breaking the invariant. Serializability, a shared guard record, or an alternative model can prevent write skew.\u003c/p>\u003ch3>When a saga is appropriate\u003c/h3>\u003cp>Order creation, payment authorization and shipping coordination can be split into local transactions with compensations. A refund is not equivalent to rolling back a database write: it has real money movement, business rules, and potentially irreversible side effects.\u003c/p>","lesson-29":"\u003ch2>Why a normal database transaction cannot publish a message safely\u003c/h2>\u003cp>An order transaction commits, then the application crashes before publishing OrderCreated. The order exists, but downstream systems never hear about it. If the application publishes first and the database commit later fails, consumers receive an event describing an order that never existed.\u003c/p>\u003ch3>Transactional outbox\u003c/h3>\u003cp>In a single local transaction, write both the order and an outbox row. A separate relay reads unsent rows and publishes them to Kafka. If publishing succeeds but marking the row sent fails, the relay may publish again—so delivery is ordinarily at least once, not magically exactly once.\u003c/p>\u003cpre class=\"blockcode\">BEGIN;\nINSERT INTO orders (...);\nINSERT INTO outbox (event_id, aggregate_id, payload, status)\nVALUES (:eventId, :orderId, :json, 'NEW');\nCOMMIT;\u003c/pre>\u003ch3>Downstream inbox\u003c/h3>\u003cp>The consumer records event_id in a uniqueness-constrained inbox inside the same transaction as applying the business change. A duplicate event is acknowledged without repeating the effect. Define idempotency scope and retention policy carefully.\u003c/p>\u003ch3>Production trade-offs\u003c/h3>\u003cp>Polling is simple but can add delay and database load. CDC reduces application polling but adds connector and schema operation complexity. Neither removes the need for ordering rules, replay handling, monitoring and reconciliation.\u003c/p>","lesson-30":"\u003ch2>A saga is a state machine, not a distributed rollback\u003c/h2>\u003cp>Consider Place Order → Reserve Inventory → Authorize Payment → Confirm Order. Each service commits locally. If payment declines after inventory reservation, release the reservation. If the payment provider times out, the result is unknown: immediately compensating or retrying could be wrong.\u003c/p>\u003ch3>Make ambiguous states explicit\u003c/h3>\u003cp>Use order states such as PENDING_RESERVATION, PENDING_PAYMENT, CONFIRMED, FAILED and RECONCILIATION_REQUIRED. Persist transition IDs and idempotency identifiers. A compensating action must be safe to retry, and some actions such as an email or dispatched shipment cannot truly be undone.\u003c/p>\u003ch3>Choreography versus orchestration\u003c/h3>\u003cp>Choreography can be lightweight but spreads state and failure logic across listeners. An orchestrator centralizes progress and visibility but becomes a control component that itself needs durable state and recovery.\u003c/p>","lesson-31":"\u003ch2>CRDTs work when operations have a valid merge algebra.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Conflict-free replicated data types merge distributed updates without requiring a globally serial writer for every operation, under assumptions about eventual delivery and supported operations. G-counters grow monotonically; PN-counters track positive/negative components; sets require carefully defined add/remove semantics.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>An offline reaction counter may tolerate merge-based consistency, but a bank withdrawal or finite inventory reservation requires an invariant that naive counter merging cannot preserve.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Discuss what happens with deletion, concurrent add/remove, identity resets and replica retirement before selecting a CRDT.\u003c/p>","lesson-32":"\u003ch2>Timeout budgets propagate across call graphs\u003c/h2>\u003cp>If an API has a 700 ms end-to-end deadline, it cannot allocate 700 ms independently to each of four downstream calls. The caller should pass remaining deadline where supported, and each service must reserve time for its own processing and response.\u003c/p>\u003ch3>Retry multiplication\u003c/h3>\u003cp>Three layers each retrying three times can create up to 27 attempts at the innermost dependency for a single incoming request. Prefer retries at one appropriate boundary, with capped exponential backoff, jitter and a bounded retry budget.\u003c/p>\u003ch3>Subtle failure\u003c/h3>\u003cp>A request times out after payment authorization but before the response arrives. A timeout does not mean failure. Retry only through idempotent semantics, then reconcile pending outcomes with the provider.\u003c/p>","lesson-33":"\u003ch2>A circuit breaker protects callers, not the failed service's state.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Closed allows requests; open rejects quickly after a failure condition; half-open probes limited requests before closing again. A breaker must be scoped appropriately: per dependency endpoint or tenant, not one global switch for unrelated traffic.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>A slow payment provider consumes all HTTP client connections. An isolated bulkhead and deadline prevent it from stealing capacity from inventory queries; the breaker can fail fast when the provider remains unhealthy.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Check threshold tuning, half-open probe concurrency, downstream recovery and idempotency for retries. Circuit breakers without deadlines still leave some calls hanging.\u003c/p>","lesson-34":"\u003ch2>Graceful degradation must protect business invariants.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Under overload, omit personalization, postpone analytics, reduce result counts or serve bounded-stale noncritical reads. Preserve authentication, authorization, durable acceptance semantics and inventory correctness.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Do not return 200 'Order confirmed' when merely queued. Return 202 with a durable status resource when the product contract supports asynchronous acceptance.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Specify feature priority tiers and a degraded-mode runbook, then drill whether the UI communicates reduced functionality honestly.\u003c/p>","lesson-35":"\u003ch2>Retry should be a scarce resource.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Exponential backoff reduces synchronized pressure; jitter spreads clients in time. A retry budget caps total additional attempts relative to original requests. Retry only errors likely transient and only when the operation semantics tolerate repetition.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>If three services each retry three times, one caller can generate 27 attempts at the innermost service. Standardize one retry boundary and propagate deadlines.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test recovery from 503 with Retry-After and show the dependency does not receive a second traffic spike.\u003c/p>","lesson-36":"\u003ch2>Disaster recovery includes promotion and return.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Warm standby reduces RTO compared with cold restore, but data ownership must be fenced during promotion. Failback is a migration in reverse: the former primary can be stale and must catch up before accepting writes again.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>List region-local secrets, DNS, IAM, KMS keys, network dependencies, object stores and external payment callbacks. A 'replicated database' alone does not make the application region-independent.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test partial network partitions, not only full-region shutdown, to expose split-brain risk.\u003c/p>","lesson-37":"\u003ch2>Kafka's ordering guarantee has a boundary\u003c/h2>\u003cp>Kafka orders records within one partition, not across an entire topic. For an entity's events to be ordered, choose a stable partition key such as orderId. Events from different orders can execute concurrently.\u003c/p>\u003ch3>Concurrency and scaling\u003c/h3>\u003cp>A consumer group normally has at most one active consumer per partition at a time, so more instances than partitions often does not increase group parallelism. Rebalances, retry loops, hot keys and slow storage can dominate throughput even when average CPU is low.\u003c/p>\u003ch3>Order versus business version\u003c/h3>\u003cp>Offsets encode log order, not necessarily the logical version of a record written by multiple producers. Include aggregate version and reject stale state transitions. Expanding partitions can change key routing, so reason about ordering through the migration.\u003c/p>","lesson-38":"\u003ch2>Delivery guarantees do not guarantee business effects\u003c/h2>\u003cp>\u003cstrong>At-most-once\u003c/strong> can lose events but does not duplicate delivery under its assumptions; \u003cstrong>at-least-once\u003c/strong> may redeliver; Kafka's exactly-once facilities coordinate some Kafka processing/transactional writes, not arbitrary external HTTP calls or database effects.\u003c/p>\u003ch3>Classic crash window\u003c/h3>\u003cp>The consumer updates MongoDB, then crashes before committing the Kafka offset. On restart Kafka redelivers the event. If the MongoDB mutation is not idempotent, inventory may be decremented twice.\u003c/p>\u003ch3>Design the effect\u003c/h3>\u003cp>Use an event identifier plus an inbox uniqueness check in the same transaction as the side effect, or use naturally idempotent state assignment guarded by version. External payments require provider-specific idempotency and reconciliation.\u003c/p>","lesson-39":"\u003ch2>Three kinds of lag—and why they matter\u003c/h2>\u003cp>Kafka offset lag counts records between the partition's log end and a consumer group's committed offset. Processing lag measures time between event creation and successful application. Business staleness measures how old a visible projection is compared with the authoritative fact. These measures do not always move together.\u003c/p>\u003ch3>Backlog example\u003c/h3>\u003cp>Producer 20,000 events/sec, consumer 5,000/sec: +15,000 records/sec. A 60-second burst creates about 900,000 queued records. At a later input rate of 1,000/sec, effective draining is 4,000/sec, so catch-up is about 225 seconds if capacity stays constant.\u003c/p>\u003ch3>Instrument accurately\u003c/h3>\u003col>\u003cli>Track per-partition offset lag and stuck partitions.\u003c/li>\u003cli>Track age of oldest unprocessed business event.\u003c/li>\u003cli>Record processing end-to-end delay \u003cem>after\u003c/em> the state change commits.\u003c/li>\u003cli>Monitor ingest and processing rates plus retry/DLQ counts.\u003c/li>\u003cli>Alert on breached freshness SLO and inability to recover, not only raw offset thresholds.\u003c/li>\u003c/ol>\u003ch3>Failure traps\u003c/h3>\u003cp>More consumers cannot increase parallelism beyond the number of actively assignable partitions. One hot partition can hold back a small set of keys. Consumer retries inside the polling loop may block progress; moving a record to DLQ changes your recovery contract and must be audited.\u003c/p>","lesson-40":"\u003ch2>DLQs are a place for accountability, not disposal.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>A poison record may fail deterministically due to schema, validation or a bad assumption. Repeating it forever blocks its partition; skipping it without an audit trail can lose business state.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Store event ID, original topic/partition/offset, error class, payload reference and retry count; mask PII. Decide whether skipped events prevent downstream state transitions or need manual repair before continuing.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Define the replay process before incident: ordering, duplicate handling, re-drive rate limit and reconciliation. Track DLQ age and unresolved outcomes.\u003c/p>","lesson-41":"\u003ch2>A 'zero downtime migration' is an ordered protocol\u003c/h2>\u003cp>Moving MongoDB clusters or AWS accounts requires more than copying a snapshot. Writes continue during copying; CDC or change streams replicate deltas. The critical moment is deciding which cluster is authoritative for writes.\u003c/p>\u003ch3>Safer cutover sequence\u003c/h3>\u003col>\u003cli>Take consistent baseline and apply change stream from an established resume point.\u003c/li>\u003cli>Validate counts, samples, checksums and critical invariants.\u003c/li>\u003cli>Reduce write ambiguity: freeze or gate writes briefly, or perform carefully coordinated routing.\u003c/li>\u003cli>Drain remaining deltas, verify target, then promote it as authoritative.\u003c/li>\u003cli>Re-enable writes and reconcile edge cases with durable audit IDs.\u003c/li>\u003c/ol>\u003ch3>Rollback is not simply DNS\u003c/h3>\u003cp>Once the new cluster accepts writes, the old cluster is stale. A rollback needs reverse replication, a new catch-up protocol or an explicit loss window. Dual writes create split-brain risks when one target succeeds and the other fails.\u003c/p>","lesson-42":"\u003ch2>Observability begins with questions you need answered.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Metrics summarize trends; logs preserve discrete facts; distributed traces reconstruct dependency timing across a request or workflow. None alone proves a business outcome. Use a correlation ID across HTTP, Kafka and persistent state changes.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Golden signals (latency, traffic, errors, saturation) are useful, but add business metrics: valid orders confirmed, payment mismatches and inventory divergence. High-cardinality labels such as userId can overwhelm metrics storage.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Investigate one failed checkout with trace ID, event IDs, DB operation IDs and final state. Design sampling so important errors are retained.\u003c/p>","lesson-43":"\u003ch2>Profiling distinguishes consumed time from waiting time.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>High CPU may indicate inefficient computation or GC; low CPU with high latency often indicates queues, blocking calls, lock contention or database wait. JFR, thread dumps, allocation profiles and database explain plans answer different questions.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>When p99 rises but CPU stays at 30%, inspect executor queues and pool wait before buying larger instances. Repeated thread dumps can reveal a common blocked stack.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Collect before-and-after flamegraphs under representative traffic and observe overhead of instrumentation.\u003c/p>","lesson-44":"\u003ch2>Good alerts lead to actions.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Paging on every small CPU rise creates fatigue. Alerts should connect symptom to user impact and offer a safe first action. Use burn rates for SLOs, dependency error trends and saturation warning before exhaustion.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>An alert 'oldest pending order event exceeds 30 seconds and backlog growing' communicates user risk better than 'Kafka offset lag 10,000'. Pair it with partition and consumer runbooks.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test alerts in a game day and measure whether on-call can detect, triage and mitigate without dashboard archaeology.\u003c/p>","lesson-45":"\u003ch2>JVM latency is shaped by allocation, GC and scheduling.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Heap usage alone cannot explain a stop-the-world pause. Allocation rate, live set, collector, safepoints, native memory and CPU throttling all matter. A paused worker may keep an external lease logically expired while its Java stack later resumes.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Capture JFR and GC log evidence before tuning heap flags. In containers, inspect cgroup limits and native allocations. Fencing tokens prevent a resumed stale owner from corrupting protected state; GC tuning does not replace correctness.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Reproduce pause conditions, compare p99/maximum pause duration and inspect token rejection after an expired lease.\u003c/p>","lesson-46":"\u003ch2>Threads change concurrency economics, not dependency capacity.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Virtual threads make blocking-style Java code scale to many concurrent waits with less thread overhead. They do not remove DB connection limits, memory per task, downstream quotas or lock contention. Pinning and CPU-heavy work still need scrutiny.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Separate executor sizing from connection pool sizing. With 10,000 waiting virtual threads and a 50-connection database pool, the DB still admits roughly 50 concurrent operations, and admission control may be necessary.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Load test concurrency, queueing and thread dumps; avoid equating virtual thread count with service throughput.\u003c/p>","lesson-47":"\u003ch2>Spring transactions follow proxy and resource boundaries.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>@Transactional typically starts a transaction around a proxied method on an appropriate transaction manager. Self-invocation may bypass proxy advice. Async threads, external HTTP calls and Kafka publications do not automatically participate in the same local transaction.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>An order is committed to MongoDB, then Kafka send fails. @Transactional on the service does not make the send atomic with the DB. Use outbox and an independently retried relay; validate transaction support of your MongoDB topology.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test rollback behavior, propagation (REQUIRED versus REQUIRES_NEW), exceptions and visibility of events.\u003c/p>","lesson-48":"\u003ch2>HTTP semantics are engineering contracts.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>GET should be safe and idempotent; PUT is idempotent by intended full-state replacement semantics; POST may be non-idempotent unless designed otherwise. Status codes tell clients what happened, and conditional requests prevent lost updates.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Use 201 for created resource, 202 for accepted async processing, 409 for domain conflict where appropriate, 412 for failed If-Match precondition, 429 for rate policy and 503 for overload. These are contextual choices, not universal mappings.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Design an idempotency key scoped by client/tenant and business intent; return operation status after uncertain timeouts.\u003c/p>","lesson-49":"\u003ch2>Compatibility is more valuable than version labels.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>A new field can be additive, but changing meaning, nullability, enum sets or pagination order can break clients without changing the URL. Versioned APIs still need published deprecation windows and contract tests.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Support old and new consumers during rolling deployment. Apply tolerant reading only where it does not hide schema bugs; write explicit schemas and error responses. Observe real client version usage before removing behavior.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test producer-before-consumer and consumer-before-producer rollout order, plus rollback.\u003c/p>","lesson-50":"\u003ch2>Zero trust is continuous verification of access.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>The API gateway can authenticate a caller, but each resource operation must authorize tenant, subject, action and object. Differentiate OAuth scopes from resource ownership; mTLS provides transport peer identity rather than blanket business authorization.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>A customer changes /orders/123 to /orders/124. If service only checks that JWT is valid, it leaks another customer's data. Enforce object-level authorization in the owning service.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Threat-model cross-tenant reads, message spoofing, replay, credential theft, secret logging and privilege escalation.\u003c/p>","lesson-51":"\u003ch2>Testing is a portfolio of evidence.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Unit tests prove local logic; integration tests verify database/queue semantics; contract tests protect API compatibility; load tests establish limits; fault injection probes resilience; restore drills prove recoverability.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>A mocked repository may pass optimistic lock tests while the actual database update predicate is wrong. Race tests must hit the real datastore with controlled concurrency. Chaos tests must include business outcome assertions.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Build a test pyramid by risk, not slogans; run expensive scenario suites on scheduled or pre-release gates and preserve replayable datasets.\u003c/p>","lesson-52":"\u003ch2>AWS boundaries are both failure and security boundaries.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>VPC subnets, security groups, IAM roles, availability zones and regions solve different concerns. Private subnet placement does not itself grant least privilege or eliminate exfiltration. Multi-AZ design needs zone-diverse capacity and correctly configured managed dependencies.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>An EKS worker needs access to S3 via a workload identity, not a static key in environment variables. A regional outage may simultaneously affect control plane, data plane, networking and regional services.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Map all required AWS dependencies and cross-region assumptions, then run failover and IAM denial tests.\u003c/p>","lesson-53":"\u003ch2>Kubernetes scheduling is a constrained placement problem.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Requests influence node scheduling, limits enforce runtime ceilings (with distinct CPU and memory behavior), and topology constraints reduce correlated failures. Health probes have separate jobs: startup, readiness and liveness.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>If MongoDB slows, a liveness probe that queries MongoDB can kill every otherwise healthy pod. Readiness can stop admission when an instance truly cannot serve, but cascading unready instances can eliminate capacity.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Review events for pending pods, OOM, CPU throttling and probe transitions before changing replicas.\u003c/p>","lesson-55":"\u003ch2>A distributed system lacks a single instantaneous view.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Network messages can be delayed or lost; nodes fail independently; clocks disagree; a timeout cannot prove remote failure. Reconciliation, authority, concurrency control and explicit consistency guarantees are therefore first-class concerns.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Design a single order across Order, Inventory and Payment. Draw five failure points, identify ambiguous outcomes and choose one authoritative owner for each invariant.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Distinguish safety from liveness and name conditions under which the system makes progress.\u003c/p>","lesson-56":"\u003ch2>Scalability is about bottlenecks and workload composition.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Vertical and horizontal scaling, caching, sharding and queues address different constrained resources. Load balancers cannot fix a saturated database, and scaling Kafka consumers beyond usable partitions may not improve throughput.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>At 20× traffic, use 90% cached catalog and 10% dynamic traffic to calculate real dependency load. Model steady-state input after burst to compute backlog drain rate.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Test open-loop bursts and saturation; chart p99, accepted throughput, dropped work and cost.\u003c/p>","lesson-57":"\u003ch2>Consistency decisions belong to business operations.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Strong inventory reservation and eventually consistent search can coexist. CAP concerns partition-time read/write guarantees; ACID isolation concerns local transaction anomalies; eventual convergence concerns async propagation.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>A buyer sees stock available in the catalog after the last unit is reserved. Display staleness is tolerable only if the authoritative checkout rejects the unavailable item correctly.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Write a freshness SLA for projections and a zero-oversell invariant for reservations.\u003c/p>","lesson-58":"\u003ch2>Resilience is controlled behavior under incomplete capacity.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Retries, breakers, bulkheads, timeouts, admission control and fallbacks should form a coherent strategy. Combining them without budgets can multiply traffic or hide failures.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>During a payment-provider slowdown, reserve checkout threads, bound deadlines, return retrievable pending status for ambiguous charges and shed irrelevant recommendations.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Validate fault containment: one dependency down does not starve authentication or the product catalog.\u003c/p>","lesson-59":"\u003ch2>Event-driven architecture trades coupling for asynchronous contracts.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Events decouple publisher timing from subscribers and enable replay but introduce delivery duplicates, ordering boundaries, schema evolution and lag. A broker does not solve cross-service transactions.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Write order plus outbox in one transaction; publish later; make consumers idempotent; monitor event age. Define which event is a fact versus a command and who can create it.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Crash before/after each commit to test delivery and business effect guarantees.\u003c/p>","lesson-60":"\u003ch2>Observability proves correctness of real journeys.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Infrastructure metrics explain capacity, tracing explains path timing, logs explain decisions, and reconciliation explains eventual business state. Collect causal IDs across protocols.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>A service health endpoint returns 200 while payment capture succeeds but order confirmation never appears. Synthetic checkout and unmatched-payment metrics should reveal failure immediately.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Prefer SLIs about completed user journeys, not only CPU and HTTP 200 responses.\u003c/p>","lesson-61":"\u003ch2>Recovery includes repairing data, not just restarting pods.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>After outages, the system may hold duplicate messages, missing outbox publications, partial transactions and stale read projections. Restart can resume traffic while customer accounts remain wrong.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>After a region failover, compare authoritative order IDs with PSP settlements and event consumer positions. Repair by durable identifiers, preserve audit trail, and make reconciliation idempotent.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Define operational ownership and deadline for all unresolved records.\u003c/p>","lesson-62":"\u003ch2>Trade-offs must be measured across time, cost and correctness.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>There is no universally best datastore, cache, broker or multiregion topology. State workload, constraints, invariants, failure domains, team operations maturity and escape costs before comparing alternatives.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Compare Kafka and SQS for event delivery: ordering, replay retention, throughput needs, cross-region options, operational cost and consumer behavior. A managed queue might be the better solution for modest command workflows.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Use an ADR to document what evidence could change the decision.\u003c/p>","lesson-63":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Burst profile and endpoint traffic split; ALB target response time; DB pool wait; autoscaling delay. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Enable checkout priority; shed recommendations; freeze costly batch work; bound retries. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Warm capacity, load tests with open-loop arrivals, dependency quotas, admission controller. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Checkout completion and inventory invariants during 20× open-loop spike. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-64":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Six months of weekly demand and storage growth; per-tenant peaks; projected index size. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Remove worst queries and isolate batch tasks before adding infrastructure. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Quarterly capacity forecasts, service-level unit cost, storage/index capacity plans. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Forecast error and headroom validated against actual weekly peak. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-65":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Tenant-specific request rates; per-tenant queue age; shared pool contention. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Throttle offending tenant fairly; preserve capacity for others. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Per-tenant concurrency quotas, isolation tiers, bounded fairness queues. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Unrelated tenant p99 and success remain within SLO during noisy load. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-66":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Atomic reserved-stock mutations versus confirmed orders; negative stock; duplicate checkout keys. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Temporarily prevent unsafe sale and reconcile affected orders. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Conditional stock update, reservation expiry, saga idempotency, payment reconciliation. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Concurrent last-unit tests prove exactly one successful inventory reservation. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-67":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Partition-level offsets; oldest event age; processing throughput; rebalances; slow dependency. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Remove regression or poison event safely; throttle optional producers. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Partition-key audit, bounded retries, DB pool tuning, freshness SLO. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Backlog drains with real incoming load and no silently discarded business events. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-68":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Duplicate event IDs; consumer commits; external side-effect IDs. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Stop non-idempotent side effects and reconcile duplicates. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Atomic inbox record + state mutation; provider idempotency contracts. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Crash consumer after business commit and replay without duplicate effect. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-69":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Aggregate versions and offsets grouped by business key; concurrent producers. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Pause affected projection and reject stale mutations. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Stable partition keys, monotonic entity versions, replay-safe reducer. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Reorder and replay events; final state follows valid aggregate version. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-70":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Broker ISR and partition leadership; producer acks; unavailable partitions. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Queue safely where feasible or reject durable acceptance honestly. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Replication factor, min ISR, acks=all, rack/AZ awareness and producer timeouts. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> AZ and broker failure drills preserve claimed durability and resume flow. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-71":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> DB driver wait queue; scan-to-return ratios; disk IOPS; profiler. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Deprioritize heavy scans, reduce concurrency, rollback bad query change. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Index/query plan reviews, pool budgets and realistic cardinality tests. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> p99 recovered with stable pool wait and no throughput collapse. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-72":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Election logs; write concern; retryable write outcome; client timeout pattern. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Pause unsafe retry loops; determine authoritative primary and unknown writes. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Majority write concern where appropriate, application idempotency, election tests. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Rollback/retry simulation proves no duplicate orders or lost acknowledged effects. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-73":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> CDC resume token position; source/target diffs; writer route; skew. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Maintain one writer; pause cutover and reconcile before promotion. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Snapshot + CDC, writer fencing, rollback delta strategy and audit ledger. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Synthetic cutover/rollback with no unexplained divergent IDs. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-74":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Cache hit ratio; database read burst; eviction and connection saturation. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Disable nonessential reads; apply bounded concurrency; serve fallback safely. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Cache TTL jitter, single-flight loading, cache warmup, read capacity protections. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Simulated Redis outage does not turn into database-wide cascade. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-75":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Price version on UI and authoritative checkout; complaints; cache age. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Revalidate authoritative price at checkout; disclose corrections clearly. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Versioned price events, targeted invalidation, freshness budgets. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Expired cache cannot charge stale price; checkout returns a precise correction. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-76":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Dependency latency/timeout; thread pool waiting; in-flight calls. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Apply strict deadlines; shed optional calls; isolate failing dependency. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Circuit breaker, bulkhead, deadline propagation, fallback contracts. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Provider blackhole test maintains local service SLO and bounded resource use. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-77":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Retry attempt counts per original request; 429/503 patterns; recovery throughput. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Apply retry budgets and jitter; temporarily block abusive repeated calls. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Idempotent APIs, one retry layer, token budgets and client guidelines. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Recovery drill has no re-overload when upstream resumes. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-78":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Thread dumps; blocked states; executor active/queue; DB wait. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Block new nonessential work and repair blocked downstream operation. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Separate CPU and blocking work, bounded executors, virtual-thread pinning checks. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Slow dependency cannot starve health or critical endpoints. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-79":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Pod previous termination reason; OOMKilled; probe failures; logs. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Roll back offending deployment; relax incorrect probes where safe. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Proper startup/readiness/liveness checks, resource budgets, leak monitoring. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Fault injection distinguishes unhealthy process from temporarily unreachable DB. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-80":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> HPA metrics pipeline; image pull time; node provisioning; cold cache. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU
