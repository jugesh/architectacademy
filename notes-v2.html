*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:#116f8e}.layout{display:grid;grid-template-columns:275px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;background:#112b3e;color:#d4e4ee}.brand{font-size:18px;font-weight:800;color:white;letter-spacing:-.6px}.brand span{color:#75e2cf}.sub{color:#aec5d3;font-size:11px;margin:5px 0 16px}.search{width:100%;border-radius:10px;background:#244358;color:white;padding:11px;border:1px solid #537083;outline:none}.search::placeholder{color:#bdd0dc}.navhead{display:block;width:100%;text-align:left;background:transparent;color:#8fd8ce;border:0;padding:12px 7px;font-size:11px;letter-spacing:.35px;font-weight:800}.navhead[aria-expanded="false"]{color:#b3c8d7}.navhead:before{content:"⌄ ";font-size:14px}.navhead[aria-expanded="false"]:before{content:"› "}.navunit{display:block;width:100%;text-align:left;background:transparent;color:#d4e4ee;border:0;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45}.navunit:hover{background:#254a62}.navunit.active{background:#256c76;color:white}.navhead[aria-expanded="false"]+.navchildren{display:none}.shell{max-width:1030px;width:100%;padding:55px clamp(22px,5vw,75px) 70px;margin:auto}h1{font-size:clamp(26px,3.5vw,37px);letter-spacing:-.9px;line-height:1.2;margin:6px 0 20px}h2{font-size:22px;margin:8px 0 16px;line-height:1.4}h3{font-size:16px;margin:24px 0 8px}.lead{font-size:17px;color:#4d6276}.eyebrow{font-size:11px;letter-spacing:1px;font-weight:800;color:var(--teal);text-transform:uppercase}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:22px 25px;margin:20px 0;box-shadow:var(--shadow)}.panel p,.panel li{line-height:1.85}.panel li{margin:8px 0}.why{border-left:4px solid #168c81}.how{border-left:4px solid #3e88bc}.whynot{border-left:4px solid #b98030}.whennot{border-left:4px solid #8c62ae}.hownot{border-left:4px solid #c85a6c}.example{border-left:4px solid #2b8d62}.deep{border-top:3px solid #179c91}.deep pre,pre{white-space:pre;overflow:auto;background:#132537;color:#e8f4ff;border-radius:9px;padding:15px;font-size:12px;line-height:1.6}.deep code{color:#7c4b9f} .deep pre code{color:#e8f4ff}.deep h2{color:var(--teal)}.deep h3{color:#86622b}.backlink{margin:20px 0 30px}.chip{font-size:11px;background:#e7f3f0;color:#0c6b62;border-radius:30px;padding:5px 10px}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:20px 0}.btn{background:var(--paper);border:1px solid #bccbd5;color:#25566a;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700}.btn.primary{background:#087c76;border-color:#087c76;color:white}.footer{display:flex;justify-content:space-between;gap:10px;margin:30px 0}.callout{background:#f0f8f7;padding:14px;border-radius:8px;border-left:3px solid #13948a}.diag{border-top:3px solid #5c80b6}.diagram-nav{display:flex;gap:9px;flex-wrap:wrap}.diagram-nav button.active{background:var(--teal);color:white}.diagram-nav button.failure.active{background:#b45d36;border-color:#b45d36}.svgscroll{overflow:auto}.svgscroll svg{min-width:560px;width:100%;display:block}.diagram-caption{font-size:13px;padding:10px 13px;background:#f2f7fa;border-radius:8px}.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}.topiccard{display:block;text-align:left;border:1px solid var(--line);background:white;padding:17px;border-radius:12px;color:var(--ink)}.topiccard strong{display:block;font-size:14px}.topiccard small{color:var(--muted)}.topbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.menu{display:none}.count{font-size:12px;color:#a6c6d2;padding:12px 7px}.clear{font-size:13px;color:#d0e1ec;text-decoration:none} .sticky-note{font-size:12px;color:var(--muted)}@media(max-width:850px){.layout{display:block}aside{position:fixed;z-index:20;width:min(300px,83vw);transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 30px #0003}body.menuopen aside{transform:translateX(0)}.menu{display:inline-block}.shell{padding:24px 19px}.panel{padding:18px}.overlay{display:none}body.menuopen .overlay{display:block;position:fixed;inset:0;background:#0005;z-index:19}}@media print{aside,.menu,.overlay,.actions,.footer,.topbar{display:none!important}.layout{display:block}.shell{max-width:none;padding:0}.panel{break-inside:avoid;box-shadow:none}}
</style></head><body><div class="overlay" id="overlay"></div><div class="layout"><aside id="sidebar"><div class="brand">◈ Architect Academy <span>V2</span></div><p class="sub">Practical engineering notes. No interview prep.</p><input class="search" id="search" placeholder="Search all notes…" aria-label="Search notes"><div id="nav"></div><div class="count" id="count"></div><a class="clear" href="index.html">↗ Full interactive textbook</a></aside><main class="shell" id="content"></main></div><script id="v2-data" type="application/json">{"entries":[{"id":"lesson-1","category":"01.1 · Start with correctness","title":"System boundaries & invariants","kind":"Lesson","analogy":"A bank cashier cannot promise a withdrawal until the authoritative ledger confirms it.","explanation":"Start architecture with who owns each decision, not with a framework. An invariant is a rule that must remain true even during retries and outages.","mechanism":"Name the authoritative service and transactional boundary; make important state changes atomic there. Treat caches, search and event projections as copies.","tradeoff":"A stricter invariant may reduce availability during partitions.","scenario":"Two buyers attempt the last item: can both be told success?","check":"Write three invariants for checkout and identify where each is enforced.","code":"","tags":[]},{"id":"lesson-3","category":"01.1 · Start with correctness","title":"Partial failures and ambiguous outcomes","kind":"Lesson","analogy":"A delivery driver rings the bell but cannot tell whether someone inside received the parcel.","explanation":"A network timeout does not tell you whether the server committed an operation. Distributed applications must represent UNKNOWN as a real state.","mechanism":"Use stable operation IDs, durable request records, timeouts and reconciliation. Never turn a retry into a new logical operation by accident.","tradeoff":"Waiting for certainty costs latency; immediate retries risk duplicates.","scenario":"Payment succeeds but response times out.","check":"Propose a safe retry using the same payment intent key.","code":"","tags":[]},{"id":"lesson-4","category":"01.1 · Start with correctness","title":"Safety vs liveness","kind":"Lesson","analogy":"A railway signal must prevent collisions (safety) while still letting trains eventually move (liveness).","explanation":"Safety means bad outcomes never occur; liveness means useful work eventually progresses. Different controls protect each.","mechanism":"Use atomic constraints for safety and retry/recovery workers for liveness; alert separately on both.","tradeoff":"Some systems must stop writes to preserve safety.","scenario":"Can checkout continue during a network partition without overselling?","check":"Label no-duplicate-charge and eventual-order-confirmation as safety or liveness.","code":"","tags":[]},{"id":"lesson-2","category":"01.2 · Understand workload","title":"Latency, throughput & concurrency","kind":"Lesson","analogy":"A restaurant can serve 60 people/hour but still have a long queue if everyone arrives together.","explanation":"Throughput is work finished per second; latency is time per request; concurrency is work in progress. They are related but not interchangeable.","mechanism":"Under stable conditions Little’s Law says average concurrency = throughput × mean latency. Queueing grows sharply as utilization approaches full capacity.","tradeoff":"Bigger thread pools can increase contention and database waiting.","scenario":"20,000 RPS × 0.2 seconds ≈ 4,000 in-flight requests.","check":"Calculate concurrency at 3,000 RPS and 400 ms.","code":"","tags":[]},{"id":"lesson-12","category":"01.2 · Understand workload","title":"Tail-latency amplification","kind":"Lesson","analogy":"If a trip requires five connecting trains, one late train delays the whole journey.","explanation":"A user request fans out to many services; even a small fraction of slow dependencies can worsen end-to-end p99.","mechanism":"Budget per-hop deadlines, reduce unnecessary fanout, batch calls, and hedge only safe idempotent reads under strict budgets.","tradeoff":"Hedging multiplies load and can worsen an overloaded dependency.","scenario":"Dashboard fans out to 30 calls, 1% of which are slow.","check":"Describe the probability of at least one slow branch.","code":"","tags":[]},{"id":"lesson-13","category":"01.2 · Understand workload","title":"Coordinated omission","kind":"Lesson","analogy":"A cashier stops counting customers while the shop is closed, then reports short waiting times.","explanation":"A load test that stops generating new requests when the service stalls systematically hides waiting time.","mechanism":"Use an open-loop arrival model or correct latency recording for planned arrival timestamps; record both queueing and service time.","tradeoff":"Open-loop tests need hard safety boundaries for the system under test.","scenario":"A generator waits for the last response before sending another request.","check":"Explain why reported p99 can look deceptively good.","code":"","tags":[]},{"id":"lesson-14","category":"01.2 · Understand workload","title":"Thundering herd & cache stampedes","kind":"Lesson","analogy":"An entire stadium leaves through the same exit at once.","explanation":"Many requests regenerate the same expired cache entry simultaneously and overload origin storage.","mechanism":"Use per-key singleflight, jittered TTLs, bounded stale-while-revalidate, early refresh and overload controls.","tradeoff":"Serving stale data is unsafe for some domains, such as final checkout prices.","scenario":"A celebrity page expires during a broadcast.","check":"Design regeneration so only one caller fetches from the DB.","code":"","tags":[]},{"id":"lesson-5","category":"01.3 · Consistency and causality","title":"CAP, PACELC & partitions","kind":"Lesson","analogy":"Two bank branches lose their telephone connection; they cannot both guarantee the same balance while accepting all withdrawals.","explanation":"CAP concerns linearizable consistency and availability during a network partition. PACELC also reminds us of latency/consistency choices during normal operation.","mechanism":"Choose per-operation behavior under isolation; describe whether writes fail, queue, or reconcile.","tradeoff":"Claims like “MongoDB is CP” are oversimplifications without precise settings and operations.","scenario":"A region disconnects from the global inventory authority.","check":"State the read and write behavior while disconnected.","code":"","tags":[]},{"id":"lesson-6","category":"01.3 · Consistency and causality","title":"Linearizability vs serializability","kind":"Lesson","analogy":"A single ticket counter numbers visitors in an order everyone agrees on; another clerk may reorder independent tasks without violating each task’s rules.","explanation":"Linearizability is a real-time ordering property for operations. Serializability concerns equivalent transaction execution order. They solve related but different problems.","mechanism":"Use linearizable authority for shared coordination and transaction isolation for multi-record invariants. Test the guarantees your storage mode actually provides.","tradeoff":"Strict coordination adds latency and can reduce write availability.","scenario":"Two requests race to decrement inventory.","check":"Identify which property avoids overselling.","code":"","tags":[]},{"id":"lesson-10","category":"01.3 · Consistency and causality","title":"Lamport clocks, vector clocks & HLC","kind":"Lesson","analogy":"A group of hikers orders events by numbered notes when their watches disagree.","explanation":"Logical clocks capture causal ordering without trusting wall time. Lamport clocks give an order compatible with happened-before; vectors can identify concurrency; hybrid logical clocks combine wall time with logical progress.","mechanism":"Use entity versions for most business flows; adopt causal clocks when cross-replica causal relationships matter.","tradeoff":"Vector metadata grows with writers; timestamps alone cannot reliably determine causality.","scenario":"Two offline devices update the same profile.","check":"Which metadata reveals whether the writes were concurrent?","code":"","tags":[]},{"id":"lesson-9","category":"01.3 · Consistency and causality","title":"Quorums and replica math","kind":"Lesson","analogy":"Five judges vote; three agreeing forms a majority that intersects any other majority.","explanation":"Quorum operations aim to overlap replica sets, but overlapping quorums alone do not guarantee linearizability without the protocol’s rules.","mechanism":"For N replicas, choose read/write acknowledgements considering R+W>N and the actual consistency implementation; handle stale leaders, concurrent writes and failures.","tradeoff":"Higher acknowledgment counts increase latency and reject more writes during failure.","scenario":"N=5, W=3, R=3. What does a partition of two nodes allow?","check":"Explain why majority acknowledgment does not make two-service transactions atomic.","code":"","tags":[]},{"id":"lesson-7","category":"01.4 · Coordination and identity","title":"Leader election, split-brain & leases","kind":"Lesson","analogy":"Two people both believe they are team captain after a communication breakdown.","explanation":"Election chooses who should lead; a stale leader may keep acting after its lease expires. Split-brain is competing authority.","mechanism":"Enforce leader epochs or fencing at the protected resource, not just in the lock service.","tradeoff":"Coordination itself can become unavailable.","scenario":"An old worker resumes after a 45-second GC pause.","check":"Explain how token 22 prevents token 21 from writing.","code":"","tags":[]},{"id":"lesson-8","category":"01.4 · Coordination and identity","title":"Fencing tokens","kind":"Lesson","analogy":"A new building-access badge has serial number 107; the retired badge 106 cannot open the door.","explanation":"A fencing token is a monotonically increasing epoch attached to operations. Storage rejects a stale epoch.","mechanism":"On acquiring a lease, obtain a higher epoch; every guarded write checks epoch ≥ last accepted value atomically.","tradeoff":"Requires cooperation from the final resource; Redis lock alone does not implement fencing.","scenario":"A paused worker resumes after another acquired its lease.","check":"Where must the epoch comparison occur?","code":"","tags":[]},{"id":"lesson-11","category":"01.4 · Coordination and identity","title":"Consistent hashing & rendezvous hashing","kind":"Lesson","analogy":"A library places books around a circular shelf: adding one shelf section moves only a portion of books.","explanation":"Hash-based routing distributes keys over nodes and minimizes movement when membership changes. Virtual nodes and rendezvous hashing improve distribution and simplicity.","mechanism":"Choose deterministic routing, replication mapping, membership discovery, rebalancing and hot-key handling.","tradeoff":"Hot keys and changing membership still require careful migration.","scenario":"A cache cluster grows from 8 to 10 nodes.","check":"Explain why naive hash(key)%N causes extensive remapping.","code":"","tags":[]},{"id":"lesson-15","category":"01.4 · Coordination and identity","title":"Idempotency keys & scope","kind":"Lesson","analogy":"A restaurant order ticket can be shown twice but should not create two meals.","explanation":"Idempotency maps repeated attempts of one logical operation to one outcome. A key needs a documented scope, request fingerprint and retention window.","mechanism":"Persist key + payload digest + result transactionally. Reject same key with conflicting payload. Define expiry and ambiguous IN_PROGRESS handling.","tradeoff":"Storage overhead and result retention must be planned.","scenario":"POST /payments times out; client resends the same key.","check":"What happens when the key is reused with a different amount?","code":"// Sketch: enforce uniqueness in the SAME durable transaction as the effect.\n// unique index on (tenant_id, idempotency_key)\nOperation op = repository.findOrCreate(tenant, key, sha256(body));\nif (!op.requestHash().equals(sha256(body))) throw new ConflictException();\nif (op.isCompleted()) return op.savedResponse();\n// Acquire a transaction-scoped lock; apply business transition once.\nreturn transaction.execute(() -> commitAndRecordResponse(op));","tags":[]},{"id":"lesson-16","category":"01.5 · Resilience and recovery","title":"Rate limiting, shedding & backpressure","kind":"Lesson","analogy":"A club limits entry (rate limit), closes admission when packed (shedding), and slows the entrance queue (backpressure).","explanation":"These controls manage different points of overload. Rate limits enforce policy; shedding protects current capacity; backpressure propagates consumer limits upstream.","mechanism":"Combine per-tenant quotas, adaptive concurrency admission, bounded queues and explicit retry signals.","tradeoff":"Rejecting work reduces availability but can improve successful critical transactions.","scenario":"20× peak exceeds DB connections by 5×.","check":"Choose where to reject requests and which routes retain priority.","code":"if (!checkoutPermits.tryAcquire()) {\n  return ResponseEntity.status(503).header(\"Retry-After\", \"2\").build();\n}\ntry { return processCheckout(); }\nfinally { checkoutPermits.release(); }\n// Instance-local illustration; preserve separate capacity for important routes.","tags":[]},{"id":"lesson-17","category":"01.5 · Resilience and recovery","title":"SLOs, error budgets & burn rates","kind":"Lesson","analogy":"A flight operator budgets permissible delays instead of promising zero turbulence.","explanation":"An SLO defines a measurable acceptable level of service. Error budgets translate this into allowed failures over a window; burn rate reports how quickly the budget is consumed.","mechanism":"Set user-journey SLIs, multiwindow alerts, and budget-based release policies.","tradeoff":"Overly ambitious SLOs waste resources; weak SLOs hide customer pain.","scenario":"99.95% monthly availability is targeted.","check":"Estimate downtime allowance in a 30-day month.","code":"","tags":[]},{"id":"lesson-18","category":"01.5 · Resilience and recovery","title":"RPO, RTO & failure domains","kind":"Lesson","analogy":"A backup photocopy limits how much work you lose; a spare office limits how long work stops.","explanation":"RPO is acceptable data loss window and RTO is acceptable restoration time. Availability Zones and regions represent different correlated failure domains.","mechanism":"Design restore points, authority fencing, DNS/client failover, and business reconciliation. Test actual rather than advertised targets.","tradeoff":"Lower RPO/RTO usually demands more cost and coordination.","scenario":"Regional writer fails with 15 seconds of unreplicated writes.","check":"Describe the customer-visible consequence.","code":"","tags":[]},{"id":"lesson-19","category":"01.6 · Decisions and trade-offs","title":"Architecture decision records","kind":"Lesson","analogy":"A judge records evidence and reasons so future reviews can audit the ruling.","explanation":"An ADR records context, selected solution, rejected alternatives, consequences and revisit triggers.","mechanism":"Quantify latency, availability, scale, complexity, costs, staffing and rollback.","tradeoff":"Do not write ADRs merely to justify a preferred technology.","scenario":"Team proposes active-active for a low-traffic admin system.","check":"Write the smallest decision record explaining an alternative.","code":"","tags":[]},{"id":"lesson-20","category":"02 · Scalability and data","title":"Capacity planning and burst budgets","kind":"Lesson","analogy":"A restaurant needs enough seats for dinner rush, not the daily average.","explanation":"Peak shape, duration, cost per request, headroom and dependency limits determine capacity.","mechanism":"Compute effective RPS per pod and available DB operations; model autoscaling delay and zone loss.","tradeoff":"Overprovisioning costs money; just-in-time scaling risks sudden bursts.","scenario":"Average 1k RPS, peak 20k RPS for 30 seconds.","check":"Estimate warm pods when each safely handles 350 RPS.","code":"","tags":[]},{"id":"lesson-21","category":"02 · Scalability and data","title":"Queueing theory and Little’s Law","kind":"Lesson","analogy":"Checkout lines grow even when the cashier is busy all the time.","explanation":"Average concurrency L = λW, but it applies to stable flows and consistent scopes. High utilization raises waiting times.","mechanism":"Track arrival rate, service rate, queue age and in-flight operations; bound queues.","tradeoff":"Dropping work may be safer than accepting impossible latency.","scenario":"15k new events/s, 8k processed/s.","check":"Compute backlog added after 2 minutes.","code":"","tags":[]},{"id":"lesson-22","category":"02 · Scalability and data","title":"Autoscaling: HPA, KEDA and warm capacity","kind":"Lesson","analogy":"Hiring a temporary cashier takes time; you need them before the sale begins.","explanation":"HPA can scale using metrics; KEDA supports event-driven scale signals. Neither removes startup delay or database limits.","mechanism":"Size node headroom, pod startup time, readiness, cluster autoscaler behavior, metric freshness and consumer partitions.","tradeoff":"Fast scaling can overload shared dependencies.","scenario":"Pod readiness 90s, peak rises in 8s.","check":"Design mitigation before scale-out finishes.","code":"","tags":[]},{"id":"lesson-23","category":"02 · Scalability and data","title":"Database indexing and query plans","kind":"Lesson","analogy":"A book index avoids reading every page to find a name.","explanation":"Indexes reduce documents examined when query shape and selectivity match. Every index costs memory, writes and maintenance.","mechanism":"Measure explain plans, scans vs returned rows, sort coverage, compound index prefixes and cardinality.","tradeoff":"Extra indexes amplify write IO and storage.","scenario":"MongoDB p99 rises from 30ms to 3s after growth.","check":"What evidence distinguishes missing index from pool saturation?","code":"","tags":[]},{"id":"lesson-24","category":"02 · Scalability and data","title":"Sharding and hot partitions","kind":"Lesson","analogy":"Opening five checkout lanes does not help if all customers insist on lane one.","explanation":"Sharding distributes data and throughput by key. A poor key concentrates load and creates hot partitions.","mechanism":"Evaluate cardinality, entropy, query patterns, joins, cross-shard transactions, rebalancing and tenant skew.","tradeoff":"Cross-shard queries and rebalancing raise complexity.","scenario":"One customer sends 80% of traffic.","check":"Choose a composite partitioning strategy.","code":"","tags":[]},{"id":"lesson-25","category":"02 · Scalability and data","title":"Caching hierarchy and invalidation","kind":"Lesson","analogy":"Your refrigerator saves trips to the market, but milk can expire.","explanation":"Browser, CDN, service and database caches have different freshness and failure patterns. Cache correctness depends on authoritative validation and invalidation rules.","mechanism":"Choose cache-aside, read-through, write-through or event-driven invalidation by data type; protect miss bursts.","tradeoff":"Cache coherence adds operational complexity and stale answers.","scenario":"Price changes during checkout.","check":"Identify which layer must verify final price.","code":"","tags":[]},{"id":"lesson-26","category":"03 · Consistency and transactions","title":"Replication and read consistency","kind":"Lesson","analogy":"Photocopies of a notice can disagree until everyone receives the revision.","explanation":"Async replicas can serve stale reads; synchronous acknowledgements trade write latency for durability/visibility guarantees.","mechanism":"Define read concerns and write concerns precisely for each datastore; audit lag and session guarantees.","tradeoff":"Fast local reads may be stale.","scenario":"User saves profile and immediately refreshes.","check":"Choose read-your-writes strategy.","code":"","tags":[]},{"id":"lesson-27","category":"03 · Consistency and transactions","title":"Optimistic locking and lost updates","kind":"Lesson","analogy":"Two editors modify the same document; only an editor holding the current revision can save.","explanation":"Version-based compare-and-swap prevents blind lost updates.","mechanism":"UPDATE record WHERE id=? AND version=?; require affected rows=1, increment version atomically.","tradeoff":"Conflicts require retries or user resolution.","scenario":"Two workers reserve the same unit.","check":"Show expected-version conditional write.","code":"// One atomic database operation (SQL illustration)\nUPDATE inventory SET available = available - 1, version = version + 1\nWHERE sku = :sku AND available > 0 AND version = :expectedVersion;\n// affectedRows == 1 -> reservation won; 0 -> conflict or sold out","tags":[]},{"id":"lesson-28","category":"03 · Consistency and transactions","title":"Transactions, isolation and write skew","kind":"Lesson","analogy":"Two doctors each see the other on duty and both sign off, leaving no doctor.","explanation":"Even transactions can violate multi-row invariants under some isolation levels. Write skew is an important anomaly.","mechanism":"Model invariant, isolation level, lock scope and retry semantics; test concurrent schedules.","tradeoff":"Serializable isolation can reduce throughput and require retries.","scenario":"Two agents each remove one of two required approvers.","check":"Explain why checking before committing is not enough.","code":"","tags":[]},{"id":"lesson-29","category":"03 · Consistency and transactions","title":"Transactional outbox and inbox","kind":"Lesson","analogy":"Put the receipt and shipping slip in the same sealed envelope before a courier collects them.","explanation":"Outbox removes the unsafe DB-commit-then-publish gap; consumers still need idempotency.","mechanism":"In one transaction save domain state and outbox row; publish asynchronously; mark delivered or retry; dedup by event ID at consumer authority.","tradeoff":"Additional storage, cleanup and relay operations.","scenario":"Order committed, Kafka unavailable.","check":"Explain how the event is eventually published.","code":"@Transactional\npublic Order createOrder(CreateOrder cmd) {\n  Order order = orders.save(Order.pending(cmd));\n  outbox.save(new OutboxEvent(order.id(), \"OrderCreated\", payload(order)));\n  return order;\n}\n// Relay publishes later; consumer deduplicates eventId durably.","tags":[]},{"id":"lesson-30","category":"03 · Consistency and transactions","title":"Sagas and compensation","kind":"Lesson","analogy":"A travel agent books flights and hotels separately; a failed hotel requires canceling the flight.","explanation":"Saga workflows coordinate local transactions with compensating actions. Compensation is not an atomic rollback.","mechanism":"Persist a state machine, unique commands, timeouts, human escalation and reconciliation.","tradeoff":"Transient inconsistent business states need explicit UX.","scenario":"Payment captured, order write fails.","check":"Design the compensation and unknown-outcome handling.","code":"","tags":[]},{"id":"lesson-31","category":"03 · Consistency and transactions","title":"CRDTs and conflict resolution","kind":"Lesson","analogy":"Two people add notes offline, then merge them without throwing either away.","explanation":"Conflict-free replicated data types can converge under supported merge operations, but not every business invariant is mergeable.","mechanism":"Choose grow-only counters, observed-remove sets or LWW registers only when semantics permit; avoid using LWW for money.","tradeoff":"Metadata and semantics can be hard to explain and audit.","scenario":"Two offline likes counters merge.","check":"Why is this easier than merging inventory sales?","code":"","tags":[]},{"id":"lesson-32","category":"04 · Resilience and recovery","title":"Timeouts, deadlines and retry budgets","kind":"Lesson","analogy":"A relay race has a total finish deadline; each runner cannot use the whole time.","explanation":"Per-hop timeouts without an end-to-end deadline allow latency amplification and futile work.","mechanism":"Propagate remaining budget, retry only safe classes, use jitter, cap attempts and track amplification.","tradeoff":"Aggressive timeouts can reject recoverable requests.","scenario":"Tax API hangs at 60 seconds.","check":"Set a 2-second checkout budget across three dependencies.","code":"","tags":[]},{"id":"lesson-33","category":"04 · Resilience and recovery","title":"Circuit breakers and bulkheads","kind":"Lesson","analogy":"A ship seals a flooded compartment so the rest stays afloat.","explanation":"Circuit breakers stop repeated calls to unhealthy dependencies; bulkheads stop one workload from consuming all capacity.","mechanism":"Use separate concurrency pools, failure windows, half-open probes and sensible fallbacks.","tradeoff":"Open breakers reject some requests; tuning can oscillate.","scenario":"Report jobs exhaust 100 request threads.","check":"Separate worker pools without creating unlimited queues.","code":"","tags":[]},{"id":"lesson-34","category":"04 · Resilience and recovery","title":"Graceful degradation and priority shedding","kind":"Lesson","analogy":"A hospital delays elective procedures to protect emergencies.","explanation":"Under overload preserve the critical user journey and disable optional features.","mechanism":"Rank routes, shed early at admission, reserve resource pools and expose explicit degraded outcomes.","tradeoff":"Prioritization is a product and fairness decision.","scenario":"Search recommendations fail during a checkout surge.","check":"Which features do you disable first?","code":"","tags":[]},{"id":"lesson-35","category":"04 · Resilience and recovery","title":"Retries, exponential backoff and jitter","kind":"Lesson","analogy":"If everyone calls a friend back every minute exactly, their phones keep colliding.","explanation":"Synchronized retries can produce a retry storm and prevent recovery.","mechanism":"Use exponential backoff with random jitter, retry budgets, server Retry-After and idempotent commands.","tradeoff":"Retries add load and can prolong user latency.","scenario":"A third-party provider recovers after a minute.","check":"Estimate amplification with three retries per request.","code":"","tags":[]},{"id":"lesson-36","category":"04 · Resilience and recovery","title":"Disaster recovery and multi-region","kind":"Lesson","analogy":"A backup factory is useless if both factories depend on the same power station.","explanation":"Multi-AZ defends against zonal failures; multi-region targets regional disasters but introduces authority, data movement and routing issues.","mechanism":"Measure RTO/RPO, promotion, old-leader fencing, split-brain risks, async data gaps and restoration.","tradeoff":"Active-active multiwriter is expensive and often unsafe for globally scarce inventory.","scenario":"Primary AWS region is unreachable.","check":"Define a write-failover gate and rollback condition.","code":"","tags":[]},{"id":"lesson-37","category":"05 · Messaging and streaming","title":"Kafka partitioning and ordering","kind":"Lesson","analogy":"Each supermarket cashier handles one lane in order, but different lanes have no global order.","explanation":"Kafka orders records within one partition, not across a topic. Consumer parallelism is bounded by active partitions for a group.","mechanism":"Partition related state changes by stable entity key; attach versions and handle repartitioning and poison records.","tradeoff":"Hot keys cap concurrency.","scenario":"Order v43 arrives before v42 through separate pipelines.","check":"How does version checking preserve projection correctness?","code":"// Same order ID -> same partition under stable partition mapping\nproducer.send(new ProducerRecord\u003c>(\"order-events\", orderId, event));\n// Consumer checks event.version > storedProjection.version atomically.","tags":[]},{"id":"lesson-38","category":"05 · Messaging and streaming","title":"At-least-once, at-most-once, exactly-once","kind":"Lesson","analogy":"A courier may deliver a parcel twice if the receipt confirmation is lost.","explanation":"Delivery guarantees describe broker/processing scopes, not magical end-to-end exactly-once business effects.","mechanism":"Commit offsets only after durable application; use idempotent consumer with unique event IDs; study transactional boundaries.","tradeoff":"Reprocessing has compute and storage costs.","scenario":"Inventory update succeeds then consumer crashes pre-commit.","check":"Show how duplicate decrement is prevented.","code":"","tags":[]},{"id":"lesson-39","category":"05 · Messaging and streaming","title":"Consumer lag, staleness and catch-up","kind":"Lesson","analogy":"Laundry enters a washing queue faster than machines can finish it.","explanation":"Lag in messages is backlog, whereas freshness measures elapsed delay before a business projection catches up.","mechanism":"Track partition offsets, oldest unprocessed event age, consumer throughput, net drain, failures and rebalance churn.","tradeoff":"Adding consumers cannot beat DB throughput or partition count.","scenario":"20k/s arrive, 5k/s processed for 60s.","check":"Compute backlog and remaining catch-up at 8k/s processing with 3k/s new arrivals.","code":"# Kafka consumer-group offsets\nkafka-consumer-groups.sh --bootstrap-server broker:9092 \\\n  --describe --group inventory-consumer\n# Separately measure wall-clock age of oldest unapplied business event.","tags":[]},{"id":"lesson-40","category":"05 · Messaging and streaming","title":"DLQ, poison pills and replay","kind":"Lesson","analogy":"A factory sets damaged items aside instead of stopping the entire assembly line.","explanation":"A poison event fails deterministically; retrying forever blocks progress. DLQs isolate failures but do not resolve business inconsistency.","mechanism":"Bound attempts, preserve event context, redact secrets, classify permanent/transient failures, support audited replay.","tradeoff":"Skipping records can violate strict per-entity ordering.","scenario":"One bad JSON record stalls a partition.","check":"When can you safely skip it?","code":"","tags":[]},{"id":"lesson-41","category":"05 · Messaging and streaming","title":"CDC and data migrations","kind":"Lesson","analogy":"A librarian copies shelves while continuing to log every new book arriving.","explanation":"Change data capture captures mutations after a snapshot, enabling catch-up and controlled cutover.","mechanism":"Snapshot → CDC tail → reconcile → fence old writer → switch → monitor, with explicit rollback authority.","tradeoff":"Two-way rollback is difficult once new writes exist.","scenario":"MongoDB migrates between AWS accounts.","check":"Define a no-split-brain cutover procedure.","code":"","tags":[]},{"id":"lesson-42","category":"06 · Observability and SRE","title":"Logs, metrics and traces","kind":"Lesson","analogy":"A detective needs a timeline (logs), a dashboard (metrics), and a route map (traces).","explanation":"Observability combines structured events, numerical health signals, and request paths across services.","mechanism":"Use correlation IDs and OpenTelemetry context, RED/USE dashboards, user-journey SLIs and cardinality controls.","tradeoff":"High cardinality and unbounded logs create costs.","scenario":"All pods green but checkout success falls to 60%.","check":"Which metric should page?","code":"","tags":[]},{"id":"lesson-43","category":"06 · Observability and SRE","title":"Profiling and diagnostic reasoning","kind":"Lesson","analogy":"A car slowing down might be bad tires, a hill, or traffic; a speedometer alone does not explain why.","explanation":"Diagnose arrival rate vs service time vs resource waiting, not CPU charts in isolation.","mechanism":"Correlate spans with query plans, pool waiting, throttling, GC pauses, locks and downstream p99.","tradeoff":"Sampling can hide rare tail events.","scenario":"Mongo latency rises with app thread growth.","check":"What would prove a connection-pool queue is secondary?","code":"","tags":[]},{"id":"lesson-44","category":"06 · Observability and SRE","title":"Alert design and error-budget policies","kind":"Lesson","analogy":"A smoke alarm should react to fire, not every slice of toast.","explanation":"Alerts need actionability and sensitivity to user harm. Multiwindow burn alerts catch both fast severe failures and slower chronic regression.","mechanism":"Alert on SLI violation, freshness age, stuck partitions and saturation; include owner, dashboard and runbook.","tradeoff":"Over-alerting causes fatigue and ignored incidents.","scenario":"Queue has 10 messages but oldest is 20 minutes old.","check":"Design an age-based critical alert.","code":"","tags":[]},{"id":"lesson-45","category":"07 · Java & Spring engineering","title":"JVM memory, GC and pauses","kind":"Lesson","analogy":"A janitor clears rubbish while the restaurant is serving diners.","explanation":"Heap allocations, garbage collection and stop-the-world pauses affect p99 and lease expiry. Monitor heap and non-heap memory, allocation rate, thread stacks and GC logs.","mechanism":"Set heap/headroom knowingly, inspect JFR and GC logs, distinguish memory leaks from sustained allocation pressure.","tradeoff":"Larger heaps can change pause profiles and container memory pressure.","scenario":"Worker pauses 45s while lease expires.","check":"How do fencing tokens guard its later write?","code":"","tags":[]},{"id":"lesson-46","category":"07 · Java & Spring engineering","title":"Java concurrency & virtual threads","kind":"Lesson","analogy":"Adding more phone operators helps only if the database can answer their calls.","explanation":"Threads model concurrent tasks; virtual threads make blocking I/O cheaper but do not increase backend capacity. Shared locks, pools and pinning still matter.","mechanism":"Prefer bounded external resource concurrency, explicit executor isolation and structured cancellation/deadlines.","tradeoff":"Mass concurrency without admission control can overwhelm DB or APIs.","scenario":"Virtual-thread server opens 10,000 parallel Mongo queries.","check":"Identify the remaining bottleneck.","code":"","tags":[]},{"id":"lesson-47","category":"07 · Java & Spring engineering","title":"Spring Boot lifecycle and transactions","kind":"Lesson","analogy":"A shop’s open sign should turn on only after the counter is ready.","explanation":"Startup, liveness, readiness and transactions have distinct semantics. @Transactional typically applies through proxy interception and does not cover separate remote services.","mechanism":"Keep local transaction boundaries short; understand self-invocation, rollback rules, DB timeouts and actuator probes.","tradeoff":"Oversized transactions create locks and slow rollbacks.","scenario":"One method calls its own @Transactional method.","check":"Why might the expected transaction not start?","code":"","tags":[]},{"id":"lesson-48","category":"07 · Java & Spring engineering","title":"REST semantics, idempotency and HTTP","kind":"Lesson","analogy":"A numbered receipt identifies one logical purchase even if the customer asks twice.","explanation":"GET should be safe, PUT should be idempotent under its contract, and POST often needs explicit dedup for retry safety. Distinguish 429 throttling, 503 overload and 202 accepted processing.","mechanism":"Use request validation, stable resource IDs, ETags/If-Match and consistent error payloads with correlation IDs.","tradeoff":"Idempotency needs persistence and replay semantics.","scenario":"Client POST times out after order creation.","check":"Design GET status and retry behavior.","code":"POST /orders\nIdempotency-Key: 7c6e...\n\n202 Accepted\nLocation: /orders/ord-123/status\n// Retry same logical request with identical key and payload.","tags":[]},{"id":"lesson-49","category":"07 · Java & Spring engineering","title":"API versioning and backward compatibility","kind":"Lesson","analogy":"A new electrical outlet should not unexpectedly break every old appliance.","explanation":"Changing producer and consumer versions independently requires compatibility. Evolve schema by adding, reading both versions, migrating, then removing old fields.","mechanism":"Use consumer contract tests, feature flags, expand-contract DB rollout and API deprecation windows.","tradeoff":"Long compatibility windows cost maintenance.","scenario":"A new Kafka producer removes a required field.","check":"Plan an additive rollout instead.","code":"","tags":[]},{"id":"lesson-50","category":"07 · Java & Spring engineering","title":"Security and zero trust","kind":"Lesson","analogy":"A hotel checks both your room key and your right to enter a restricted floor.","explanation":"Authentication identifies callers; authorization limits actions. Trust boundaries exist between microservices, accounts and tenants.","mechanism":"Use OIDC/OAuth2, short-lived credentials, least privilege IAM, mTLS where justified, audit logs and secret rotation.","tradeoff":"Over-privileged service identities raise blast radius.","scenario":"Service A reads tenant B data due to missing row filter.","check":"List the controls at API and storage layers.","code":"","tags":[]},{"id":"lesson-51","category":"07 · Java & Spring engineering","title":"Testing strategy & chaos engineering","kind":"Lesson","analogy":"A fire drill measures whether people can evacuate, not merely whether the alarm works.","explanation":"Unit tests verify logic, integration tests verify boundaries, load tests verify capacity, and fault injection verifies graceful behavior.","mechanism":"Use Testcontainers and contract tests; add concurrency schedules, spike/soak, broker outage, AZ loss and restore drills with measurable pass conditions.","tradeoff":"Chaos without blast-radius safeguards is unsafe.","scenario":"Region failover runbook has never been rehearsed.","check":"Specify one game-day acceptance test.","code":"","tags":[]},{"id":"lesson-52","category":"07 · Java & Spring engineering","title":"AWS networking and IAM fundamentals","kind":"Lesson","analogy":"A building has public entrances, private rooms, security guards and access badges.","explanation":"VPC, subnets, routing, security groups, NAT and IAM determine connectivity and permissions, not just topology boxes.","mechanism":"Trace request paths through ALB/API Gateway, EKS/ECS, private subnets, endpoints, regional data stores and cross-account trust.","tradeoff":"Centralized shared services can be failure bottlenecks.","scenario":"New AWS account cannot reach private MongoDB endpoint.","check":"What routes, DNS and security rules do you check?","code":"","tags":[]},{"id":"lesson-53","category":"07 · Java & Spring engineering","title":"Kubernetes scheduling, probes and limits","kind":"Lesson","analogy":"A seat reservation says where a worker can sit; a performance review says whether they can serve customers.","explanation":"Requests influence scheduling; limits affect runtime throttling or OOM. Readiness governs traffic; liveness governs restarts; startup protects slow initialization.","mechanism":"Inspect kubectl describe, events, endpoints, HPA metrics, pod disruption budgets and zone spread.","tradeoff":"Aggressive liveness checks can convert latency into crash loops.","scenario":"All pods restart during DB outage.","check":"Which probe is probably misconfigured?","code":"kubectl describe pod \u003cpod> -n \u003cnamespace>\nkubectl get events -n \u003cnamespace> --sort-by=.lastTimestamp\nkubectl top pods -n \u003cnamespace>\nkubectl describe hpa \u003cname> -n \u003cnamespace>","tags":[]},{"id":"lesson-55","category":"08 · Integrated concept notes","title":"Distributed systems fundamentals","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"A distributed system has independently failing processes communicating over a network. The network offers latency, loss, duplication, partitions and ambiguous outcomes. Never infer global completion from one component’s local success.","mechanism":"Key mechanisms: Failure model: crash-stop, crash-recovery, omissions, delays, partitions and Byzantine behavior are distinct; most business backends prioritize crash/recovery and network partitions. Safety vs liveness: never charge a customer twice (safety) versus eventually finish or fail an order (liveness). Ordering: wall clocks are imperfect; use per-entity sequence numbers, monotonic revisions or logical clocks where necessary. CAP precisely: under a network partition a replicated system cannot guarantee both linearizable responses and availability for every operation. Without partitions, latency, durability and operational cost still matter. Consensus establishes a single agreed history under defined fault assumptions; leader election alone does not make application workflows atomic.","tradeoff":"Operational controls: Separate commands from observations; define durable operation IDs.; Apply timeouts and retry budgets at every boundary.; Model state transitions explicitly: PENDING → CONFIRMED or FAILED.; Test partitions and stale leader behavior.","scenario":"An API submits payment and times out after 2 seconds. The remote payment service may have committed the charge before the response was lost. Retrying a new request identifier can create a second charge. The caller should persist an idempotency key, query status on ambiguous outcomes, and use provider-supported idempotent APIs.","check":"What evidence proves whether an operation committed?; Which invariant must remain true across a partition?; What happens when an old leader resumes after failover?","code":"","tags":[]},{"id":"lesson-56","category":"08 · Integrated concept notes","title":"Scalability and capacity engineering","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"Scalability means sustaining an increasing useful workload within explicit latency, error and cost budgets. Average RPS hides burst shape, request cost, tenant skew and dependency limits.","mechanism":"Key mechanisms: Little’s Law L = λW: 20,000 RPS × 0.2 seconds yields approximately 4,000 in-flight requests (assuming steady state and consistent units). Utilization approaching 100% creates rapidly increasing queueing latency under variable arrivals and service times. Scale independently by bottleneck: CPU, thread pool, database connections, network bandwidth, partition throughput and remote quotas. Autoscaling is reactive with measurement, scheduling, startup and warmup delays; planned promotions often require pre-scaling. Sharding raises operational complexity: routing, hot partitions, rebalancing, uniqueness and cross-shard operations.","tradeoff":"Operational controls: Benchmark per dependency with representative read/write mixes.; Establish p95/p99 targets and per-route budgets.; Introduce tenant fairness and concurrency limits.; Use predictive scaling only for predictable shapes; add controlled degradation for surprises.","scenario":"At 1,000 average RPS and 20× peak, a fleet tested at 500 RPS per pod needs at least 40 pods for throughput alone. At 70% target utilization it needs about 58 pods, before zone-failure headroom and per-request variance. If pods require 90 seconds to become ready, autoscaling cannot protect an abrupt 10-second spike: shed, buffer or pre-warm.","check":"What happens when the database limits you to 600 concurrent operations?; Is a 20× burst for 5 seconds equivalent to one lasting 20 minutes?; What does one tenant consuming 80% of a partition do to scaling?","code":"","tags":[]},{"id":"lesson-57","category":"08 · Integrated concept notes","title":"Consistency and data integrity","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"Consistency is an observable contract; integrity is the preservation of business invariants. Different objects and operations can require different contracts.","mechanism":"Key mechanisms: Linearizability: operations appear to take effect atomically between invocation and response, across clients. Eventual consistency: replicas converge after updates cease under eventual successful propagation and reconciliation; there is no intrinsic time bound. Read-your-writes and monotonic reads are session guarantees distinct from universal strong consistency. Optimistic concurrency uses version checks to reject lost updates; compare-and-swap must be atomic at the authority. Transactional outbox atomically writes local business state and an event record; a separate publisher may deliver duplicates.","tradeoff":"Operational controls: Publish events via outbox/CDC rather than best-effort dual writes.; Use immutable event IDs and per-aggregate versions.; Define freshness SLO per projection.; Plan repair and audit for stuck or lost state transitions.","scenario":"Two buyers race for one item. Both seeing “1 available” in a cached page is acceptable; both completing the reservation is not. The inventory authority performs an atomic conditional decrement or reservation inside a transaction. The search page may converge later; the checkout path does not trust it.","check":"Can clients read stale data immediately after writing?; Where does a business invariant get checked atomically?; How do you detect a permanently divergent projection?","code":"","tags":[]},{"id":"lesson-58","category":"08 · Integrated concept notes","title":"Resilience and overload control","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"Resilience is maintaining critical outcomes despite faults. Techniques differ: bulkheads contain failure, breakers stop futile dependencies, admission control constrains concurrency, and load shedding rejects optional work.","mechanism":"Key mechanisms: Timeouts must be budgeted end-to-end: a 1-second frontend SLA cannot contain three sequential 900-ms downstream calls. Retries amplify demand: three attempts at every layer can create multiplicative traffic; retry only known transient failures and within a total deadline. Circuit breakers respond to observed failure; they require half-open probes and must not hide permanent correctness failures. Bulkheads isolate executors, connection pools, tenants, or routes so one hotspot does not starve the fleet. Graceful degradation preserves checkout while serving cached recommendations or disabling nonessential enrichment.","tradeoff":"Operational controls: Bound queues and concurrency close to admission.; Reserve explicit capacity for revenue-critical paths.; Instrument rejection rate and successful critical outcomes.; Validate recovery after the fault clears, not just behavior during it.","scenario":"A slow recommendation dependency increases request time from 100 ms to 3 seconds. At 2,000 RPS, in-flight requests rise roughly from 200 to 6,000. Thread/connection pools exhaust, then healthy checkout operations time out. Put a strict 80-ms enrichment budget, dedicated pool and fallback around recommendations.","check":"Which traffic must survive when demand exceeds capacity?; Which failures should not be retried?; How does retry traffic affect a recovering service?","code":"","tags":[]},{"id":"lesson-59","category":"08 · Integrated concept notes","title":"Messaging and event-driven architecture","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"Messaging decouples production from consumption, not correctness. Producer acknowledgements, broker durability, consumer offsets, application commits and downstream effects have distinct failure boundaries.","mechanism":"Key mechanisms: At-most-once risks loss; at-least-once requires idempotent consumers; “exactly once” is scoped to the transaction boundaries supported by the platform. Kafka orders records within a partition, not across all partitions; stable aggregate keys help preserve entity order. Commit offsets after durable side effects when using at-least-once processing; replay can still duplicate effects after an ambiguous commit. Outbox solves local DB/event atomicity; inbox/dedup protects consumers; sagas handle multi-service business outcomes and compensation. A DLQ is operational debt, not completion: classify, alert, replay safely and reconcile affected aggregates.","tradeoff":"Operational controls: Measure event age at durable application commit.; Do not equate Kafka offset lag with business convergence.; Specify partition key based on ordering constraints and skew.; Document replay safety and manual repair paths.","scenario":"Order service writes order and outbox event in one DB transaction. An outbox worker publishes at least once. Inventory processes “OrderPlaced” using eventId dedup and aggregate version, reserves stock transactionally, then emits “InventoryReserved”. On failure it publishes rejection; the order saga transitions accordingly.","check":"When exactly can a producer safely return HTTP 202?; How do you recover a poison-message partition?; What if a consumer commits offset then crashes before DB commit?","code":"","tags":[]},{"id":"lesson-60","category":"08 · Integrated concept notes","title":"Observability and SRE","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"Observability turns unbounded system uncertainty into actionable evidence: golden signals, distributed context, business correctness indicators, and explicit service objectives.","mechanism":"Key mechanisms: SLI is a measurable indicator; SLO is a target for that indicator; SLA is a contractual commitment. Error budgets frame reliability/velocity decisions. Measure request rate, errors, latency distributions and saturation; average latency conceals tail behavior. Trace cross-service requests and asynchronous workflows with trace/correlation identifiers, while controlling sensitive data. For messaging monitor lag count, oldest event age, processing throughput, stagnant partitions, rebalances and time-to-drain. Alert on symptoms and burn rates; attach runbooks, service owners, dashboards and remediation actions.","tradeoff":"Operational controls: Define correctness SLOs alongside uptime.; Tag metrics conservatively to avoid cardinality explosions.; Trace only necessary identifiers; mask PII and secrets.; Use synthetic critical-path probes in addition to internal health checks.","scenario":"Kafka backlog is 900,000 events; after traffic drops, consumers handle 8,000/s while new events arrive at 3,000/s. Net drain is 5,000/s; estimated catch-up ≈ 180 seconds, excluding skew, retries and variability. If arrivals remain 10,000/s, no finite catch-up time exists.","check":"What metric detects a stuck low-volume partition?; When should alerts page rather than create tickets?; How do you distinguish application lag from clock skew?","code":"","tags":[]},{"id":"lesson-61","category":"08 · Integrated concept notes","title":"Failure response and recovery","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"A failure response is a controlled sequence: detect, classify, contain, preserve evidence, mitigate, verify, reconcile, learn. Recovery is incomplete until data integrity and customer outcomes are accounted for.","mechanism":"Key mechanisms: RTO is maximum acceptable restore time; RPO is maximum acceptable data loss window. They belong to business processes rather than generic infrastructure. Health checks distinguish readiness from liveness; restarting a slow database client can increase load or erase diagnostic evidence. Feature flags and rollout controls reduce blast radius, but schema changes require expand-contract and compatibility windows. Active-active writes create conflict and ordering problems; active-passive trades rapid continuity for simpler authority. Game days test runbooks, failure injection, restore procedures and who has permission to switch traffic.","tradeoff":"Operational controls: Publish operational runbooks with exact abort criteria.; Practice backup restoration and check data, not just server startup.; Define rollback for database schema, events and caches.; Track unresolved business records after infrastructure recovery.","scenario":"A MongoDB primary election produces temporary write errors. The safe response is bounded retry with idempotent write semantics and clear customer outcomes; uncontrolled app restart or blind retries can magnify load. Recover business operations left in UNKNOWN via status checks and reconciliation.","check":"What state cannot be recovered from a secondary region?; Who may authorize a failover and when?; How can a rollback create a second failure?","code":"","tags":[]},{"id":"lesson-62","category":"08 · Integrated concept notes","title":"Architectural trade-offs and decision records","kind":"Lesson","analogy":"Think of the whole system as an airport: security, terminals, runways, baggage and air traffic control must coordinate under stress.","explanation":"Good architecture selects the cheapest complexity that meets measurable constraints. Every decision spends capacity, latency, consistency, availability, dollars and human operability.","mechanism":"Key mechanisms: Synchrony couples latency and availability; asynchrony creates queues and temporal inconsistency. Caching lowers repeated cost but adds invalidation, stampedes and stale reads. Microservices offer independent deployment but increase network, consistency, security and operating burden. Multi-region improves geographical fault tolerance but adds data authority and failover complexity. Avoid premature technology: justify sharding, event sourcing or active-active only with workload and invariants.","tradeoff":"Operational controls: Write ADRs before major irreversible migrations.; Quantify improvement relative to baseline.; Keep operational staffing in the cost model.; Measure all outcomes after rollout.","scenario":"A team proposes active-active multi-region checkout for a 99.9% availability target. If inventory must never oversell globally, coordination cost and failure semantics dominate. A single write region plus read-local catalogs and well-tested failover may satisfy the target with substantially less complexity.","check":"Which data actually requires a global single writer?; How does this decision change if peak traffic lasts 20 seconds?; What evidence would make you reverse the decision?","code":"","tags":[]},{"id":"lesson-63","category":"09 · Production failure notes","title":"Case 01: 20× flash-traffic spike","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: 1,000 → 20,000 RPS in 12 seconds; pods take 90 seconds to start; checkout p99 jumps to 9 seconds. Failure domain: Scalability.","mechanism":"Causal mechanism: Latency saturation, queues expand and retries double effective demand. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Enable admission thresholds at gateway, disable optional endpoints, reserve checkout concurrency; prewarm for scheduled campaigns. Long-term prevention: Load-test sustainable RPS; optimize expensive paths; KEDA/HPA with leading metrics; capacity reservations. Caution: Do not add 20× replicas before checking DB quotas and startup time.","scenario":"Measure recovery using Accepted checkout rate; p99; load-shed rate; DB pool wait; CPU throttling. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Scalability"]},{"id":"lesson-64","category":"09 · Production failure notes","title":"Case 02: Six-month organic growth","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Daily requests climb 12% monthly; nightly ETL shares the production primary. Failure domain: Scalability.","mechanism":"Causal mechanism: Slow trend masked by weekly average; indexes and storage IO saturate. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Move ETL out of the peak window, prioritize index/query repair and expand storage headroom. Long-term prevention: Forecast capacity and volume; split reads; establish performance budget per route. Caution: Premature sharding complicates correctness and operations.","scenario":"Measure recovery using Daily p99, query plans, IO wait, growth slope. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Scalability"]},{"id":"lesson-65","category":"09 · Production failure notes","title":"Case 03: Noisy tenant consumes 80%","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: One tenant exhausts a shared search pool during batch imports. Failure domain: Isolation.","mechanism":"Causal mechanism: Head-of-line blocking starves smaller tenants. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Apply per-tenant concurrency and weighted quota; move bulk jobs into a separate lane. Long-term prevention: Isolate tenant quotas, execution pools and storage where justified. Caution: Tenant-level hard limits can penalize legitimate emergencies.","scenario":"Measure recovery using Per-tenant admitted/rejected work and fairness ratio. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Isolation"]},{"id":"lesson-66","category":"09 · Production failure notes","title":"Case 04: Flash-sale inventory overselling","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Two users see one remaining unit and submit checkout simultaneously. Failure domain: Consistency.","mechanism":"Causal mechanism: Cache reads are used as reservations; race lets both orders complete. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Temporarily suspend sale if authority is compromised; reconcile impacted orders. Long-term prevention: Atomic conditional reservation in inventory authority; timeout/release; idempotent saga. Caution: Do not rely on Kafka ordering alone for a cross-partition stock invariant.","scenario":"Measure recovery using Negative stock; duplicate reservation; compensation lag. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Consistency"]},{"id":"lesson-67","category":"09 · Production failure notes","title":"Case 05: Kafka lag continually grows","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Producer 20k/s; consumers 5k/s for 60 seconds. Failure domain: Messaging.","mechanism":"Causal mechanism: Backlog accrues 900k and freshness breaches target. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Increase consumer capacity only within partition and downstream limits; throttle upstream nonessential writes. Long-term prevention: Fix slow handlers, partition skew and batch settings; define backlog SLA. Caution: Adding consumers beyond active partition count does not improve parallelism.","scenario":"Measure recovery using Lag per partition, oldest age, processing rates, error/rebalance counts. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Messaging"]},{"id":"lesson-68","category":"09 · Production failure notes","title":"Case 06: Kafka event processed twice","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: DB write succeeds; consumer crashes before committing offset. Failure domain: Messaging.","mechanism":"Causal mechanism: Replay repeats side effect such as customer credit. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Quarantine financial side effects; correlate eventId with durable ledger. Long-term prevention: Consumer inbox/dedup + unique operation ID in same DB transaction. Caution: A process-local dedup cache does not survive restart.","scenario":"Measure recovery using Duplicate business action count, redelivery count. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Messaging"]},{"id":"lesson-69","category":"09 · Production failure notes","title":"Case 07: Kafka events out of order","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: AddressChanged v42 arrives after v43 due to divergent producers. Failure domain: Messaging.","mechanism":"Causal mechanism: Old value overwrites new projection. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Reject stale versions; temporarily pause affected key if gap handling required. Long-term prevention: Key by entity and enforce monotonic version in projection DB. Caution: Event timestamps are not a reliable ordering guarantee.","scenario":"Measure recovery using Out-of-order version count, skipped gaps. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Messaging"]},{"id":"lesson-70","category":"09 · Production failure notes","title":"Case 08: Kafka broker unavailable","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Leader lost during broker maintenance; producer times out. Failure domain: Messaging.","mechanism":"Causal mechanism: Ambiguous producer outcome and broker queue pressure. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Fail noncritical async publishing; preserve durable outbox; avoid infinite publisher retries. Long-term prevention: Tune replication and acks; test broker failovers; monitor ISR. Caution: A successful write to local outbox is not successful downstream processing.","scenario":"Measure recovery using Publish errors, outbox oldest age, ISR shrinkage. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Messaging"]},{"id":"lesson-71","category":"09 · Production failure notes","title":"Case 09: MongoDB queries slow suddenly","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: p99 jumps from 25ms to 2.5s after data growth. Failure domain: Database.","mechanism":"Causal mechanism: Query scan expands; DB connections queue; service thread count explodes. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Inspect profiler and explain plans; cap concurrency; turn off optional queries. Long-term prevention: Add correct compound indexes, projection and pagination; validate selectivity. Caution: Increasing DB pool size can intensify server overload.","scenario":"Measure recovery using Keys examined/documents returned, lock, pool wait, p99. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Database"]},{"id":"lesson-72","category":"09 · Production failure notes","title":"Case 10: MongoDB primary election","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Primary steps down during 3-zone incident. Failure domain: Database.","mechanism":"Causal mechanism: Transient NotPrimary and uncertain write outcomes. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Retry only idempotent operations with bounded deadlines; surface pending state. Long-term prevention: Use appropriate write concern/read concern; verify replica health and election behavior. Caution: A request timeout does not prove no write committed.","scenario":"Measure recovery using Election duration, write errors, replication lag. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Database"]},{"id":"lesson-73","category":"09 · Production failure notes","title":"Case 11: MongoDB cluster migration","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Move between AWS accounts and clusters; rollback window required. Failure domain: Migration.","mechanism":"Causal mechanism: Data splits if both clusters accept authority writes. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Designate one writer; pause cutover; use CDC resume tokens and reconciliation. Long-term prevention: Snapshot + CDC catch-up + fenced writer cutover; backward delta plan or controlled rollback. Caution: Uncontrolled dual writes create conflict with no trivial rollback.","scenario":"Measure recovery using Change stream lag, count/hash comparisons, divergent IDs. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Migration"]},{"id":"lesson-74","category":"09 · Production failure notes","title":"Case 12: Redis cache failure at peak","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Cache cluster unavailable during promotions. Failure domain: Caching.","mechanism":"Causal mechanism: Database stampede multiplies requests. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Shed cache-dependent noncritical routes; bound DB fallback and use stale safe snapshots. Long-term prevention: Jitter TTLs; singleflight; warm critical keys; cache isolation. Caution: Not every cached item may be safely served stale.","scenario":"Measure recovery using Cache hit rate, DB QPS, stampede key counts. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Caching"]},{"id":"lesson-75","category":"09 · Production failure notes","title":"Case 13: Stale pricing cache","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Price updated but one region serves old price for 15 minutes. Failure domain: Caching.","mechanism":"Causal mechanism: Asynchronous invalidation lost and TTL too long. First identify the first bad state, the first visible symptom, and the first mitigation. Then inspect affected user journeys, queue/service times, state transitions and affected tenants or partitions.","tradeoff":"Immediate containment: Make checkout re-price at authoritative service and expose price change. Long-term prevention: Versioned cache keys, invalidation + TTL, reconciliation. Caution: Checkout totals must be validated at commitment.","scenario":"Measure recovery using Price mismatch rate and invalidation delay. Verify business outcomes, not simply healthy pods. Record a timeline, rollback criteria and unresolved records.","check":"Write a five-minute triage runbook; draw success/failure sequence diagrams; design a game-day experiment proving safe recovery. Which alternative architecture might be simpler?","code":"","tags":["case","Caching"]},{"id":"lesson-76","category":"09 · Production failure notes","title":"Case 14: REST dependency hangs","kind":"Lesson","analogy":"A production incident is like a traffic accident: treat injuries and block further collisions before redesigning the intersection.","explanation":"Incident symptoms: Third-party tax endpoint stalls at 60-second default timeout. Failure domain: Resilience.","mechanism":"Causal mechanism: Synchronous threads accumulate and critical routes stall. Fi
