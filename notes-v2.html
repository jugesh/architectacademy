 or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Pre-warm pods/nodes, degrade optional features and gate admission. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Forecast-based pre-scaling, KEDA when appropriate, warm capacity. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Full peak traffic arrives before pods ready but critical SLO holds. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-81":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Zone-scoped resources; target health; load balancer routing; DB quorum. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Route around AZ, protect quorum and avoid failing all probes together. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Spread pods/nodes/zonal storage; topology constraints; AZ game days. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> One AZ disabled; surviving zones maintain invariant and promised RTO. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-82":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Replication position; lost acknowledged writes; regional dependencies and DNS. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Fence old writer before promotion; fail over only after integrity review. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>RPO/RTO policy, warm standby, drills, missing-write reconciliation. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Blackout region; verify failover and recovery without conflicting writers. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-83":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> PSP transaction lookup; local order status; webhooks; correlation IDs. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Reconcile payment provider status; stop blind charge retries. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Durable saga, merchant idempotency ID, pending payments and settlement reconciliation. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Crash between PSP success and order commit, recover one correct financial outcome. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-84":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Transaction log; outbox relay state; event ID lineage; consumer state. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Do not replay blindly; identify which effects committed. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Transactional outbox/inbox, version guards and compensating operations. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Crash at every boundary; eventual business state converges correctly. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-85":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Consumer compatibility failures; deployment versions; 4xx rate; schema registry. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Roll back incompatible producer or restore compatible API version. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Expand-contract contracts, consumer-driven contract tests, phased rollout. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Old and new services coexist through release and rollback. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-86":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Schema backfill and old replica reads; DB errors; rollout stage. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Restore compatible fields and pause destructive migration. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Additive schema, dual-read backfill, checkpoint, delayed contraction. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> Rolling deploy and rollback both pass against mixed-version data. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-87":"\u003ch2>Incident command: from symptom to evidence\u003c/h2>\u003cp>\u003cstrong>What to measure:\u003c/strong> Business completion rates; synthetic journeys; traces; funnel conversion. Create a timeline separating the first incorrect business state, the first user-visible failure and the first infrastructure alarm. Do not infer root cause only from correlated CPU or errors.\u003c/p>\u003ch3>First five minutes — contain safely\u003c/h3>\u003cp>Restore affected checkout path and alert on business impact. Assign an incident owner; stop concurrent unreviewed changes; capture logs, traces and request/event identifiers before the evidence expires. Decide what should be rejected, degraded or queued rather than letting work accumulate without a bound.\u003c/p>\u003ch3>Follow the failure chain\u003c/h3>\u003col>\u003cli>Identify the authoritative state transition and its invariants.\u003c/li>\u003cli>Follow a representative request from ingress to its dependencies, then along any async events.\u003c/li>\u003cli>Separate new workload, regression, dependency failure, and contention; compare before/after metrics.\u003c/li>\u003cli>Identify ambiguous outcomes (client timed out but server committed; event processed but offset not committed).\u003c/li>\u003cli>Use durable identifiers to reconcile records rather than guessing what succeeded.\u003c/li>\u003c/ol>\u003ch3>Permanent engineering response\u003c/h3>\u003cp>Business SLIs, trace propagation, real-user/synthetic monitoring. Produce an ADR with constraints, alternate remedies, rollout sequence, failback plan and operating cost. Include alert thresholds that protect a user-facing SLO, not only an infrastructure number.\u003c/p>\u003ch3>Prove the repair\u003c/h3>\u003cp>\u003cstrong>Game-day acceptance:\u003c/strong> All infrastructure checks green while synthetic checkout fails—and alert fires. Measure detection time, mitigation time, p99 latency, business-success rate and outstanding reconciliation debt. Re-run under the original triggering load profile.\u003c/p>","lesson-88":"\u003ch2>A capstone design must survive a walkthrough of every hard failure.\u003c/h2>\u003ch3>Underlying mechanism\u003c/h3>\u003cp>Assume 100,000 HTTP RPS with a 90% cacheable catalog workload, 2,000 checkout RPS, inventory cannot oversell, read projections may lag up to 30 seconds for 99% of updates, and strict authenticated tenant access. These are exercise assumptions.\u003c/p>\u003ch3>Concrete architecture example\u003c/h3>\u003cp>Traffic ingress: CDN/WAF → API Gateway → catalog/read services; checkout → order authority → inventory reservation → PSP with durable pending states. Outbox → Kafka → independently monitored projections. MongoDB stores appropriate aggregates with versioned writes. Redis is a cache, not an inventory authority.\u003c/p>\u003ch3>Implementation and verification\u003c/h3>\u003cp>Prove: two buyers racing for last SKU; Kafka outage after order commit; PSP timeout after capture; MongoDB primary election; AZ failure; region promotion and failback. For each, state user response, durable record, monitoring, and reconciliation.\u003c/p>\u003ch3>Review exercise\u003c/h3>\u003cp>Capacity: 2,000 checkout RPS × 0.25 s = approximately 500 simultaneous checkouts, but connections, storage writes and provider quotas must be sized separately. For a 20× peak or 100k RPS, define actual request mix rather than applying peak to every service.\u003c/p>","lesson-89":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Architects turn vague aspirations into testable contracts. An architect is like a structural engineer: “safe building” is not a calculation; occupancy, earthquake load, materials and permitted deflection are.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Define functional flows and quality attributes separately. Express each attribute as a scenario with source, stimulus, operating context, target artifact, response and measurement.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A requirement such as “fast checkout” is not testable. Instead: at 2,000 checkout RPS during an AZ failure, 99% of accepted requests finish within 800 ms and no confirmed order oversells inventory.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Interview the product owner, operations and security; record constraints and assumptions; rank risks; create a workload model; negotiate trade-offs; put verification in CI/load and failure tests.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Overly strict numbers increase cost; vague numbers externalize risk to users. Decide whether to reject excess demand, queue it, or relax a feature.\u003c/p>","lesson-90":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Architecture begins with boundaries, not technology logos. In a hospital, the pharmacy may see patient data but does not become the owner of medical records.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Draw the system context first: users, internal bounded contexts, external providers and trust boundaries. For every entity identify its authoritative writer, read models, lifecycle and permitted integration events.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Two services editing the same MongoDB collection are not independent: they share a schema and deployment constraint. A cleaner boundary has one owner exposing commands/events and a published data contract.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Trace a business capability from request through authority and downstream projections; label trust boundaries and transactional boundaries on the diagram; then rehearse failure and versioning.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>A shared database simplifies early delivery but raises coupling; distributed ownership adds operational cost and consistency work.\u003c/p>","lesson-91":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Different diagrams answer different questions. A city map, floor plan and electrical plan all show the same building but at different levels of detail.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Use C4 context for external relationships, containers for deployable applications and datastores, components for internal responsibilities, and sequence diagrams for temporal behavior. Add deployment and data-flow views for failure zones and trust boundaries.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A diagram that shows Order → Kafka → Inventory but omits who commits the order cannot establish correctness. Sequence diagrams must include transactions, acknowledgments, retries, timeouts and compensation branches.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Choose one important user journey; annotate synchronous dependencies, durable boundaries, queues, owners and failure paths. Validate the drawing against production tracing.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Overdiagramming creates stale documents; too little detail hides the critical failure path. Version diagrams with the implementation.\u003c/p>","lesson-92":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Decision quality is judged by reasoning and evidence, not tool popularity. A doctor records diagnosis, rejected alternatives, risks and follow-up—not just a medication name.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>An ADR captures status, context, decision drivers, alternatives, chosen approach, rejected options, consequences, rollback path and evidence. Distinguish easily reversible choices from one-way-door decisions such as partition keys and public API contracts.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Example: choose transactional outbox over direct Kafka publish because database commit and event publication cannot share a normal atomic transaction. Alternative: CDC with Debezium, with different operations burden.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Write an ADR before implementation; quantify constraints and SLOs; identify who can approve and the deadline to revisit. Link metrics that could falsify the choice.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>A good choice today may be wrong after 10× growth. Record triggers for revision rather than defending it forever.\u003c/p>","lesson-93":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Good governance removes uncertainty before it becomes expensive. A pilot checklist is not bureaucracy when it catches a fuel problem before takeoff.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Evaluate correctness, failure modes, observability, operability, security, data lifecycle, performance, cost and rollback. Use a risk register with probability, impact, owner, mitigation and trigger. Distinguish accepted risk from forgotten risk.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>During a design review, a 99.95% uptime promise without DR drills is a risk. Assign owner and evidence: synthetic failover under simulated AZ loss, documented RTO and actual recovery timeline.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Review with development, QA, security, SRE and product stakeholders. Log unresolved decisions and verify closure after release; use fitness functions or guardrail tests for durable rules.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Approval committees can become bottlenecks. Prefer lightweight review with clear thresholds for high-impact decisions.\u003c/p>","lesson-94":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>The transaction boundary should follow the business rule. A supermarket receipt and stock counter are different documents even when the cashier sees both.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Model aggregate identities and invariants before choosing MongoDB collections or relational tables. Embed objects when ownership and atomic updates align; reference when life cycles and cardinalities differ. Design indexes from query patterns and selectivity.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>For an order, address snapshot and order lines often belong together; inventory counts for shared SKUs do not belong inside arbitrary order documents. Cross-aggregate workflows need local commits and recovery.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Write commands and queries, expected cardinality, retention, expected growth, and concurrent updates. Test unique constraints and optimistic version checks using race tests.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Embedding can simplify reads but produce oversized mutable documents. Excessive normalization increases round trips and distributed joins.\u003c/p>","lesson-95":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>A transaction's name alone does not prove the invariant. Two surgeons each check that another surgeon is on call; both see one remaining and both go off duty.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Understand read committed, repeatable read, snapshot isolation and serializable semantics in the particular database. Lost updates, write skew and phantom rows depend on how transactions conflict and whether predicates are protected.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>With snapshot isolation, two transactions can each read 'at least one doctor on duty' and update different doctor rows. Both commit because they write separate records; the cross-row invariant is broken.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Write the interleaving explicitly as T1 read, T2 read, T1 write, T2 write. Enforce with serializable isolation, a common guard record, or an alternate invariant-safe data model; test under concurrency.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Stronger isolation may incur aborts and throughput cost. Never assume MongoDB transactions, relational ACID, and application-level retries all mean equivalent isolation.\u003c/p>","lesson-96":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Old and new application versions coexist during deployments. A railway cannot replace every track while trains are moving; it adds a compatible track before retiring the old.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Use expand → migrate/backfill → switch reads/writes → contract. Add nullable or default-compatible fields, dual-read during transition when necessary, and backfill idempotently with checkpoints.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Version N writes old schema, version N+1 reads both and writes the new form, backfill catches historical documents, then after all old consumers disappear remove the old field. Kafka schema compatibility must be assessed independently.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Define compatibility matrix, rollout order, rollback behavior, backfill duration, and stale consumer policy. Track migration progress and sample data checksums.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Dual writes can diverge; backfills can overload the datastore; irreversible destructive migrations make rollback impossible.\u003c/p>","lesson-97":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Databases do not make writes durable merely by receiving bytes. A clerk first writes the transaction in a numbered ledger, then organizes records into cabinets later.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Understand write-ahead logging, fsync/durability, B-trees versus log-structured approaches, page caches, compaction, write amplification and index maintenance. Query latency depends on data distribution, index selectivity and cache hit rate.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A bulk ingest can appear CPU-light while compaction or secondary-index updates saturate disk I/O. A covering index may avoid document fetches; a low-selectivity index may be worse than a scan.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Measure disk utilization, read/write IOPS, cache misses, slow queries, examined/returned ratio, and the effect of indexes on write throughput. Verify read and write concerns and failure semantics.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Extra indexes speed targeted reads but tax writes and storage. Durability settings balance latency against acknowledged data loss risk.\u003c/p>","lesson-98":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Security is a property of flows and trust assumptions, not a gateway checkbox. A hotel receptionist checking ID does not give the guest unrestricted access to every room.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Map assets, actors, trust boundaries and abuse paths. STRIDE prompts spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege. Authenticate callers; authorize each business operation and object; minimize service privileges.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A JWT can be valid yet its subject must not access another tenant's invoice. Object-level authorization must run in the owning service even if the gateway authenticated the caller.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Trace request identity through proxies and async messages, define tenancy boundaries, apply short-lived credentials and IAM least privilege, rotate secrets, and test forbidden cross-tenant access.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>More checks add latency and maintenance but ignoring boundary checks creates lateral-movement opportunities. Avoid logging tokens or sensitive payloads.\u003c/p>","lesson-99":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Authentication identifies a principal; authorization grants a specific action. A driver's license proves identity; it does not grant permission to enter a restricted laboratory.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>OIDC provides identity on top of OAuth2; OAuth2 delegates scoped access. Validate token issuer, audience, expiry and signatures; use scopes/roles only as inputs to resource-level policy. mTLS authenticates service endpoints, not necessarily the end user.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A mobile app obtains an access token for the API; the gateway verifies it. The order service authorizes user U to modify only orders owned by U. A backend worker uses workload identity with a distinct purpose-limited credential.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Separate human and machine identities, understand token forwarding risks, avoid storing shared secrets in Git, apply issuer/audience checks, use IAM roles for AWS workloads, and design revocation/expiry behavior.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Long-lived self-contained tokens reduce introspection load but complicate revocation. mTLS adds deployment/certificate lifecycle complexity.\u003c/p>","lesson-100":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>A shared platform needs explicit fairness and isolation guarantees. In an apartment building, one tenant should not consume all the water pressure or see another tenant's mail.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Choose shared table with tenant keys, database-per-tenant, or account-per-tenant based on isolation, regulatory, operational and cost requirements. Enforce tenant identity at ingress and data-access layers; avoid trusting tenantId from user input.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A tenant with a faulty integration sends 80% of traffic. Per-tenant quotas, queue partitions, concurrency pools and budgets prevent it from starving others. Ensure every index and cache key includes tenancy where required.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Test cross-tenant access, noisy-neighbor load, tenant deletion and backups, noisy hot shards, fair retries, per-tenant observability and cost allocation.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Dedicated stacks improve isolation but raise upgrade and operational cost. Shared stacks offer economies but expand blast radius.\u003c/p>","lesson-101":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Keeping data forever is a hidden architecture decision. A filing cabinet that never discards outdated records becomes both expensive and dangerous.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Classify PII, secrets and financial data. Set retention and deletion policies, map data copies across logs, caches, backups and projections, and choose encryption in transit and at rest. Understand key ownership, rotation and auditability.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A user's deletion request reaches the source database but leaves identifiers in Kafka compacted topics, analytics, search snapshots and logs. A complete lifecycle has deletion propagation, backup expiry and exception documentation.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Document data lineage, retention matrices and access paths. Enforce logging redaction and non-production data masking. Treat regional data residency as a deploy-and-operate constraint.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Strict deletion may conflict with legal retention obligations and audit needs. Define policy with legal/security rather than inventing retention windows.\u003c/p>","lesson-102":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>A deployment is a controlled experiment with a rollback path. A chef introduces a new recipe to one table before changing dinner for the whole restaurant.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Use reproducible builds, artifact provenance, security scanning, contract tests, canary or blue-green deployment, feature flags and automated rollback signals. Separate deploy from release and from irreversible schema changes.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Route 5% of traffic to the candidate. Compare request success, p99, saturation and business conversion against control; progressively increase only while guardrails hold. Avoid sampling only healthy endpoints.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Define deployment guardrails before the release, preserve compatibility between versions, automate smoke journeys, test rollback, and track change failure rate plus recovery time.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Feature flags require cleanup and evaluation; a canary may miss tenant-specific paths if traffic is unrepresentative.\u003c/p>","lesson-103":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>A container being 'running' does not mean it can safely accept work. A shop with its lights on may still have no staff or stock.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>CPU requests affect scheduling; CPU limits can throttle; memory limits risk OOM kills. Startup probes allow slow initialization, readiness gates routing, and liveness triggers restarts. Misconfigured liveness during database outage can turn a dependency fault into a restart storm.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>An app consumes all JDBC pool connections. Liveness probe checks the database and fails, restarting every pod. Proper design keeps liveness local to process health; readiness may temporarily stop traffic but should avoid coordinated failure.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Measure pod throttling, OOM, pending reasons, eviction events, node pressure, PDB constraints, HPA metric lag and readiness flaps. Size topology spread and zonal placement.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Overprovisioning costs money, yet zero spare nodes creates scaling delays. Overly aggressive probes reduce availability.\u003c/p>","lesson-104":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Infrastructure configuration deserves the same review rigor as application code. A building blueprint matters only if the constructed building still matches it.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Manage resources declaratively and review plans for destructive effects, IAM scope, region dependencies, networking and persistent storage. Keep secrets outside state wherever supported, protect remote state, and segment state/projects to control blast radius.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A shared Terraform state holds networking and production databases. A mistaken refactor produces a destructive plan affecting both. Boundaries, explicit approvals, state locking and backups narrow the failure.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Require peer review of the plan, policy checks, least-privilege credentials, disaster-tested state recovery and drift detection. Treat manual hotfixes as temporary, then reconcile state.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Small modules ease reuse but excessive abstraction obscures resources and changes. Reusable IaC is not necessarily safer if the blast radius grows.\u003c/p>","lesson-105":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Recovery speed depends as much on coordination as technology. Firefighters assign an incident commander; they do not all independently change the building's electrical switches.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Define severity and roles: incident commander coordinates; operations mitigates; communications keeps stakeholders informed; scribes preserve the timeline. Runbooks contain triggers, commands, safety checks, rollback and validation. Postmortems focus on conditions and system improvements.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Kafka lag grows and checkout errors spike. A coordinator freezes nonessential deploys, an operator identifies the bottleneck, another checks business outcomes, and a communicator updates expected impact based on evidence.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Record detection time, first user impact, mitigation time and unresolved data. Run game days and track actions to closure; practice restores rather than merely writing a DR document.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Too many people executing uncoordinated fixes creates new incidents. Excessive approval chains delay mitigation.\u003c/p>","lesson-106":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Architecture is optimization under multiple budgets. A delivery company can buy 100 trucks for holiday demand or combine reservations, rentals and scheduling.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Track marginal cost per transaction, baseline infrastructure, standby capacity, data transfer, storage growth, third-party requests and engineering operations. Convert architecture choices into monthly spend and user-facing SLO consequences.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>A multi-region active-active design doubles some steady-state costs and increases synchronization complexity. For a service with a one-hour RTO, a warm standby may be sufficient; for a 30-second RTO, more permanent capacity may be warranted.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Create a workload model by endpoint, calculate peak resource needs and data transfer, reserve AZ failure capacity, test at realistic load, and revisit forecasts as traffic changes.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Cloud autoscaling is not a substitute for cost controls or dependency quotas. Lower cost can raise incident probability; higher cost can still deliver no useful resilience.\u003c/p>","lesson-107":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>Choose the simplest system that satisfies measured constraints. Buying a racing car to deliver groceries adds maintenance without solving the customer's problem.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Build a decision matrix with correctness requirements, workload shape, data size, team expertise, operations maturity, security, portability and exit cost. Use architecture fitness functions—automated checks for boundary rules and quality attributes.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Before adopting Kafka, compare HTTP+outbox, SQS and Kafka on ordering, replay horizon, consumer count, delivery semantics, operations and scale. The best answer can be 'do not introduce a broker yet'.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Prototype risky assumptions, measure p99 under target volume, verify failure recovery, document ADR and revisit criteria. Avoid popularity-based scoring and ungrounded vendor benchmarks.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Highly managed services reduce operational ownership but can increase lock-in and billing variability. Self-hosting buys control at a staffing cost.\u003c/p>","lesson-108":"\u003ch2>Why this matters to an architect\u003c/h2>\u003cp>A senior architect scales decisions through people, not personal heroics. A chief architect cannot personally lay every brick; they define standards, inspect critical joins and develop capable foremen.\u003c/p>\u003ch3>Mechanics and mental model\u003c/h3>\u003cp>Set guardrails for teams: API contracts, data ownership, threat modeling, SLOs, observability, deployment gates and ADR thresholds. Delegate implementation authority with clear invariants and review checkpoints. Coach engineers to defend decisions and produce evidence.\u003c/p>\u003ch3>Worked production situation\u003c/h3>\u003cp>Two teams need the same customer data. Instead of centrally writing both integrations, facilitate ownership negotiation, define a stable contract, and ask teams to demonstrate consumer contract tests and failure behavior.\u003c/p>\u003ch3>How to design and verify it\u003c/h3>\u003cp>Run design reviews with questions rather than prescriptions: which rule cannot break, what fails first, how do we recover, and what metric proves success? Track unresolved risk and technical debt to closure.\u003c/p>\u003ch3>Trade-off and failure analysis\u003c/h3>\u003cp>Centralized approval may make the architect a bottleneck. Total autonomy can fragment standards. Aim for federated decisions with common guardrails.\u003c/p>","lesson-109":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A company changes offices; old business cards and map caches still send customers to the previous location.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>DNS TTL controls some caches but clients, resolvers, persistent connections and application discovery each have behavior. Service discovery in Kubernetes adds endpoint propagation and readiness changes.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>A region fails; DNS failover publishes a new target yet existing TCP connections, client caches and sessions still target the previous one.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Set explicit DNS and connection lifetime assumptions, measure effective failover from user locations, and require idempotency during retry.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Low TTL may increase resolver load without guaranteeing instantaneous failover; service discovery is part of recovery, not the only mechanism.\u003c/p>","lesson-110":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A one-lane bridge makes a fast car wait behind a broken truck; more lanes cost space and supervision.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>TCP tracks ordered byte streams and retransmits losses. HTTP/1.1 keepalive reduces handshake cost but connection count can become a queue boundary; HTTP/2 multiplexes streams over one connection yet TCP-level loss can still affect streams.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>An HTTP client pool of 20 connections serves a dependency suddenly taking two seconds per call. Waiting can dominate latency while CPU remains idle.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Track connection acquisition time, active and pending requests, DNS changes and socket timeout behavior. Tune pool sizes against downstream ability, not arbitrarily.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Unbounded connections can overload the dependency; overly tight pools create artificial head-of-line waiting.\u003c/p>","lesson-111":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A sealed envelope protects contents only if you verify the recipient address.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>TLS negotiates encrypted transport and authenticates the server using certificates and trusted issuers. Service-to-service mTLS also authenticates client workload identity; certificate rotation and trust-store management are production concerns.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>An internal service certificate expires at midnight and every service-to-service call begins failing. Retry storms amplify the outage.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Monitor certificate expiry and rotation, automate trust changes, test overlapping issuers, and ensure TLS failures are surfaced as distinct errors.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Disabling certificate verification may 'fix' connectivity while invalidating the entire trust model.\u003c/p>","lesson-112":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>Multiple checkout lines improve parallel service, but if every line shares one blocked tunnel, a tunnel failure affects all.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>HTTP/2 multiplexes request streams over TCP, compresses headers and supports flow control. HTTP/3 uses QUIC over UDP with different transport recovery behavior. Protocol termination at proxies can change end-to-end semantics.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>A gateway advertises HTTP/2 while downstream is HTTP/1.1 with a small connection pool, so multiplexing at the edge hides an inner bottleneck.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Inspect the full request path, connection reuse, per-hop queueing and tail latency under packet loss.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Complex protocol rollout increases observability and compatibility needs; optimize measured bottlenecks first.\u003c/p>","lesson-113":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A committee can record one official decision only after enough members have signed, despite an absent member.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>Raft separates leader election, log replication and safety. Terms make leadership epochs explicit; majority replication determines commitment under Raft's rules. Applying the log to a state machine follows committed order.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>Leader A becomes isolated; the majority elects B, which commits new records. A must not continue behaving as authoritative simply because clients can still reach it.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Understand membership and quorum, leadership changes, log matching, snapshots and why even-sized clusters do not necessarily increase failure tolerance.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Consensus costs coordination and quorum availability; not every event feed or cached projection needs it.\u003c/p>","lesson-114":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A friend not answering the phone could be asleep, traveling or without signal—not necessarily missing.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>In an asynchronous network, perfect failure detection is impossible under arbitrary delay. Heartbeats and adaptive detectors estimate suspicion; phi-accrual style detectors model observed arrival intervals.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>During GC pauses, heartbeats stop; orchestration ejects a healthy instance while its in-flight work is still active.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Tune thresholds using measured pauses and network variance; separate traffic routing decisions from data-authority decisions and fence stale owners.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Aggressive detection speeds reaction but increases false positives and flapping; slow detection extends recovery time.\u003c/p>","lesson-115":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>Two wall clocks disagree by a minute; each clerk thinks their receipt happened first.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>NTP and cloud time services reduce skew but do not eliminate uncertainty. Wall-clock timestamps can move; monotonic clocks are better for measuring durations within a process. Cross-node causal order needs logical sequence or database versions.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>Two regions resolve a write conflict using last-write-wins timestamps; skew causes a newer business update to lose.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Use monotonic timers for deadlines, explicit event sequence/version for state transitions, and monitor clock skew when temporal claims matter.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Stronger global-time guarantees require infrastructure and still need documented uncertainty bounds.\u003c/p>","lesson-116":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A team captain is chosen for the season; booking a conference room grants temporary exclusive use.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>Leader election coordinates who makes decisions for a replicated group. A distributed lock controls temporary ownership of a resource. Both can suffer stale holders unless the protected operation checks a term or fencing token.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>A scheduled billing job starts in two regions during failover. Both possess plausible lock state and generate duplicate invoices.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Use durable job IDs and idempotency, term-scoped authority and a fenced resource. Audit external side effects because a lock cannot roll back an email or payment.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Consensus-backed exclusive authority sacrifices some partition availability to protect correctness.\u003c/p>","lesson-117":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A librarian hands you pages of a moving catalog while books are constantly added.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>Offset pagination can skip or repeat rows when inserts alter position. Cursor pagination uses a stable sort key and tie-breaker such as (createdAt, id), together with an opaque page token.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>An order-history endpoint sorts only by createdAt; two orders have identical timestamps and pages duplicate records.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Use a composite index supporting filters and keyset order, signed or opaque cursors, explicit token expiry, bounded limits and deterministic behavior during updates.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Stable snapshots need extra storage/coordination; keyset pagination is often sufficient for feeds but cannot provide arbitrary page-number jumps cheaply.\u003c/p>","lesson-118":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A travel agent coordinates airline, hotel and transport; it should not pretend to be each company's legal recordkeeper.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>A Backend-for-Frontend aggregates downstream responses, implements client-specific shaping, authentication propagation and graceful optional fallbacks. It should avoid writing authoritative state that belongs elsewhere.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>Mobile page needs product price, promotions and recommendations; a BFF gathers them concurrently with a 500 ms deadline, allowing recommendations to time out while authoritative price still governs checkout.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Cap fan-out, propagate tracing and deadlines, batch N+1 calls, cache safe reads and avoid creating a hidden distributed monolith.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>More aggregators can increase network hops and ownership ambiguity; client simplicity must justify server complexity.\u003c/p>","lesson-119":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A courier may deliver the same notification twice and may not receive a signature even when it arrived.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>Sign webhooks with rotating secrets; include event ID and timestamp, validate replay window, publish durable attempts, retry with bounded backoff and expose delivery status. Receiver needs idempotency and schema compatibility.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>A payment provider sends 'captured' twice and 'authorized' arrives late. Naive status assignment regresses a completed payment.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Use provider transaction ID, monotonic state machine and inbox ledger; reconcile against provider API if callbacks go missing.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Strong ordering is rarely guaranteed across independent webhook retries; business versions and reconciliation matter.\u003c/p>","lesson-120":"\u003ch2>Concept and mental model\u003c/h2>\u003cp>A newspaper changes the meaning of a familiar column header; subscribers misread yesterday's figures.\u003c/p>\u003ch3>Under the hood\u003c/h3>\u003cp>Specify producer ownership, field meaning, nullability, schema compatibility policy, versioning and deprecation. Schema registry compatibility modes are tools, not substitutes for semantic compatibility.\u003c/p>\u003ch3>Production example\u003c/h3>\u003cp>Producer changes amount from cents to rupees without renaming it. Schema remains technically valid but downstream invoices become 100× wrong.\u003c/p>\u003ch3>Engineering checklist\u003c/h3>\u003cp>Review semantic changes, run contract tests against real consumers, stage rollout and audit DLQ/decode failures.\u003c/p>\u003ch3>Trade-off\u003c/h3>\u003cp>Rigid contracts slow evolution; absent contracts shift costs into production incidents.\u003c/p>","notes-1":"","notes-2":"","notes-3":"","notes-4":"","notes-5":"","notes-6":"","notes-7":"","notes-8":"","notes-9":"","notes-10":"","notes-11":"","notes-12":"","notes-13":"","notes-14":""},"diagrams":{"lesson-1":{"kind":"flow","title":"Inventory ownership","normal":["Buyer","Checkout API","Inventory authority","Confirmed order"],"failure":["Second buyer","Stale catalog","Atomic stock check","Reject oversell"],"normalHelp":"The authoritative inventory write is the correctness boundary; search and cache are only projections.","failureHelp":"Two buyers can read the same cached availability, but only one conditional reservation succeeds."},"lesson-2":{"kind":"timeline","title":"Request queuing","normal":["Arrive 1k RPS","Queue briefly","Workers serve","Low latency"],"failure":["Burst 20k RPS","Queue expands","Worker saturated","p99 spikes"],"normalHelp":"Concurrency is arrival rate multiplied by residence time in a stable system.","failureHelp":"Queue wait grows before CPU or average latency necessarily alerts."},"lesson-3":{"kind":"timeline","title":"Ambiguous API outcome","normal":["Request sent","DB commits","Reply delivered","Client confirms"],"failure":["Request sent","DB commits","Reply lost","Status unknown"],"normalHelp":"A successful commit can precede the successful response.","failureHelp":"The client must query by an idempotent operation identifier instead of assuming failure."},"lesson-5":{"kind":"branch","title":"CAP under partition","normal":["Client request","Reach leader","Coordinate quorum","Fresh result"],"failure":["Network split","Quorum unreachable","Deny critical write","Safety retained"],"normalHelp":"Partition-time choices differ by operation.","failureHelp":"Inventory may reject a write while a cached catalog can remain readable."},"lesson-7":{"kind":"timeline","title":"Leadership handover","normal":["Leader term 7","Lease valid","Writes accepted","Term advances"],"failure":["Old leader paused","Lease expires","New leader term 8","Old write rejected"],"normalHelp":"Leadership must have a safe authority transition.","failureHelp":"A stale process may resume; fencing rejects its mutation."},"lesson-8":{"kind":"timeline","title":"Fencing tokens","normal":["Owner gets 41","Resource sees 41","Write accepted","Token advances"],"failure":["Owner 41 pauses","Owner 42 writes","Owner 41 resumes","Token 41 rejected"],"normalHelp":"Monotonic fencing is enforced by the protected resource.","failureHelp":"A lock service cannot forcibly stop a paused client."},"lesson-9":{"kind":"branch","title":"Quorum write","normal":["3 replicas","Leader write","2 acknowledgments","Commit confirmed"],"failure":["Replica isolated","Only 1 reachable","Reject quorum write","No false commit"],"normalHelp":"A quorum requires sufficient members and defined acknowledgment durability.","failureHelp":"Overlapping read/write sets alone do not prove linearizability."},"lesson-10":{"kind":"timeline","title":"Causality versus clocks","normal":["A updates value","A sends message","B receives","B updates"],"failure":["A writes offline","B writes offline","Concurrent values","Resolve conflict"],"normalHelp":"Logical ordering tracks causality, not necessarily wall-clock time.","failureHelp":"Wall-clock last-write-wins can discard legitimate concurrent updates."},"lesson-11":{"kind":"flow","title":"Consistent hashing","normal":["Key hashed","Find ring owner","Route request","Read or write"],"failure":["Node leaves","Ring changes","Some keys move","Caches warm"],"normalHelp":"Hash-based placement minimizes remapping but needs membership agreement.","failureHelp":"Remapping and rewarming can cause load spikes."},"lesson-12":{"kind":"branch","title":"Tail latency fan-out","normal":["Client fan-out","Fast branches","Join results","Page returns"],"failure":["Client fan-out","One slow branch","Join waits","p99 amplified"],"normalHelp":"The end-to-end result waits for its slowest mandatory branch.","failureHelp":"Optional branches should have deadline or fallback."},"lesson-14":{"kind":"flow","title":"Cache stampede","normal":["Read cache","Hit fresh value","Return quickly","DB spared"],"failure":["Hot TTL expires","All requests miss","DB overwhelmed","Latency surges"],"normalHelp":"Synchronizing misses turns a cache optimization into a database surge.","failureHelp":"Single-flight and bounded stale results can prevent amplification."},"lesson-15":{"kind":"timeline","title":"Idempotent checkout","normal":["Key K arrives","Claim operation K","Commit once","Replay result"],"failure":["Key K retries","Existing operation","Check fingerprint","No second charge"],"normalHelp":"The deduplication record defines the operation boundary.","failureHelp":"Same key with a different request must be rejected."},"lesson-16":{"kind":"branch","title":"Overload admission","normal":["Ingress demand","Admit within limit","Serve critical","Meet SLO"],"failure":["20× ingress","Capacity exhausted","Shed o title":"Indexed query path","normal":["Filter by tenant","Index lookup","Few documents","Low latency"],"failure":["New query shape","Index not used","Large scan","Disk pressure"],"normalHelp":"Index usefulness depends on predicate, sort and data cardinality.","failureHelp":"Adding indexes increases write and storage cost."},"lesson-24":{"kind":"branch","title":"Hot partition","normal":["Key distribution","Many partitions","Parallel workers","Even throughput"],"failure":["Flash SKU hot","One hot partition","Serial bottleneck","Lag grows"],"normalHelp":"More consumers cannot accelerate a single ordered hot key.","failureHelp":"Global inventory invariants still require coordination."},"lesson-25":{"kind":"flow","title":"Cache invalidation","normal":["Authoritative write","Publish version","Invalidate key","Fresh read"],"failure":["Price changes","Old cache remains","Buyer sees old price","Checkout revalidates"],"normalHelp":"Caches are copies with freshness contracts.","failureHelp":"Checkout must use authoritative prices."},"lesson-26":{"kind":"timeline","title":"Replica read lag","normal":["Leader commits","Replication arrives","Follower applies","Fresh read"],"failure":["Leader commits","Replica delayed","Follower read","Stale value"],"normalHelp":"Replication and read guarantees vary by topology and options.","failureHelp":"Read-your-writes may require routing or session context."},"lesson-27":{"kind":"timeline","title":"Optimistic concurrency","normal":["Read version 5","Edit document","Update where v=5","Version becomes 6"],"failure":["Two read v=5","One updates v=6","Second checks v=5","Conflict rejected"],"normalHelp":"Expected-version updates turn silent overwrites into detectable conflicts.","failureHelp":"Retry after re-reading and recomputing business intent."},"lesson-28":{"kind":"branch","title":"Transaction isolation","normal":["Read invariant","Lock or serialize","Apply change","Invariant holds"],"failure":["Two snapshots","Concurrent updates","Write skew","Invariant broken"],"normalHelp":"Atomic commits do not guarantee arbitrary cross-row invariants.","failureHelp":"Choose isolation or guard records for the business rule."},"lesson-29":{"kind":"timeline","title":"Transactional outbox","normal":["Order + outbox","Local commit","Relay publishes","Consumer applies"],"failure":["Order commits","Relay crashes","Relay retries","Deduplicate event"],"normalHelp":"The local transaction binds business state to publication intent.","failureHelp":"Relay retries require idempotent consumers."},"lesson-30":{"kind":"flow","title":"Order saga","normal":["Reserve stock","Authorize payment","Confirm order","Notify customer"],"failure":["Stock reserved","PSP times out","Payment pending","Reconcile result"],"normalHelp":"Sagas coordinate durable local transitions rather than global rollback.","failureHelp":"Compensation is another business action, not time travel."},"lesson-31":{"kind":"branch","title":"CRDT merge","normal":["Replica A counter","Replica B counter","Join merge","Converged value"],"failure":["Two offline updates","Independent changes","Merge per CRDT","Preserve intent"],"normalHelp":"Compatible CRDT operations converge under the correct merge semantics.","failureHelp":"Scarce inventory does not become safe merely by using a convergent counter."},"lesson-32":{"kind":"timeline","title":"Deadline propagation","normal":["API 700ms","Inventory 200ms","Payment 300ms","Respond in budget"],"failure":["Downstream hangs","Deadline expires","Cancel or mark pending","Avoid 27 retries"],"normalHelp":"Deadlines are end-to-end budgets, not independent per-hop settings.","failureHelp":"Timeout on external side effect can leave ambiguous outcome."},"lesson-33":{"kind":"flow","title":"Circuit breaker states","normal":["Closed","Failures exceed rule","Open fast-fail","Half-open probe"],"failure":["Dependency slow","Pool saturated","Calls pile up","Cascade"],"normalHelp":"Breakers limit calls to unhealthy dependencies.","failureHelp":"Bulkheads and timeouts must protect finite resource pools."},"lesson-34":{"kind":"branch","title":"Graceful degradation","normal":["Core checkout","Inventory protected","Order confirmed","Optional analytics"],"failure":["20× overload","Skip recommendations","Limit search","Checkout preserved"],"normalHelp":"Degradation should drop low-value behavior first.","failureHelp":"Do not claim success for an uncommitted order."},"lesson-35":{"kind":"timeline","title":"Retry storm","normal":["Request fails","Wait+jitter","Budget check","Limited retry"],"failure":["3 layers retry","Attempts multiply","Dependency swamped","Recovery delayed"],"normalHelp":"Retries amplify offered load if unbounded.","failureHelp":"Concentrate retries at an appropriate boundary."},"lesson-36":{"kind":"timeline","title":"Failover and failback","normal":["Writer in A","Replica in B","Fence A","Promote B"],"failure":["A recovers stale","A still accepts writes","Split-brain","Reconcile conflict"],"normalHelp":"Promotion and failback are separate safety protocols.","failureHelp":"Old region must catch up before becoming authoritative again."},"lesson-37":{"kind":"flow","title":"Kafka ordered partition","normal":["Order ID key","Partition chosen","Ordered append","Consumer applies"],"failure":["Hot key","Same partition","Slow handler","Partition lag"],"normalHelp":"Kafka ordering is per partition.","failureHelp":"Entity version checks handle producer and replay nuances."},"lesson-38":{"kind":"timeline","title":"Delivery duplication","normal":["Consume event E","Apply transaction","Commit offset","Done"],"failure":["Apply event E","Crash before offset","Receive E again","Inbox deduplicates"],"normalHelp":"At-least-once redelivery must not duplicate business effects.","failureHelp":"Exactly-once Kafka operations do not cover arbitrary external effects."},"lesson-39":{"kind":"timeline","title":"Consumer backlog","normal":["Producer 1k/s","Worker 5k/s","Lag zero","Fresh projection"],"failure":["Producer 20k investigation."},"lesson-47":{"kind":"flow","title":"Spring transaction boundary","normal":["Proxy enters method","DB transaction begins","Business writes","Commit or rollback"],"failure":["Order committed","Kafka publish fails","Event missing","Outbox fixes gap"],"normalHelp":"A Spring DB transaction does not include arbitrary external calls.","failureHelp":"Self-invocation and async method boundaries need testing."},"lesson-48":{"kind":"flow","title":"REST idempotent request","normal":["PUT with version","Validate precondition","Update resource","Return state"],"failure":["POST payment","Response lost","Client retries","Idempotency lookup"],"normalHelp":"HTTP method semantics must match actual side effects.","failureHelp":"Use 202 only when durable asynchronous acceptance exists."},"lesson-51":{"kind":"flow","title":"Test layers","normal":["Unit invariant","Integration DB","Contract consumers","Chaos run"],"failure":["Mock passes","Real DB races","Production failure","Missing evidence"],"normalHelp":"Each test layer addresses a distinct uncertainty.","failureHelp":"Race and rollback tests need real transactional behavior."},"lesson-53":{"kind":"branch","title":"Kubernetes probes","normal":["Startup succeeds","Readiness true","Route traffic","Liveness local"],"failure":["DB fails","Liveness queries DB","All pods restart","Capacity lost"],"normalHelp":"Readiness and liveness serve different purposes.","failureHelp":"Dependency outage should not automatically reboot every pod."},"lesson-63":{"kind":"timeline","title":"Flash-sale failure chain","normal":["CDN absorbs reads","Admission limits","Checkout reserved","Stable p99"],"failure":["20× requests","DB pool queues","Client retry storm","Checkout fails"],"normalHelp":"Keep critical capacity protected as demand rises.","failureHelp":"Measure admitted and rejected demand separately."},"lesson-66":{"kind":"timeline","title":"Inventory race","normal":["One unit left","Buyer A reserves","Stock becomes zero","Buyer B rejected"],"failure":["Two read stock=1","Both confirm","Double promise","Compensation"],"normalHelp":"Use atomic conditional reservation at the authoritative datastore.","failureHelp":"Cached stock is not a reservation."},"lesson-67":{"kind":"flow","title":"Hot Kafka partition","normal":["Producer key","Partition balanced","Consumer applies","Lag stays small"],"failure":["One hot key","Single partition busy","Other consumers idle","Lag rises"],"normalHelp":"Partition count and key skew determine useful parallelism.","failureHelp":"Scaling consumer replicas alone may not solve hot-key bottlenecks."},"lesson-71":{"kind":"flow","title":"MongoDB latency cascade","normal":["Indexed query","Pool acquired","Fast Mongo response","API succeeds"],"failure":["Missing index","Slow cursor","Pool saturated","Requests time out"],"normalHelp":"Investigate query plans and connection pool waiting together.","failureHelp":"Extra application pods can make DB overload worse."},"lesson-74":{"kind":"timeline","title":"Redis outage cascade","normal":["Cache hit","Quick answer","DB protected","SLO met"],"failure":["Redis down","All reads miss","DB overwhelmed","API failures"],"normalHelp":"Fallback must have a bounded rate.","failureHelp":"Cache failure should not become database failure."},"lesson-77":{"kind":"timeline","title":"Retry storm timeline","normal":["Downstream heals","Bounded retries","Recovery holds","Normal traffic"],"failure":["Downstream heals","Clients synchronize","Second overload","Repeated outage"],"normalHelp":"Jitter and retry budgets dampen recovery storms.","failureHelp":"Monitor attempts per original request."},"lesson-82":{"kind":"timeline","title":"AWS region failover","normal":["Active A","Replicate to B","Standby validated","Recovery ready"],"failure":["A unavailable","Fence A","Promote B","Reconcile missing"],"normalHelp":"A region cannot safely have two concurrent unchecked writers.","failureHelp":"RPO and RTO must be measured in drills."},"lesson-83":{"kind":"timeline","title":"Payment ambiguous result","normal":["Order pending","Payment authorized","Commit order","Confirmed"],"failure":["PSP captured","Response lost","Order pending","Reconcile PSP"],"normalHelp":"Timeout does not prove payment failure.","failureHelp":"Use a merchant idempotency reference and status lookup."},"lesson-85":{"kind":"timeline","title":"API version rollout","normal":["Add field","Deploy compatible readers","Migrate clients","Remove old field"],"failure":["Remove old field","Old client runs","Decode failure","Roll back"],"normalHelp":"Expand-contract protects overlapping versions.","failureHelp":"Schema compatibility includes meaning, not only syntax."},"lesson-88":{"kind":"flow","title":"Commerce capstone","normal":["CDN catalog reads","Order authority","Inventory reservation","Outbox → Kafka"],"failure":["20× spike","Checkout protected","PSP uncertainty","Reconciliation"],"normalHelp":"Different workloads require separate scaling and correctness contracts.","failureHelp":"A 100k RPS headline does not mean 100k checkout writes."}}}</script><script>
const DATA=JSON.parse(document.getElementById('v2-data').textContent),LESSONS=DATA.entries,DEEP=DATA.deep,DIAGRAMS=DATA.diagrams;
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=decodeURIComponent(location.hash.slice(1)||"home"),openGroup=null,query="";const groups=[...new Set(LESSONS.map(x=>x.category))];
function toggleMenu(on){document.body.classList.toggle('menuopen',on)}
function go(id){current=id;location.hash=id;toggleMenu(false);render();window.scrollTo(0,0)}
function nav(){const found=LESSONS.filter(x=>[x.title,x.category,x.explanation,x.mechanism,x.tradeoff].join(' ').toLowerCase().includes(query)),foundGroup=[...new Set(found.map(x=>x.category))];if(query&&!foundGroup.includes(openGroup))openGroup=foundGroup[0]||null;$('nav').innerHTML=foundGroup.map((g,i)=>'<button class="navhead" aria-expanded="'+(openGroup===g)+'" data-group="'+i+'">'+esc(g)+'</button><div class="navchildren">'+found.filter(x=>x.category===g).map(x=>'<button class="navunit '+(x.id===current?'active':'')+'" data-id="'+x.id+'">'+esc(x.title)+'</button>').join('')+'</div>').join('')||'<p>No matching notes.</p>';$('count').textContent=found.length+' / '+LESSONS.length+' topics';document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const g=foundGroup[Number(b.dataset.group)];openGroup=openGroup===g?null:g;nav()});document.querySelectorAll('.navunit').forEach(b=>b.onclick=()=>go(b.dataset.id))}
function section(cls,title,content){return '<section class="panel '+cls+'"><div class="eyebrow">'+title+'</div><p>'+esc(content||'See the explanation and worked example below.')+'</p></section>'}
function diagram(id){const d=DIAGRAMS[id];if(!d)return '';return '<section class="panel diag" id="diagram"><div class="eyebrow">Flow diagram</div><h2>'+esc(d.title)+'</h2><div class="diagram-nav"><button class="btn active" data-mode="normal">Normal path</button><button class="btn failure" data-mode="failure">Failure path</button></div><div class="svgscroll" id="diagramSvg"></div><p class="diagram-caption" id="diagramText"></p></section>'}
function draw(mode){const d=DIAGRAMS[current];if(!d)return;const stages=d[mode];let items='';for(let i=0;i<stages.length;i++){const x=12+i*176,bad=mode==='failure',color=bad?'#be6946':'#087c76';if(i){items+='<path d="M'+(x-32)+' 60 L'+x+' 60" stroke="'+color+'" stroke-width="2" marker-end="url(#arrow)"/>'}items+='<rect x="'+x+'" y="20" width="142" height="82" rx="11" fill="'+(bad?'#fff2ed':'#e9f7f2')+'" stroke="'+color+'"/><text x="'+(x+12)+'" y="41" font-size="10" font-weight="700" fill="'+color+'">'+(i+1)+'</text><text x="'+(x+71)+'" y="70" text-anchor="middle" font-size="11" fill="#21364a">'+esc(stages[i])+'</text>'}const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 128" aria-label="'+esc(d.title+' '+mode)+'" role="img"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#729c9a"/></marker></defs>'+items+'</svg>';$('diagramSvg').innerHTML=svg;$('diagramText').textContent=mode==='normal'?d.normalHelp:d.failureHelp;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function render(){const x=LESSONS.find(z=>z.id===current);if(x)openGroup=x.category;nav();if(!x){$('content').innerHTML='<div class="topbar"><a href="index.html">Full textbook ↗</a> · <a href="labs.html">Engineering labs ↗</a></div><button class="btn menu" id="menuButton">☰ Browse topics</button><div class="eyebrow">Reader edition</div><h1>Architect Academy V2 — Engineering Notes</h1><p class="lead">Learn the why, how, why not, when not and how not behind practical software architecture. Straight explanations, diagrams and examples. No mock interviews, quizzes or assessment panels.</p><p class="callout">Organized into '+groups.length+' topic groups and '+LESSONS.length+' notes. Use the search or choose a topic below.</p><div class="homegrid">'+groups.map(g=>{const first=LESSONS.find(y=>y.category===g);return '<button class="topiccard" data-go="'+first.id+'"><strong>'+esc(g)+'</strong><small>'+LESSONS.filter(y=>y.category===g).length+' notes · '+esc(first.title)+'</small></button>'}).join('')+'</div>'}else{const i=LESSONS.indexOf(x),prev=LESSONS[i-1],next=LESSONS[i+1];const deep=DEEP[current]||'';const trade=x.tradeoff||'',scenario=x.scenario||'';$('content').innerHTML='<div class="topbar"><button class="btn menu" id="menuButton">☰ Topics</button><button class="btn" id="homeButton">⌂ Notes index</button><button class="btn" id="shareButton">↗ Copy link</button><a href="index.html#'+x.id+'">Full lesson ↗</a></div><div class="eyebrow">'+esc(x.category)+' · Note '+(i+1)+' of '+LESSONS.length+'</div><h1>'+esc(x.title)+'</h1><p class="lead">'+esc(x.explanation)+'</p>'+section('why','Why · the problem',x.analogy||x.explanation)+section('how','How · the mechanism',x.mechanism)+diagram(x.id)+(deep?'<section class="panel deep"><div class="eyebrow">Detailed explanation</div>'+deep+'</section>':'')+section('example','Example · in practice',scenario)+((x.code)?'<section class="panel example"><div class="eyebrow">Implementation example</div><pre>'+esc(x.code)+'</pre></section>':'')+section('whynot','Why not · costs and trade-offs',trade)+section('whennot','When not · unsuitable situations',x.whenNot||('Avoid using this as a default when the guarantees or workload do not justify its operational costs. '+trade))+section('hownot','How not · common failure',x.howNot||('Do not mistake a successful demo for a correctness guarantee. '+scenario))+'<div class="footer"><button class="btn" id="prev" '+(!prev?'disabled':'')+'>← Previous</button><button class="btn primary" id="next" '+(!next?'disabled':'')+'>Next note →</button></div>';if(DIAGRAMS[current]){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>draw(b.dataset.mode));draw('normal')}if(prev)$('prev').onclick=()=>go(prev.id);if(next)$('next').onclick=()=>go(next.id);$('homeButton').onclick=()=>go('home');$('shareButton').onclick=()=>{const url=location.href.split('#')[0]+'#'+current;if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert('Link copied')).catch(()=>prompt('Copy link:',url));else prompt('Copy link:',url)};}$('content').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));const menu=$('menuButton');if(menu)menu.onclick=()=>toggleMenu(true)}
$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();nav()};$('overlay').onclick=()=>toggleMenu(false);window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1)||"home");if(id!==current){current=id;render()}});render();
</script></body></html>
